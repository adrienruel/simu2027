# Programme de David Lisnard (Nouvelle Énergie) : chiffrage sur le noyau (7 novembre 2026).
#
# Pas de document programmatique complet au 6/11/2026 : pages thématiques, carnets, Le livre noir, discours de Bayeux,
# fiches « Questions », entretiens ; 91 mesures recensées par programmes-2027.fr (fiche : programmes/lisnard/mesures.yaml).
#
# Règles : on ne reprend que les mesures, jamais les économies annoncées (80 Md€ la première année, 200 Md€ ensuite, dépense
# à 45 % du PIB : non saisis ; chaque mesure nommée est estimée) ; les montants des mesures (120 Md€ rendus aux actifs,
# 40 Md€ d'impôts de production, 20 000 places de prison) sont des paramètres ; dépense : crise ≥ prudent ≥ médian ≥
# optimiste ; recette : l'inverse. Retraites : 65 ans (décision d'Adrien, 07/11/2026).

lisnard_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

lisnard_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

lisnard_actifs:
  baisse_totale:
    valeur: 120.0
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Fiche « Questions » (03/10/2026) : 120 Md€ rendus aux actifs par la baisse des cotisations (≈ 400 € net par mois) ; CNEWS (28/10/2026) : CSG sur les revenus d'activité de 9,2 % à 6,6 %"
    note: "Montant de la mesure (paramètre), pas une recette annoncée. Arbitrage : la baisse de CSG (2,6 points, ≈ 28 Md€) fait partie des 120 Md€ ; le reste en cotisations salariales. Calcul : moteur/bibliotheque.baisse_prelevements_salaries (impôt sur le revenu en plus, prestations en moins, effet d'offre par OpenFisca)."
  csg_points:
    valeur: 2.6
    unite: points
    statut: SOURCE
    source: "CNEWS (28/10/2026) : de 9,2 % à 6,6 %"
  montee:
    valeur: {2028: 0.25, 2029: 0.5, 2030: 0.75, 2031: 1.0}
    unite: taux
    statut: DECISION
    note: "Arbitrage : le candidat finance la baisse par 80 Md€ d'économies la première année puis 200 Md€ ; montée en quatre ans à partir de la loi de finances 2028."
  part_ir_retrouvee:
    valeur: {crise: 0.6, prudent: 0.65, median: 0.72, optimiste: 0.8}
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que zemmour_csg.part_ir_retrouvee"

lisnard_retraites:
  age_cible:
    valeur: 65
    unite: sans_unite
    statut: DECISION
    source: "Page programme non datée : âge légal de 65 ans ; les fiches d'octobre 2026 écartent une nouvelle borne d'âge"
    note: "Décision d'Adrien (07/11/2026) : 65 ans, même rythme que Bertrand, Zemmour et Philippe (un trimestre par génération à partir de la génération 1966, 65 ans pour la génération 1969)."
  premiere_generation:
    valeur: 1966
    unite: sans_unite
    statut: DECISION
  pas_par_generation:
    valeur: 0.25
    unite: sans_unite
    statut: DECISION
  desindexation_part:
    valeur: {crise: 0.3, prudent: 0.35, median: 0.4, optimiste: 0.45}
    unite: taux
    statut: HYPOTHESE
    source: "Fiche « Questions » (03/10/2026) : amorçage de la capitalisation par la désindexation des pensions au-delà d'environ 2 000 € par mois ; encadrement : pensions de droit propre au-dessus de 2 000 € brut ≈ 35 à 45 % de la masse des pensions (DREES, Les retraités et les retraites, 2025)"
    note: "Économie non chiffrée par le candidat : estimée. Lecture : les pensions de plus de 2 000 € ne sont pas revalorisées de 2028 à 2032 (le quinquennat), puis le sont de nouveau ; la perte de niveau s'éteint avec les retraités concernés (durée moyenne ≈ 18 ans). Le fonds de capitalisation amorcé est public (comme le Fonds de réserve pour les retraites) : l'économie reste dans les comptes publics."
  desindexation_annees:
    valeur: 5
    unite: annees
    statut: HYPOTHESE
    note: "Amorçage sur le quinquennat (arbitrage)."

