    valeur: 15.0
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Débat LCP du 5/10/2026 : taxer davantage les très gros héritages « pour baisser la CSG sur les salaires » ; taille de la baisse : ≈ 15 Md€, le montant que le candidat associe à la mesure (paramètre de la mesure, comme les 3 Md€ du plan VSS de Tondelier)"
    note: "Baisse uniforme du taux de CSG sur les revenus d'activité (salariés du privé et du public) : part 15 / (CSG du travail) de la suppression totale calculée pour Zemmour, avec l'impôt sur le revenu en plus (zemmour_csg.part_ir_retrouvee) et la prime d'activité en moins. Recettes des successions : glucksmann_mesures.grosses_successions (estimées à part)."
