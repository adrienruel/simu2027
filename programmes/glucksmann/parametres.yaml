# Programme de Raphaël Glucksmann (Place publique) : chiffrage sur le noyau (7 novembre 2026).
#
# Pas de programme présidentiel publié au 6/11/2026 : « Notre vision pour la France. Acte I » (Place publique, 23 juin
# 2025, présenté comme une vision, pas un catalogue de mesures), lettre du 25 août 2026, tract de la primaire, débats de
# septembre et octobre 2026. 112 mesures recensées par programmes-2027.fr ; fiche : programmes/glucksmann/mesures.yaml.
#
# Règles (README, décisions d'Adrien) : on ne reprend que les mesures, jamais les recettes annoncées (≈ 15 Md€ attendus
# des grosses successions : non saisis) ; chaque ligne sans source est estimée en crise / prudent / médian / optimiste ;
# dépense : crise ≥ prudent ≥ médian ≥ optimiste ; recette : l'inverse. Format des mesures : moteur/programme_simple.py.
#
# Calendrier (arbitrage) : élection en mai 2027 ; tout à partir de la loi de finances 2028, SMIC en deux ans.

glucksmann_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

glucksmann_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

glucksmann_smic:
  smic_net_programme:
    valeur: 1600
    unite: eur_mois
    annee_euros: 2027
    statut: SOURCE
    source: "Place publique, « Notre vision pour la France. Acte I » (23 juin 2025) : SMIC porté à 1 600 € net dans les deux ans suivant l'élection"
    note: "En euros de 2027, ramené en euros de 2026 par l'inflation de 2027, puis en brut par le barème OpenFisca de 2026. Montée : moitié en 2028, entier en 2029 (« dans les deux ans »)."
  allegements_suivent_smic:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Le texte ne dit rien des allègements : lecture de la loi actuelle (allègements définis en multiples du SMIC), comme pour Arthaud. Variante « nominalisés » (lecture Tondelier) : coût au SMIC plus élevé, plus d'emplois perdus."
  diffusion_jusqu_a:
    valeur: 1.4
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.diffusion_jusqu_a (Dares, Insee : diffusion jusqu'à 1,3 à 1,5 SMIC)"
    note: "Les conférences salariales par branche ne sont pas chiffrées."
  elasticite_emploi:
    valeur: {crise: -1.0, prudent: -0.8, median: -0.6, optimiste: -0.4}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Mêmes valeurs que tondelier_smic.elasticite_emploi (Kramarz et Philippon, 2001 ; Crépon et Desplatz, 2001 ; L'Horty, 2006)"
    note: "Élasticité constante (emplois × (1 − rapport des coûts^élasticité)), montée en trois ans (2028-2030)."
  part_marge_absorbee:
    valeur: 0.5
    unite: taux
    statut: HYPOTHESE
    note: "Même valeur que Tondelier et Arthaud."
  valeur_emploi_chomeur:
    valeur: 9000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.valeur_emploi_chomeur"

