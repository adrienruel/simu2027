glucksmann_canaux:
  reformes_structurelles:
    valeur: {pmr: -0.5, epl: 0, debut: 2028}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Égert et Gal (2017), OCDE, document de travail n° 1354"
    note: "Marchés de produits : facture d'électricité indexée sur le coût de production (GLU-ENE-03, prix réglementés, −0,5) ; la commande publique orientée vers le « Fabriqué en France » est hors champ. Barème restreint au champ des deux indicateurs de l'OCDE (relecture neutre n° 2, point 2 ; DÉCISION d'Adrien du 12/11/2026, docs/reformes_structurelles.md) : marchés de produits = réglementation de l'électricité, du gaz, des télécommunications, de la poste, du rail, de l'aérien et du fret routier (indicateur ETCR : entrée, propriété publique, structure du marché, prix réglementés) ; protection de l'emploi = règles du licenciement des contrats réguliers. Hors champ, donc non comptés pour aucun programme : normes générales, simplification, commande publique, banques et assurances, autoroutes, aéroports, audiovisuel, santé, logement, commerce extérieur, prix de détail. Grille : 1 = un secteur entier du champ (nationalisation, refonte, interdiction des licenciements), 0,5 = mesure ciblée dans un secteur du champ (une grande entreprise, prix réglementés, entrée interdite ou facilitée sur un segment) ; positif = libéralise, négatif = réglemente ; plafond ±2."
