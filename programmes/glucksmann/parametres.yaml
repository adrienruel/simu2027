# ---------------------------------------------------------------- effets en tonnes (phase 2, 11/11/2026)
# Même méthode que tondelier_ecologie (moteur/ecologie/emissions.profil, lu par ProgrammeSimple.mesures_ecologie).
# Négatif : émissions évitées. Prudence : dans le prudent, l'effet favorable au climat est le plus faible.
glucksmann_ecologie:
  maprimerenov:
    valeur: {id: "GLU-ENE-05", libelle: "MaPrimeRénov' relancée et simplifiée", secteur: "batiments", debut: 2028, plein: 2050, effet_mt: {crise: -0.33, prudent: -0.4, median: -0.71, optimiste: -1.22}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que tondelier_ecologie.renovation : Anah, bilan 2024 (≈ 91 000 rénovations d'ampleur pour ≈ 2,3 à 3,4 Md€ de MaPrimeRénov', gain énergétique moyen de 65 %) ; Citepa, Secten 2026 (54,6 Mt pour les bâtiments)"
    note: "≈ +1,2 Md€ par an (glucksmann_mesures.maprimerenov) ≈ 48 000 rénovations d'ampleur de plus par an (≈ 25 000 € d'aide chacune), ≈ 1,1 million en 2050. Émissions évitées par rénovation (Tondelier) : 0,6 t (crise, prudent), 0,8 t (médian), 1,1 t (optimiste) ; part additionnelle (travaux qui ne se feraient pas sans l'aide) : 50 %, 60 %, 80 %, 100 %."
  ecole_batiments:
    valeur: {id: "GLU-EDU-06", libelle: "Plan de rénovation des écoles", secteur: "batiments", debut: 2028, plein: 2047, effet_mt: {crise: -0.25, prudent: -0.3, median: -0.5, optimiste: -0.7}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Banque des territoires (2023) : ≈ 40 Md€ en vingt ans pour la rénovation énergétique du bâti scolaire ; Citepa : tertiaire ≈ 17 Mt, dont l'enseignement ≈ 20 % (≈ 3,4 Mt)"
    note: "Le plan complet baisserait d'environ 60 % les émissions du bâti scolaire (≈ 2 Mt) ; l'État en finance la moitié (1 Md€ par an sur 2) : ≈ 1 Mt. Part additionnelle face au décret tertiaire, qui oblige déjà à −40 % en 2030 : 25 % (crise), 30 % (prudent), 50 % (médian), 70 % (optimiste)."
  ticket_climat:
    valeur: {id: "GLU-TER-01b", libelle: "Ticket climat : titre unique des transports en commun", secteur: "transports", debut: 2028, plein: 2030, effet_mt: {crise: -0.26, prudent: -0.51, median: -1.02, optimiste: -1.54}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que tondelier_ecologie.ticket_climat (évaluation du Deutschlandticket : ≈ 3 % des émissions des voitures particulières)"
    note: "Effet de Tondelier (0,5 / 1 / 2 / 3 % des émissions des voitures) réduit au budget de la mesure : 1,2 Md€ en prudent contre 1,5 Md€ chez Tondelier (× 0,8)."
  transport_rural:
    valeur: {id: "GLU-TER-04", libelle: "Service public de transport rural", secteur: "transports", debut: 2028, plein: 2030, effet_mt: {crise: -0.02, prudent: -0.05, median: -0.1, optimiste: -0.15}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Encadrement : transport à la demande rural, taux de remplissage faible (Cerema, évaluations de services de transport à la demande) ; budget ≈ 0,2 à 0,3 Md€"
    note: "Report de quelques dizaines de millions de trajets en voiture, en partie par des véhicules peu remplis : 0,02 à 0,15 Mt."
  niches_transports:
    valeur: {id: "GLU-FIS-05", libelle: "Exonérations fiscales des transports polluants supprimées", secteur: "transports", debut: 2028, plein: 2030, effet_mt: {crise: -0.15, prudent: -0.3, median: -0.6, optimiste: -0.9}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Voies et moyens II (PLF 2026) : remboursement partiel de TICPE au transport routier ≈ 1,3 Md€ (≈ 15,7 c par litre de gazole), kérosène des vols intérieurs ≈ 0,4 Md€ ; Citepa : poids lourds ≈ 30 Mt, vols intérieurs de métropole 1,5 Mt (DGAC 2024)"
