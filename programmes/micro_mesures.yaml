    note: "Roadmap 3.4 (22/11/2026) : la population n'a ni la durée d'indemnisation ni l'ancienneté ; le montant du moteur (à plein effet) se répartit au prorata de l'allocation des chômeurs. L'emploi passe par le canal de l'assurance chômage du programme, pas par la micro."
  ATT-ECO-01:
    operations:
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.taux_global, ajout: -0.0475}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.deductible, ajout: -0.0475}}
    note: "« Droit au brut » : 52 Md€ de cotisations salariales en moins, proportionnelles au salaire (lecture du moteur). Codé comme une baisse de 4,75 points de la part déductible de la CSG d'activité (52 / 100,7 × 9,2 points), qui a la même assiette et la même déductibilité que les cotisations salariales ; les droits à retraite ne changent pas."
