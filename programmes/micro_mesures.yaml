# Phase F2 : mesures des programmes codées dans OpenFisca-France et calculées sur la population synthétique
# (outils/openfisca_mesures.py). Clé : programme, puis identifiant de la mesure (comme dans parametres.yaml ; une
# ligne couvre toutes les mesures de même identifiant). Chaque entrée : une liste d'opérations, et une note qui dit la
# lecture retenue quand le programme ne donne pas tout (DÉCISION, à valider par Adrien).
#
# Opérations :
#   parametre : {chemin, valeur | facteur | ajout}  paramètre d'OpenFisca changé à partir de 2020
#   tranche   : {bareme, seuil, taux}                tranche ajoutée à un barème
#   variable  : {nom, facteur}                       variable d'OpenFisca multipliée (prestation revalorisée)
#   formule   : {nom, ...}                           règle nouvelle écrite dans outils/openfisca_mesures.py
#   population: {assurance_chomage: {programme, mesure, age_max?, seuil_mensuel?}}  allocations de chômage changées
#               du montant du moteur, au prorata de l'allocation des chômeurs concernés (3.4)
#   formule   : {nom: consommation, postes: [codes], programme, mesure}  prix de postes de consommation (TVA, accises,
#               prix bloqués) : montant du moteur réparti selon la dépense du décile (Budget de famille 2017, TF106, 3.1)
#   formule   : {nom: patrimoine, composante, tranches?, programme, mesure}  impôts sur le patrimoine et les
#               successions : montant du moteur réparti selon le patrimoine moyen de la tranche de revenu disponible
#               (Histoire de vie et Patrimoine 2020-2021, 3.2)
#   formule   : {nom: cotisations_employeur, programme, mesure, bande_smic?, part_montant?}  cotisations des
#               employeurs privés : part de long terme sur les salaires (entreprises.incidence_menages.salaires),
#               au prorata du salaire brut des salariés de la bande
#   formule   : {nom: jeunes_enfants, age_max, programme, mesure}  congés de naissance et accueil du jeune enfant :
#               montant du moteur par enfant de age_max ans au plus
#   formule   : {nom: heures_supplementaires, programme, mesure, bande_smic?}  heures supplémentaires (absentes de
#               la population) : montant du moteur sur les salariés du privé de 1 à 2,5 SMIC, au prorata du brut
#   population: {pensions: {seuil_mensuel, facteur | programme+mesure, fin?}}  pensions au-delà d'un seuil mensuel
#               brut multipliées (gel, sous-indexation) ; avec programme et mesure, facteur calé sur le montant du moteur
#   population: {pension_minimum: {mensuel_brut}}  pensions des carrières complètes portées à un minimum (3.3)
#   population: {age_depart: {age_actuel, age_cible}}  âge de départ changé (roadmap 3.3, openfisca_mesures.age_depart) :
#               profil de départ de la population de 2026 décalé de l'écart entre l'âge du programme et celui du
#               statu quo à terme (64 ans) ; mêmes règles pour tous les programmes
# Non codées ici (raison dans docs/microsimulation.md) : conditions de nationalité ou de résidence (la population
# n'a pas cette information), niches non nommées, mesures sans barème publié.

bertrand:
  BER-ECO-01:
    operations: [{population: {assurance_chomage: {programme: bertrand, mesure: BER-ECO-01}}}]
    note: "Roadmap 3.4 (22/11/2026) : la population n'a ni la durée d'indemnisation ni l'ancienneté ; le montant du moteur (à plein effet) se répartit au prorata de l'allocation des chômeurs. L'emploi passe par le canal de l'assurance chômage du programme, pas par la micro."
  BER-RET-01:
    operations: [{population: {age_depart: {age_actuel: 64, age_cible: 65}}}]
    note: "Roadmap 3.3 (21/11/2026) : âge de départ de 65 ans contre 64 au statu quo à terme, profil de départ de 2026 décalé de l'écart (outils/openfisca_mesures.age_depart). Durée d'assurance, carrières longues et décote non représentées."
  BER-RET-02:
    operations: [{formule: {nom: capitalisation, parametre: lectures_communes.capitalisation}}]
    note: "Part salariale de la capitalisation obligatoire, lecture commune du 16/11/2026 (dispositif de Retailleau) : revenu disponible en moins, versé à un fonds hors des administrations. Nulle en 2026."
  BER-FIS-01:
    operations: [{parametre: {chemin: "impot_revenu.bareme_ir_depuis_1945.bareme.brackets[1].rate", valeur: 0.09}}]
  BER-FIS-02:
    operations: [{parametre: {chemin: taxation_capital.prelevement_forfaitaire.partir_2018.taux_prelevement_forfaitaire_rev_capital_eligibles_pfu_interets_dividendes_etc, ajout: 0.02}}]
    note: "Part impôt sur le revenu du prélèvement forfaitaire unique : 12,8 % → 14,8 %."

