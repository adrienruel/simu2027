    note: "Roadmap 3.3 (21/11/2026, ajouté le 22/11) : âge de départ de 65 ans contre 64 au statu quo à terme, profil de départ de 2026 décalé de l'écart (outils/openfisca_mesures.age_depart), même règle que BER-RET-01 et PHI-RET-01."
