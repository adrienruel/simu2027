    operations: [{formule: {nom: patrimoine, composante: net, tranches: ["P95_99", "P99"], programme: glucksmann, mesure: GLU-FIS-01}}]
    note: "Roadmap 3.2 (22/11/2026) : montant du moteur réparti selon le patrimoine net moyen des tranches de revenu disponible (Insee, Histoire de vie et Patrimoine 2020-2021) ; champ des plus gros héritages : 5 % de revenus les plus hauts. Patrimoine du ménage lui-même, comme approximation de celui des héritiers pour les successions."
  GLU-ENE-03:
    operations: [{formule: {nom: consommation, postes: ["0451"], programme: glucksmann, mesure: GLU-ENE-03}}]
    note: "Roadmap 3.1 (22/11/2026) : montant du moteur (à plein effet) réparti selon la dépense moyenne des ménages de chaque décile de niveau de vie pour l'électricité (Insee, Budget de famille 2017, TF106 : 0451). Répercussion entière sur les prix ; pas de changement de quantités."
  GLU-EMP-02:
    operations: [{population: {assurance_chomage: {programme: glucksmann, mesure: GLU-EMP-02}}}]
    note: "Roadmap 3.4 (22/11/2026) : la population n'a ni la durée d'indemnisation ni l'ancienneté ; le montant du moteur (à plein effet) se répartit au prorata de l'allocation des chômeurs. L'emploi passe par le canal de l'assurance chômage du programme, pas par la micro."
  GLU-RET-01:
    operations: [{population: {age_depart: {age_actuel: 64, age_cible: 62}}}]
    note: "Roadmap 3.3 (21/11/2026) : âge de départ de 62 ans contre 64 au statu quo à terme, profil de départ de 2026 décalé de l'écart (outils/openfisca_mesures.age_depart). Durée d'assurance, carrières longues et décote non représentées."
  GLU-FIS-01b:
    operations:
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.taux_global, ajout: -0.0137}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.deductible, ajout: -0.0101}}
    note: "CSG sur les revenus d'activité abaissée de 15 Md€ : 15 / 100,7 Md€ de CSG d'activité (bibliotheque.csg_activite) × 9,2 points = 1,37 point, réparti entre parts déductible et non déductible dans leur proportion (6,8 / 9,2)."
  GLU-ECO-01:
    operations: [{population: {smic_net_2027: 1600, diffusion: 1.4}}]
    note: "SMIC à 1 600 € net (euros de 2027), même règle que le moteur."

attal:
  ATT-EMP-01:
