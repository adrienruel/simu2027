    note: "Roadmap 3.5 (22/11/2026) : cotisations salariales réduites de 93,6 Md€ (privé 72,1, agents publics 21,5 : montants bruts du moteur en 2032) sur ≈ 106,6 Md€ de cotisations salariales de la population (OpenFisca 2026), au prorata de chaque salarié. Facteur 1 − 93,6 / 106,6 = 0,122."
  LIS-ECO-07:
    operations:
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.deductible, ajout: -0.026}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.taux_global, ajout: -0.026}}
