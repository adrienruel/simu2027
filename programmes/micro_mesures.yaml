# Phase F2 : mesures des programmes codées dans OpenFisca-France et calculées sur la population synthétique
# (outils/openfisca_mesures.py). Clé : programme, puis identifiant de la mesure (comme dans parametres.yaml ; une
# ligne couvre toutes les mesures de même identifiant). Chaque entrée : une liste d'opérations, et une note qui dit la
# lecture retenue quand le programme ne donne pas tout (DÉCISION, à valider par Adrien).
#
# Opérations :
#   parametre : {chemin, valeur | facteur | ajout}  paramètre d'OpenFisca changé à partir de 2020
#   tranche   : {bareme, seuil, taux}                tranche ajoutée à un barème
#   variable  : {nom, facteur}                       variable d'OpenFisca multipliée (prestation revalorisée)
#   formule   : {nom, ...}                           règle nouvelle écrite dans outils/openfisca_mesures.py
# Non codées ici (raison dans docs/microsimulation.md) : conditions de nationalité ou de résidence (la population
# n'a pas cette information), patrimoine (ISF, taxe Zucman, IFI), niches non nommées, mesures sans barème publié.

bertrand:
  BER-FIS-01:
    operations: [{parametre: {chemin: "impot_revenu.bareme_ir_depuis_1945.bareme.brackets[1].rate", valeur: 0.09}}]
  BER-FIS-02:
    operations: [{parametre: {chemin: taxation_capital.prelevement_forfaitaire.partir_2018.taux_prelevement_forfaitaire_rev_capital_eligibles_pfu_interets_dividendes_etc, ajout: 0.02}}]
    note: "Part impôt sur le revenu du prélèvement forfaitaire unique : 12,8 % → 14,8 %."

tondelier:
  REC-10:
    operations: [{tranche: {bareme: impot_revenu.bareme_ir_depuis_1945.bareme, seuil: 250000, taux: 0.60}}]
  REC-11:
    operations: [{parametre: {chemin: "impot_revenu.bareme_ir_depuis_1945.bareme.brackets[1].rate", valeur: 0.09}}]
  REC-13:
    operations: [{parametre: {chemin: impot_revenu.calcul_revenus_imposables.deductions.abatpen.taux, valeur: 0.0}}]
  COT-04:
    operations:
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.deductible, ajout: 0.01}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.activite.taux_global, ajout: 0.01}}
    note: "CSG d'activité +1 point (déductible). Les autres revenus (+1 point sur tous les revenus) : pensions et capital non changés ici, faute de lecture sûre de la mesure sur eux ; écart attendu."
  REC-20/21:
    operations:
      - {parametre: {chemin: taxation_capital.prelevement_forfaitaire.partir_2018.taux_prelevement_forfaitaire_rev_capital_eligibles_pfu_interets_dividendes_etc, ajout: 0.03}}
      - {parametre: {chemin: taxation_capital.prelevements_sociaux.csg.taux_deductible.revenus_du_patrimoine, ajout: 0.03}}
  PRE-11:
    operations: [{variable: {nom: aide_logement, facteur: 1.10}}]
  PRE-12:
    operations: [{formule: {nom: af_premier_enfant, part_bmaf: 0.16}}]
    note: "Lecture du chiffrage du programme : la moitié du montant pour deux enfants (32 % de la base mensuelle), modulée selon les revenus comme les allocations familiales."
  PRE-13:
    operations: [{parametre: {chemin: prestations_sociales.prestations_etat_de_sante.invalidite.aah.montant, ajout: 250}}]
  PRE-10:
    operations:
      - {parametre: {chemin: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_m.montant_de_base_du_rsa, facteur: 1.20}}
      - {parametre: {chemin: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_cond.age_minimum_allocataire, valeur: 18}}
      - {parametre: {chemin: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_cond.age_pac, valeur: 18}}
    note: "Garantie d'autonomie à 50 % du SMIC net (≈ 790 € contre ≈ 660 € : + 20 %) à la place du RSA, dès 18 ans. Recours : celui du RSA (le programme dit « sans contrepartie », le recours pourrait être plus haut)."

lisnard:
  LIS-SOC-01:
    operations: [{parametre: {chemin: impot_revenu.calcul_impot_revenu.plaf_qf.plafond_avantages_procures_par_demi_part.general, valeur: 1000000000.0}}]

roussel:
  PCF-RET-03:
    operations:
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.deductible.taux_plein, valeur: 0.0}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.deductible.taux_median, valeur: 0.0}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.deductible.taux_reduit, valeur: 0.0}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.imposable.taux_plein, valeur: 0.0}}
      - {parametre: {chemin: prelevements_sociaux.contributions_sociales.csg.remplacement.pensions_retraite_invalidite.imposable.taux_median, valeur: 0.0}}
  PCF-LOG-02:
    operations: [{variable: {nom: aide_logement, facteur: 1.05}}]
    note: "Revalorisation non chiffrée par le programme : 5 %, comme le chiffrage du moteur."
  PCF-PRE-01:
    operations:
      - {parametre: {chemin: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_cond.age_minimum_allocataire, valeur: 18}}
      - {parametre: {chemin: prestations_sociales.solidarite_insertion.minima_sociaux.rsa.rsa_cond.age_pac, valeur: 18}}

melenchon:
  LFI-PRE-04:
    operations: [{variable: {nom: aide_logement, facteur: 1.10}}]
  LFI-PRE-03:
    operations: [{parametre: {chemin: prestations_sociales.prestations_etat_de_sante.invalidite.aah.montant, valeur: 1700}}]
    note: "AAH portée à 1 700 € (SMIC net revalorisé du programme) ; plafond de ressources relevé d'autant par la formule d'OpenFisca."
  LFI-PRE-01:
    operations: [{formule: {nom: garantie_niveau_vie, seuil_mensuel: 1337}}]
    note: "Complément qui porte le niveau de vie du ménage (revenu disponible par unité de consommation, après les autres mesures de la même simulation) à 1 337 € par mois ; recours complet (prestation automatique, p. 72)."

le_pen:
  RN-FIS-03:
    operations: [{formule: {nom: ir_jeunes, age_max: 29, plafond_smic: 4}}]
    note: "Foyer dont le déclarant principal a moins de 30 ans et dont le revenu brut global est sous quatre SMIC bruts annuels : impôt sur le revenu nul."
  RN-FAM-01:
    operations: [{variable: {nom: asf, facteur: 2.0}}]

philippe:
  PHI-FIS-02:
    operations: [{formule: {nom: ir_naissance, age_enfant_max: 2, plafond: 3000}}]
    note: "Foyer avec un enfant de moins de 3 ans : impôt sur le revenu annulé jusqu'à 3 000 € (réduction de 3 000 € au-delà), comme le site du 12/11/2026."

arthaud:
  ART-FAM-01:
    operations:
      - {variable: {nom: af, facteur: 1.012}}
      - {variable: {nom: ppa, facteur: 1.012}}
      - {variable: {nom: aide_logement, facteur: 1.012}}
    note: "Revalorisation de 1,2 % (inflation) des allocations familiales, de la prime d'activité et des aides au logement gelées en 2027."
