# Programme de Marine Tondelier (Les Écologistes) : chiffrage mesure par mesure sur le noyau (5 novembre 2026).
#
# Sources du programme : « Pour une prospérité écologique » (juillet 2026, 208 p.) et dossier de presse « Budget 2027 :
# la grande transmission doit financer la grande transition » (26 août 2026). Fiche des mesures, citations vérifiées :
# programmes/tondelier/mesures.yaml (id REC-…, PRE-…).
#
# Règles (README) : on ne reprend que les mesures, jamais les recettes ni les économies annoncées (15 Md€ sur les
# successions : comparaison seulement) ; une hypothèse sans source est prise prudente ; le modèle estime crise, prudent,
# médian, optimiste.
#
# Format d'une mesure (groupe tondelier_mesures) : montant en Md€ de 2026 à l'économie de 2029 (économie de 2026
# placée en 2029), mesure pleinement en place ; + = recette en plus (poste recettes) ou dépense en plus (bloc de
# dépense). moteur : ce que suit le montant après 2029 (pib, pensions, successions, tva, capital, is, bloc:<nom>,
# fixe) ; debut et plein : première année et année de pleine montée (linéaire) ; fin : dernière année (facultatif) ;
# fp : dépense de rémunération publique, dont une part revient en prélèvements (tondelier_fp.part_prelevements).
#
# Arbitrages pris par Claude le 05/11/2026 (Adrien : « si le dossier ne règle pas, fais-les toi-même ») : voir
# docs/tondelier.md, section « Arbitrages ».

tondelier_calendrier:
  premiere_annee:
    valeur: 2027
    unite: sans_unite
    statut: DECISION
    note: "Élection en mai 2027 : SMIC relevé dès 2027 (le programme le dit), le reste à partir de la loi de finances 2028. Les montants de 2027 et 2028 s'ajoutent à la dette de fin 2028 (contexte dette_depart)."

tondelier_smic:
  smic_brut_mensuel_2026:
    valeur: 1823.03
    unite: eur_mois
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Revalorisation du 1er janvier 2026 (+1,18 %) : 12,02 € de l'heure, 1 823,03 € par mois pour 35 heures (à vérifier sur le décret)"
  smic_programme:
    valeur: 2000
    unite: eur_mois
    annee_euros: 2027
    statut: SOURCE
    source: "Programme, p. 55 : « Passer le salaire minimum à 2000€ brut par mois dès 2027 »"
    note: "En euros de 2027 ; ramené en euros de 2026 par l'inflation de 2027 (inflation.base). Les allègements de cotisations sont « nominalisés et désindexés » (p. 67) : ils restent au barème de 2026, donc le coût du travail au SMIC monte de toute la hausse (table OpenFisca de 2026 lue au salaire relevé)."
  diffusion_jusqu_a:
    valeur: 1.4
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : Dares et Insee (diffusion des hausses du SMIC aux salaires voisins, jusqu'à 1,3 à 1,5 SMIC, en décroissant)"
    note: "La hausse décroît linéairement de son niveau au SMIC jusqu'à zéro à 1,4 SMIC (coût employeur)."
  elasticite_emploi:
    valeur: {crise: -1.0, prudent: -0.8, median: -0.6, optimiste: -0.4}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : Kramarz et Philippon (2001) : élasticité de l'emploi au coût du travail au voisinage du SMIC proche de −1,5 ; Crépon et Desplatz (2001), L'Horty (2006) : −0,4 à −1 pour les allègements ciblés"
    note: "Élasticité de l'emploi au coût employeur, appliquée à la hausse de coût de chaque tranche. Montée en trois ans (2027-2029)."
  valeur_emploi_chomeur:
    valeur: 9000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : allocation moyenne d'un chômeur indemnisé ≈ 1 050 € par mois (Unédic), un sur deux indemnisé ; garantie d'autonomie pour une partie des autres"
    note: "Dépense publique en plus pour un emploi perdu, en plus des prélèvements perdus (OpenFisca 2026, au coût de l'emploi). Suit les salaires."
  part_marge_absorbee:
    valeur: 0.5
    unite: taux
    statut: HYPOTHESE
    note: "Part de la hausse du coût du travail prise sur les marges (le reste passe dans les prix) : l'IS perd 25 % de cette part."

tondelier_fp:
