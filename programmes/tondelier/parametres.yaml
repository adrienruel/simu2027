    valeur: {id: REC-40, libelle: "TVA écologique : 20 % (aérien domestique, vente à emporter, hôtellerie de luxe, rénovation non énergétique, ultra-transformés), 5,5 % (transports publics, réparation)", poste: recettes, moteur: tva, debut: 2028, plein: 2028,
