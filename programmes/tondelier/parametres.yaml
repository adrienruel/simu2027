    valeur: auto
    unite: sans_unite
    statut: SOURCE
    source: "Calculée : prélèvements (cotisations, CSG, CRDS, impôt sur le revenu) sur les rémunérations publiques / coût des agents, OpenFisca 2026 (statu_quo.prelevements_activite) : 57 %"
    note: "Une hausse de rémunération publique coûte son coût employeur ; 57 % revient en prélèvements (compte des administrations publiques consolidé)."
  remunerations_publiques:
    valeur: auto
    unite: sans_unite
    statut: SOURCE
    source: "Coût employeur des agents publics du statu quo (OpenFisca 2026 sur les distributions DGAFP) : 390 Md€"
  parts_masse:
    valeur: {categorie_A_enseignants: 0.16, categorie_A_autres: 0.27, categorie_B: 0.19, categorie_C: 0.38}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : DGAFP, Rapport annuel sur l'état de la fonction publique 2025 : catégorie A 38 % des agents (dont enseignants ≈ 15 %), B 18 %, C 44 % ; parts de masse pondérées par le salaire moyen de chaque catégorie"
  pensions_fonction_publique:
    valeur: 85.0
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : pensions de l'État (civils et militaires, ≈ 60 Md€) et de la CNRACL (≈ 25 Md€), PLFSS 2026 et compte d'affectation spéciale Pensions"
    note: "Les pensions des fonctionnaires suivent le traitement de fin de carrière : une hausse de rémunération se retrouve dans les pensions des départs suivants (montée sur 35 ans)."

tondelier_retraites:
  profil_62_ans:
