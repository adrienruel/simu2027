    note: "La recette baisse avec la part des adultes nés en 2014 ou après (les jeunes fument autant que les autres : prudent). Les économies de santé ne sont pas comptées faute de chiffrage sourcé (règle : économies sourcées seulement)."

tondelier_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que l'ajustement budgétaire commun (macro.multiplicateur, macro.annees_effet_ajustement) : l'impulsion budgétaire nette des mesures (hausse du solde primaire = ajustement, baisse = relance) agit sur le PIB et s'efface linéairement. Les recettes suivent le PIB (part des recettes dans le PIB du statu quo)."

tondelier_mesures:

  # ---------------------------------------------------------------- recettes : patrimoine et successions
  zucman:
    valeur: {id: REC-01, libelle: "Taxe Zucman : impôt plancher de 2 % au-delà de 100 M€", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 3.0, prudent: 5.0, median: 8.0, optimiste: 12.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ≈ 20 Md€ en statique (G. Zucman, 2025) ; pertes d'assiette fortes discutées (exil, valorisation des titres non cotés, biens professionnels). Prudent au quart du statique"
    note: "Impôt plancher différentiel (dossier de presse, p. 5) : l'ISF et l'impôt sur le revenu s'imputent ; l'extension de l'exit tax (REC-02) est comptée comme une réduction de l'exil, sans recette propre."
  isf_climatique:
    valeur: {id: REC-03, libelle: "ISF à composante climatique (seuil 1,3 M€) à la place de l'IFI", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.5, prudent: 2.0, median: 2.5, optimiste: 3.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ISF 2017 ≈ 4,2 Md€, IFI ≈ 2,2 Md€ (DGFiP) ; barème de l'ISF 2017 (0,5 à 1,5 %, seuil 1,3 M€, dossier de presse p. 5)"
    note: "Gain net sur l'IFI ; composante climatique neutre en recette (modulation du barème)."
  successions:
    valeur: {id: REC-04/05/06/07, libelle: "Successions : +10 % au-delà de 4 M€, +10 % au-delà de 13 M€, Dutreil, assurance-vie, plus-values latentes", poste: recettes, moteur: successions, debut: 2028, plein: 2029,
             montant: {crise: 3.0, prudent: 4.0, median: 7.0, optimiste: 10.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : flux transmis 476 Md€ en 2026 (dossier de presse, p. 5) ; héritages de plus de 13 M€ taxés ≈ 10 % (idem) ; hypothèse : part des héritages au-delà de 4 M€ ≈ 8 % du flux, au-delà de 13 M€ ≈ 4 %, soit ≈ 6 Md€ en statique pour les deux tranches, plus Dutreil plafonné, fin de l'abattement assurance-vie et du démembrement, plus-values latentes"
    note: "Recette annoncée par le parti : ≈ 15 Md€ en régime de croisière (dossier de presse, p. 6) : NON SAISIE (règle), comparaison seulement. Prudent : forte optimisation (donations, expatriation, assurance-vie)."

  # ---------------------------------------------------------------- recettes : revenus
  ir_tranche_60:
    valeur: {id: REC-10, libelle: "Impôt sur le revenu : tranche à 60 % au-delà de 250 000 € par part", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
