tondelier_tabac:
  accises_tabac:
    valeur: 13.0
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : droits de consommation sur les tabacs ≈ 13 à 14 Md€ par an (DGDDI, 2024-2025)"
