# Programme de Marine Tondelier (Les Écologistes) — mesures à portée budgétaire ou macroéconomique
#
# Source principale : « Pour une prospérité écologique — Le nouveau programme des Écologistes », juillet 2026,
# 208 pages, 557 mesures (vdef-programme-1.pdf). Les numéros de page sont ceux du PDF (identiques à la pagination
# imprimée). `citation` est un extrait exact du texte, vérifié automatiquement (outils/verifier_citations.py).
# Sources secondaires (dossiers de presse de la campagne, non lus directement) : `source_secondaire: a_verifier`.
#
# Règles appliquées (décisions d'Adrien, novembre 2026) :
#  - on ne reprend que les mesures, jamais les économies ni les recettes annoncées par le candidat ;
#  - une économie sans source est estimée en prudent / médian / optimiste (statut economie_declarative) ;
#  - les montants de dépense inscrits dans le programme (7 Md€ adaptation, 3 Md€ VSS) sont des paramètres de mesure.
#
# statut :
#   chiffrable           paramètres complets dans le texte
#   hypothese            mesure claire, paramètre(s) manquant(s) : valeur proposée dans `a_fixer`, à valider
#   economie_declarative économie ou recette affichée sans chiffrage : à estimer par le modèle (3 scénarios)
#   macro                pas de ligne budgétaire directe : passe par un canal macroéconomique
#   hors_budget          flux financier ou patrimonial (dette, actifs), hors solde primaire courant
# poids (indicatif, pour ordonner le codage, à remplacer par le chiffrage du modèle) :
#   lourd > 5 Md€/an probable ; moyen 1 à 5 ; faible < 1
# instrument : nom de l'instrument de la bibliothèque de mesures (claude/Multi_programmes.md, point 3).

programme:
  candidat: Marine Tondelier
  parti: Les Écologistes
  document: "Pour une prospérité écologique (juillet 2026)"
  url: https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf
  date_lecture: 2026-11-05
  calendrier_general: "pas de calendrier d'ensemble ; « dès 2027 » pour le SMIC, quinquennat 2027-2032 sinon"
  regle_budgetaire_annoncee: "« pacte fiscal vert » 2027-2032 (LPFP), trajectoire de déficit renégociée, dette « stabilisée » (p. 66, 68)"
  avertissement: "candidature soumise au référendum interne des adhérents du 10 au 13 décembre 2026"

