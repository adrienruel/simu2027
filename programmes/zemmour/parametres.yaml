# Programme d'Éric Zemmour (Reconquête) : chiffrage sur le noyau (6 novembre 2026).
#
# Programme partiel : tract « L'avenir est à nous » (octobre 2026), tracts thématiques, pétitions, entretiens. Fiche :
# programmes/zemmour/mesures.yaml. Règle : aucune économie ni recette annoncée n'est saisie (plan de 80 Md€, baisse de
# 100 Md€ par an, 140 Md€ du plan Knafo de budget2027.fr : comparaison seulement) ; chaque ligne est estimée en quatre
# scénarios. Format des mesures : moteur/programme_simple.py.

zemmour_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes non remplacés ou créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 60000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : PIB par emploi ≈ 95 000 € (Insee 2025) ; emplois concernés plutôt moins productifs que la moyenne"

zemmour_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

zemmour_retraites:
  age_cible:
    valeur: 65
    unite: sans_unite
    statut: DECISION
    note: "Arbitrage : « report de l'âge de départ », sans âge cible dans la source. Même arbitrage que pour Xavier Bertrand (65 ans, un trimestre par génération), pour comparer."
  premiere_generation:
    valeur: 1966
    unite: sans_unite
    statut: DECISION
  pas_par_generation:
    valeur: 0.25
    unite: sans_unite
    statut: DECISION

zemmour_csg:
  part_ir_retrouvee:
    valeur: {crise: 0.55, prudent: 0.6, median: 0.65, optimiste: 0.7}
    unite: taux
    statut: HYPOTHESE
    source: "Calculé : impôt sur le revenu des salariés par OpenFisca (cas type d'une personne seule) ≈ 91 Md€, contre ≈ 60 Md€ d'impôt réel sur les salaires (IR net ≈ 94 Md€, dont ≈ 22 sur les pensions et ≈ 12 sur les autres revenus) : le quotient conjugal et familial ramène l'impôt en plus aux deux tiers ; prudent un peu en dessous"
    note: "La CSG déductible (6,8 points) qui disparaît entre dans le revenu imposable : l'impôt sur le revenu monte un peu."
  independants:
    valeur: {crise: 6.5, prudent: 6.5, median: 6.0, optimiste: 6.0}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : CSG des travailleurs indépendants ≈ 6 à 7 Md€ (Urssaf, 2024 : revenus d'activité non salariés ≈ 70 Md€ × 9,2 %)"
    note: "« Revenus du travail » : salariés, agents publics et indépendants. Impôt sur le revenu en plus : 10 % de cette CSG."
  premiere_annee:
    valeur: 2028
    unite: sans_unite
    statut: DECISION
    note: "Première loi de financement du quinquennat ; pas de montée progressive annoncée (prudent)."

zemmour_successions:
  part_supprimee:
    valeur: 1.0
    unite: taux
    statut: DECISION
    note: "« Suppression des droits de succession » : toute la recette des successions et donations du statu quo (≈ 21 Md€ en 2029), à partir de 2028. Pas d'effet de comportement retenu (l'impôt disparaît)."

zemmour_mesures:

  # ---------------------------------------------------------------- fiscalité
  accise_carburants:
    valeur: {id: ZEM-FIS-01b, libelle: "Accise sur les carburants baissée d'un tiers", poste: recettes, moteur: "recette:accises_et_taxes_sur_produits", debut: 2028, plein: 2028,
             montant: {crise: -12.0, prudent: -11.8, median: -11.5, optimiste: -11.2}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : accise sur les carburants routiers ≈ 30 Md€ (État et régions, DGDDI 2024) ; un tiers ≈ 10 Md€, plus la TVA sur l'accise (20 %) ≈ 2 Md€, moins un peu de volume en plus (élasticité-prix ≈ −0,3)"
    note: "Le modèle n'a pas de canal des prix : pas d'effet sur l'inflation ni sur les émissions dans cette passe."

  # ---------------------------------------------------------------- préférence nationale et immigration
  preference_famille:
    valeur: {id: ZEM-IMM-04, libelle: "Préférence nationale : allocations familiales réservées aux Français", poste: famille, moteur: "bloc:famille", debut: 2028, plein: 2029,
             montant: {crise: -1.35, prudent: -2.0, median: -2.9, optimiste: -3.6}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : étrangers ≈ 8 % de la population, ≈ 12 % des familles allocataires (CNAF) ; ressortissants européens ≈ 30 % des étrangers, protégés par le droit de l'Union (égalité de traitement) : ≈ 8 % du bloc famille en statique ≈ 2,9 Md€"
    note: "Économie annoncée par le parti (15 à 20 Md€ pour toutes les prestations non contributives) : NON SAISIE. Prudent : risque constitutionnel et conventionnel (Conseil constitutionnel, décision 2023-863 DC ; Cour européenne des droits de l'homme), naturalisations ; la mesure suppose un référendum."
  preference_logement:
    valeur: {id: ZEM-IMM-04, libelle: "Préférence nationale : aides au logement réservées aux Français", poste: logement, moteur: "bloc:logement", debut: 2028, plein: 2029,
             montant: {crise: -0.75, prudent: -1.1, median: -1.6, optimiste: -2.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : étrangers ≈ 17 % des ménages allocataires des aides au logement (CNAF) ; hors ressortissants européens ≈ 12 % du bloc ≈ 2 Md€ en statique"
  preference_pauvrete:
    valeur: {id: ZEM-IMM-04, libelle: "Préférence nationale : RSA et prime d'activité réservés aux Français", poste: pauvrete, moteur: "bloc:pauvrete", debut: 2028, plein: 2029,
             montant: {crise: -0.9, prudent: -1.4, median: -2.0, optimiste: -2.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : étrangers ≈ 17 % des allocataires du RSA, ≈ 9 % de la prime d'activité (DREES, CNAF) ; hors ressortissants européens ≈ 10 % du bloc ≈ 2,4 Md€ en statique"
  ame:
    valeur: {id: ZEM-IMM-04, libelle: "Suppression de l'aide médicale d'État", poste: etat_missions, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: -0.5, prudent: -0.6, median: -0.8, optimiste: -1.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : AME ≈ 1,3 Md€ (PLF 2026) ; une partie des soins revient aux urgences et aux soins urgents (rapport Évin-Stefanini, 2023) : prudent ≈ la moitié"
  asile:
    valeur: {id: ZEM-IMM-01, libelle: "Arrêt de l'immigration légale : dépenses d'asile en moins", poste: etat_missions, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: -0.3, prudent: -0.5, median: -0.8, optimiste: -1.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : mission Immigration, asile et intégration ≈ 2,2 Md€ (LFI 2026), dont allocation des demandeurs d'asile et hébergement ≈ 1,5 Md€ ; l'asile relève de la Constitution et de la convention de Genève : prudent ≈ un tiers"
    note: "Les effets de l'arrêt de l'immigration sur la population active, le PIB et les comptes (OCDE, 2021 : contribution nette des immigrés proche de zéro) ne sont pas encore modélisés : variante démographique à construire (solde migratoire de l'Insee)."
  eloignements:
    valeur: {id: ZEM-IMM-02, libelle: "« Remigration » : éloignements forcés en plus", poste: etat_missions, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: 1.0, prudent: 0.8, median: 0.6, optimiste: 0.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : coût d'un éloignement forcé ≈ 14 000 € (Sénat, rapport sur le PLF 2020, rétention, escorte, transport) ; 50 000 à 70 000 éloignements de plus par an, centres de rétention en plus"

  # ---------------------------------------------------------------- économies identifiées (la liste de 80 Md€ n'est pas reprise)
  aide_developpement:
    valeur: {id: ZEM-INT-02, libelle: "Suppression de l'aide publique au développement (mission budgétaire)", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -2.5, prudent: -3.0, median: -3.5, optimiste: -4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : mission Aide publique au développement ≈ 3,8 Md€ (LFI 2026) ; le reste des 15 Md€ d'APD déclarée à l'OCDE (contribution européenne, frais d'écolage et d'accueil des réfugiés, annulations de dette) n'est pas une dépense que l'on peut supprimer ; engagements multilatéraux en cours"
    note: "Économie annoncée par le parti : 15 Md€, NON SAISIE."
  energies_renouvelables:
    valeur: {id: ZEM-ENE-02, libelle: "Fin des soutiens publics aux renouvelables (nouveaux contrats)", poste: etat_missions, moteur: pib, debut: 2028, plein: 2035,
             depart: -0.3, montant: {crise: -1.5, prudent: -2.0, median: -3.0, optimiste: -4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : charges de service public de l'énergie pour les renouvelables ≈ 5 à 8 Md€ selon les prix de marché (CRE, délibérations 2025-2026) ; les contrats signés (obligation d'achat, complément de rémunération) courent 15 à 20 ans : l'économie vient des contrats non signés, et monte lentement"
    note: "Économie annoncée par le parti : 8 Md€, NON SAISIE. Effet sur les émissions et sur le prix de l'électricité non chiffré dans cette passe."
  subventions:
    valeur: {id: ZEM-ECO-02, libelle: "Subventions aux syndicats, à la presse et à des associations supprimées", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -0.4, prudent: -0.6, median: -1.0, optimiste: -1.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : aides à la presse ≈ 0,2 à 0,3 Md€ (directes), financement des organisations syndicales (AGFPN) ≈ 0,15 Md€, subventions de l'État aux associations ≈ 7 Md€ (jaune budgétaire), dont la part « politisée » n'est pas définie"
    note: "Annonces NON SAISIES : 16 Md€ (tract de novembre 2025) ; plan Knafo (ZEM-KNA-22 à 24) : associations 1 à 2 Md€, presse 0,2, syndicats 0,1."
  politique_ville:
    valeur: {id: ZEM-SP-02, libelle: "Fin du soutien public à la politique de la Ville", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -0.7, prudent: -1.0, median: -1.5, optimiste: -2.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : programme 147 Politique de la ville ≈ 0,6 Md€, État dans l'ANRU ≈ 0,3 Md€ ; le document de politique transversale (≈ 10 Md€) compte des dépenses de droit commun (écoles, police) qui ne disparaissent pas"
    note: "Économie annoncée par le parti : 8 Md€, NON SAISIE."
  audiovisuel:
    valeur: {id: ZEM-CUL-01, libelle: "Privatisation de l'audiovisuel public", poste: etat_missions, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: -2.0, prudent: -2.5, median: -3.0, optimiste: -3.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : dotations à l'audiovisuel public ≈ 3,8 Md€ (LFI 2026) ; Arte (traité franco-allemand) et l'audiovisuel extérieur restent ; coûts de transition (plans sociaux)"
    note: "Économie annoncée par le parti : 4 Md€, NON SAISIE. Produit de cession (une fois, hors solde) non compté."

  # ---------------------------------------------------------------- plan de Sarah Knafo (budget2027.fr, 24 mesures, « 140 Md€ par an au minimum »)
  # Chaque mesure est reprise avec ses paramètres (nombre de postes, durée du RSA…) ; aucun montant annoncé n'est saisi
  # (le plan ne cite qu'une source, pour l'IA). Les lignes déjà au programme (préférence nationale, renouvelables,
  # politique de la Ville, aide au développement, AME, audiovisuel, subventions) sont gardées plus haut.
  non_remplacement_etat:
    valeur: {id: ZEM-KNA-01, libelle: "Départs administratifs non remplacés (État)", poste: etat_missions, moteur: "bloc:etat_missions", debut: 2028, plein: 2032, fp: true, postes: true,
             montant: {crise: -8.25, prudent: -11.0, median: -15.1, optimiste: -19.25}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo (budget2027.fr) : 800 000 des 2,3 millions de départs du quinquennat non remplacés (40 Md€ annoncés, NON SAISIS). Encadrement de la réalisation : RGPP 2007-2012 ≈ 150 000 postes de l'État en cinq ans (Cour des comptes, 2012) ; l'État ne décide pas des effectifs des collectivités ni des hôpitaux. Réalisé : 300 000 (crise), 400 000 (prudent), 550 000 (médian), 700 000 (optimiste) postes, au coût d'un recrutement évité (55 000 €), moitié État"
    note: "Les trois lignes ZEM-KNA-01 portent la même mesure, partagée entre versants : État 50 %, collectivités 40 % (par la baisse des dotations, hypothèse), hôpitaux 10 % (administratifs seulement, les 40 000 soignants de ZEM-SAN-02 sont recrutés à part). 57 % de la masse revient en prélèvements (fp). Qualité du service non modélisée."
  non_remplacement_collectivites:
    valeur: {id: ZEM-KNA-01, libelle: "Départs administratifs non remplacés (collectivités)", poste: collectivites, moteur: "bloc:collectivites", debut: 2028, plein: 2032, fp: true, postes: true,
             montant: {crise: -6.6, prudent: -8.8, median: -12.1, optimiste: -15.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Voir non_remplacement_etat"
  non_remplacement_hopitaux:
    valeur: {id: ZEM-KNA-01, libelle: "Départs administratifs non remplacés (hôpitaux)", poste: sante, moteur: "bloc:sante", debut: 2028, plein: 2032, fp: true, postes: true,
             montant: {crise: -1.65, prudent: -2.2, median: -3.0, optimiste: -3.85}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Voir non_remplacement_etat"
  ia_administration:
    valeur: {id: ZEM-KNA-02, libelle: "Gains de productivité de l'IA dans les administrations", poste: etat_missions, moteur: "bloc:etat_missions", debut: 2029, plein: 2032,
             montant: {crise: 0.0, prudent: 0.0, median: -1.0, optimiste: -2.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 5 Md€, d'après un rapport IGF-IGAS de 2025 (une seule source : règle du 05/11/2026, une économie doit être recoupée)"
    note: "Prudent à zéro : l'IA est le moyen du non-remplacement (ZEM-KNA-01), compter les deux ferait un double compte ; médian et optimiste : gains en plus sur les dépenses de fonctionnement."
  rsa_trois_ans:
    valeur: {id: ZEM-KNA-04, libelle: "RSA limité à trois ans pour les bénéficiaires aptes au travail", poste: pauvrete, moteur: "bloc:pauvrete", debut: 2028, plein: 2031,
             montant: {crise: -1.0, prudent: -1.5, median: -2.2, optimiste: -3.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 4,8 Md€ annoncés, NON SAISIS. Encadrement : allocation du RSA ≈ 12 Md€ ; ≈ 45 % des allocataires au RSA depuis plus de trois ans, dont ≈ 60 % sans frein reconnu (DREES, minima sociaux 2024) : ≈ 3 Md€ en statique, avant les étrangers déjà exclus (ZEM-IMM-04) ; exigence constitutionnelle de moyens convenables d'existence (Préambule de 1946, al. 11)"
    note: "Montée sur trois ans (les premières sorties en 2031). Retours à l'emploi non comptés (prudent) ; report d'une partie des sortants vers l'hébergement et l'aide sociale des départements non compté non plus."
  fraude:
    valeur: {id: ZEM-KNA-05, libelle: "Lutte contre la fraude sociale, aides retirées aux condamnés", poste: autres, moteur: "bloc:autres", debut: 2028, plein: 2030,
             montant: {crise: -0.3, prudent: -0.5, median: -1.0, optimiste: -1.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 2 à 3 Md€ annoncés, NON SAISIS. Encadrement : fraude sociale détectée ≈ 2,9 Md€ en 2024 (CNAF, CNAM, CNAV, Urssaf), dont une partie seulement recouvrée ; plans de lutte successifs ≈ 0,3 à 0,5 Md€ de rendement en plus (Cour des comptes)"
  anah:
    valeur: {id: ZEM-KNA-08, libelle: "Suppression de l'Anah et de ses aides (MaPrimeRénov')", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -2.5, prudent: -3.0, median: -3.5, optimiste: -4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 6 Md€ annoncés, NON SAISIS. Encadrement : paiements de l'Anah ≈ 3,5 à 4 Md€ par an (MaPrimeRénov', Habiter mieux, copropriétés ; LFI 2026, budget en baisse) ; dossiers engagés à payer"
    note: "Remplace la suppression de l'agence comptée en frais de fonctionnement : le plan supprime aussi les aides. Effet sur les émissions des bâtiments non chiffré dans cette passe."
  ademe:
    valeur: {id: ZEM-KNA-09, libelle: "Suppression de l'Ademe (hors soutien aux renouvelables)", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -1.0, prudent: -1.5, median: -2.0, optimiste: -2.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 3,4 Md€ annoncés, NON SAISIS. Encadrement : budget de l'Ademe ≈ 4 Md€ (fonds chaleur ≈ 0,8, déjà dans ZEM-ENE-02 ; économie circulaire, décarbonation de l'industrie, études) ; engagements pluriannuels à honorer"
  france_travail:
    valeur: {id: ZEM-KNA-10, libelle: "Fin de la mise en relation de l'offre et de la demande d'emploi par France Travail", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -1.5, prudent: -2.0, median: -2.5, optimiste: -3.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 4 Md€ annoncés, NON SAISIS. Encadrement : France Travail ≈ 7 Md€ (≈ 54 000 agents), financé par l'État et l'Unédic ; l'indemnisation, le contrôle et le RSA rénové restent"
    note: "Effet sur le chômage (accompagnement en moins) non compté : les évaluations de l'accompagnement renforcé trouvent des effets faibles et de court terme (Dares)."
  ars:
    valeur: {id: ZEM-KNA-11, libelle: "Suppression des agences régionales de santé (missions reprises par l'État)", poste: sante, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: -0.2, prudent: -0.3, median: -0.5, optimiste: -0.7}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 1 Md€ annoncé, NON SAISI. Encadrement : fonctionnement des ARS ≈ 1 Md€ (≈ 8 700 agents) ; contrôle sanitaire, autorisations et veille repris par les préfectures : 20 à 70 % d'économie"
  autres_agences:
    valeur: {id: ZEM-KNA-12, libelle: "Suppression d'agences (Arcom, Conseil national du bruit, Haut Conseil à l'égalité…) et du CESE", poste: etat_missions, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: -0.25, prudent: -0.35, median: -0.55, optimiste: -0.75}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 1 Md€ (agences) et 0,066 Md€ (CESE et Ceser) annoncés, NON SAISIS. Encadrement : Arcom ≈ 0,05 Md€, CESE ≈ 0,045 Md€ ; la liste « et d'autres » n'est pas close"
  budget_ue:
    valeur: {id: ZEM-KNA-15, libelle: "Contribution au budget européen ramenée au niveau d'avant le Covid", poste: defense_ue, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: 0.0, prudent: -1.0, median: -2.0, optimiste: -4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 14 Md€ annoncés, NON SAISIS. Encadrement : contribution française ≈ 23 Md€ (PLF 2027), ≈ 21 Md€ en 2019 ; le cadre financier 2028-2034 se décide à l'unanimité et le remboursement du plan de relance commence en 2028 : une baisse unilatérale serait contraire aux traités"
    note: "Économie qui dépend de 26 autres États : zéro en crise, faible en prudent."
  etudiants_etrangers:
    valeur: {id: ZEM-KNA-16, libelle: "Fin de la gratuité des études pour les étudiants étrangers", poste: etat_missions, moteur: pib, debut: 2028, plein: 2031,
             montant: {crise: -0.5, prudent: -0.8, median: -1.2, optimiste: -1.8}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Plan Knafo : 4 Md€ annoncés, NON SAISIS. Encadrement : ≈ 430 000 étudiants étrangers, dont ≈ 30 % européens (égalité de traitement du droit de l'Union) ; coût moyen d'un étudiant ≈ 11 500 € (MESR) ; droits différenciés déjà en place depuis 2019 avec de nombreuses exonérations ; baisse forte des inscriptions"
    note: "Recettes de droits ou étudiants en moins : compté comme dépense en moins. Effets sur l'emploi qualifié futur non comptés."
