# Programme d'Édouard Philippe (Horizons) : chiffrage sur le noyau (7 novembre 2026).
#
# Pas de programme complet au 6/11/2026 : quatre pages de « priorités » du site de campagne, interviews, discours et
# publications d'Horizons ; 87 mesures recensées par programmes-2027.fr (fiche : programmes/philippe/mesures.yaml).
#
# Règles : on ne reprend que les mesures, jamais les économies annoncées (déficit à 2 %, « 50 % de l'effort sur le
# social », 50 Md€ d'aides aux entreprises : seule la part réalisable est retenue) ; les montants des mesures (50 Md€
# d'impôts de production en moins, 3 Md€ d'impôt sur le revenu après une naissance) sont des paramètres ; dépense :
# crise ≥ prudent ≥ médian ≥ optimiste ; recette : l'inverse. Calendrier : à partir de la loi de finances 2028.

philippe_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

philippe_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

philippe_retraites:
  age_cible:
    valeur: 65
    unite: sans_unite
    statut: SOURCE
    source: "Site du candidat (« Pour une France plus prospère ») : âge de départ à 65 ans et durée de cotisation à 45 ans, relevés en moins de dix ans, départs anticipés maintenus"
  premiere_generation:
    valeur: 1966
    unite: sans_unite
    statut: DECISION
    note: "Même rythme que Bertrand et Zemmour : un trimestre par génération à partir de la génération 1966 (départs de 2030), 65 ans pour la génération 1969 (départs de 2034), moins de dix ans après l'élection."
  pas_par_generation:
    valeur: 0.25
    unite: sans_unite
    statut: DECISION

philippe_chomage:
  baisse_taux:
    valeur: {crise: 0.001, prudent: 0.002, median: 0.003, optimiste: 0.004}
    unite: taux
    statut: HYPOTHESE
    source: "Encadrement : réformes de 2021 et 2023 = 0,6 point de chômage structurel (Banque de France, Bulletin n° 264, 2026) ; durée ramenée de 18 à 12 mois pour les moins de 50 ans : 0,1 à 0,4 point"
    note: "Baisse du taux de chômage, montée de 2028 à 2030."

philippe_mesures:
  impots_production_travail:
    valeur: {id: PHI-FIS-01, instrument: cout_travail, libelle: "Impôts de production −50 Md€ : part assise sur la masse salariale (taxe sur les salaires, versement mobilité)", poste: recettes, moteur: pib, debut: 2028, plein: 2032,
             montant: {crise: -18, prudent: -17, median: -16.5, optimiste: -16}}
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Site du candidat (« Pour une France plus prospère ») : baisse de 50 Md€ des impôts de production, compensée par 50 Md€ d'aides aux entreprises en moins ; arbitrage : 40 % sur les impôts assis sur les salaires (taxe sur les salaires ≈ 15 Md€, versement mobilité ≈ 11 Md€), montée sur le quinquennat ; relecture neutre (11/11/2026) : une partie est payée par les administrations elles-mêmes (taxe sur les salaires des hôpitaux publics, versement mobilité des employeurs publics), ≈ 2 à 4 Md€ sur 20, sans effet sur le solde consolidé : retirée du montant"
    note: "Montant de la mesure (paramètre), pas une recette annoncée."
  impots_production_capital:
    valeur: {id: PHI-FIS-01, instrument: capital_entreprises, libelle: "Impôts de production −50 Md€ : part assise sur le capital et le chiffre d'affaires (CFE, taxe foncière des entreprises, C3S)", poste: recettes, moteur: "recette:impot_sur_les_societes", debut: 2028, plein: 2032,
             montant: {crise: -30, prudent: -30, median: -30, optimiste: -30}}
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Même source ; 60 % sur la CFE (≈ 7 Md€), la taxe foncière des entreprises (≈ 12 Md€), la C3S (≈ 4 Md€) et les autres impôts de production (≈ 10 Md€) ; compensation des collectivités par l'État incluse"
  aides_entreprises_travail:
    valeur: {id: PHI-FIS-01b, instrument: cout_travail, libelle: "Aides publiques aux entreprises supprimées : allègements et exonérations de cotisations", poste: recettes, moteur: pib, debut: 2028, plein: 2032,
             montant: {crise: 4.8, prudent: 8.0, median: 11.2, optimiste: 14.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : aides aux entreprises ≈ 210 Md€ en 2023 (commission d'enquête du Sénat, rapport n° 808, 2025), dont allègements de cotisations ≈ 80 Md€ ; estimation indépendante de l'annonce (relecture neutre du 11/11/2026), sur les leviers identifiables : crédit d'impôt recherche des grands groupes, taux réduits, subventions sectorielles, allègements au-delà de 2 SMIC ; total 12 (crise), 20 (prudent), 28 (médian), 35 (optimiste) Md€ ; précédents : LFSS 2025, 4 Md€ d'allègements visés, ≈ 1,6 retenus ; rapport Bozio-Wasmer (2024) : redéploiement de quelques Md€ ; 40 % pris sur les allègements"
    note: "Les 50 Md€ annoncés ne sont pas repris : estimation propre."
  aides_entreprises_capital:
    valeur: {id: PHI-FIS-01b, instrument: capital_entreprises, libelle: "Aides publiques aux entreprises supprimées : niches fiscales et subventions", poste: recettes, moteur: "recette:impot_sur_les_societes", debut: 2028, plein: 2032,
             montant: {crise: 7.2, prudent: 12.0, median: 16.8, optimiste: 21.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même encadrement : 60 % sur les dépenses fiscales des entreprises (≈ 40 Md€ : CIR, taux réduits, suramortissements) et les subventions"
  ir_naissance:
    valeur: {id: PHI-FIS-02, instrument: travail, incidence: ir, libelle: "Exonération d'impôt sur le revenu trois ans après une naissance (moins de 3 000 € d'impôt), 3 000 € par an pour les autres", poste: recettes, moteur: pib, debut: 2028, plein: 2030,
