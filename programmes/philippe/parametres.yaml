    statut: SOURCE
    source: "Site (« Pour une France plus prospère ») : déficit ramené de plus de 5 % à 2 % du PIB, effort à 50 % sur les dépenses sociales, 25 % sur l'État et les collectivités, 25 % par la croissance ; soit ≈ 2,25 points de PIB d'économies (≈ 72 Md€)"
    note: "Sert seulement de plafond : l'effort retenu est déduit du programme domaine par domaine (enveloppe_economies.domaines × intensite, moins les économies déjà nommées), sans dépasser l'annonce."
