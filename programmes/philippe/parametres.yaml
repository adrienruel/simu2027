philippe_ecologie:
  vehicules_occasion:
    valeur: {id: "PHI-CLI-03", libelle: "Mêmes aides pour un véhicule électrique d'occasion que neuf", secteur: "transports", debut: 2028, plein: 2032, fin_debut: 2035, fin: 2045, effet_mt: {crise: -0.08, prudent: -0.11, median: -0.17, optimiste: -0.22}}
