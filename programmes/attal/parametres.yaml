# Programme de Gabriel Attal (Renaissance) : chiffrage sur le noyau (7 novembre 2026).
#
# Pas de programme complet publié au 6/11/2026 : site attalpresident.fr, « Lettre aux Français sur les finances
# publiques » (15/10/2026), entretiens et discours de 2026 ; 106 mesures recensées par programmes-2027.fr (fiche :
# programmes/attal/mesures.yaml). Les mesures tirées seulement des conventions ou des pétitions de Renaissance (2025)
# sont des propositions du parti : elles ne sont pas chiffrées.
#
# Règles (README, décisions d'Adrien) : on ne reprend que les mesures, jamais les économies annoncées (frein d'urgence de
# 20 Md€, 150 Md€ sur le quinquennat, 5 Md€ de l'assurance chômage : non saisis ; seules les mesures nommées sont
# estimées) ; chaque ligne sans source est estimée en crise / prudent / médian / optimiste ; dépense : crise ≥ prudent ≥
# médian ≥ optimiste ; recette : l'inverse. Calendrier : tout à partir de la loi de finances 2028.

attal_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

attal_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

attal_droit_au_brut:
  baisse:
    valeur: {crise: 58.0, prudent: 52.0, median: 46.0, optimiste: 40.0}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Site du candidat (« Droit au brut ») : +250 € net par mois au salaire médian (2 200 € net), dès 2027, cotisations « qui pèsent sur le travail » supprimées, sans précision. Calcul : 250 € de plus pour les salariés au-dessus du médian et un gain proportionnel en dessous ≈ 215 € par mois en moyenne pour ≈ 20 millions de salariés ≈ 52 Md€ ; ≈ 40 Md€ cités par la presse (La Dépêche, octobre 2026), qui est pris pour l'optimiste ; relecture neutre (11/11/2026) : le prudent ne peut pas être sous le calcul (52) ; agents publics compris, plutôt au-delà (crise 58)"
    note: "Cotisations salariales en moins sur les revenus d'activité, privé et public dans la proportion de la CSG ; forme d'incidence : celle de la suppression de la CSG calculée par OpenFisca (proportionnelle au salaire). Les cotisations salariales sont entièrement déductibles : l'impôt sur le revenu monte (attal_droit_au_brut.part_ir_retrouvee) ; la prime d'activité baisse. Le financement annoncé (« à l'euro près » par des économies sur l'assurance chômage et les arrêts maladie) n'est pas repris : ces deux réformes sont chiffrées à part. Les droits à retraite des salariés ne baissent pas (hypothèse : l'État compense la caisse)."
  premiere_annee:
    valeur: 2028
    unite: sans_unite
    statut: DECISION
    note: "Annoncé « dès le début 2027 » ; arbitrage : première loi de finances et de financement après l'élection (2028), comme les autres programmes."
  part_ir_retrouvee:
    valeur: {crise: 0.6, prudent: 0.65, median: 0.72, optimiste: 0.8}
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que zemmour_csg.part_ir_retrouvee (OpenFisca 2026, couples, ramené à l'impôt réel)"

