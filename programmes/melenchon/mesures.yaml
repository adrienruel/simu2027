# Programme de Jean-Luc Mélenchon (La France insoumise) — mesures à portée budgétaire ou macroéconomique
#
# Source : « L'Avenir en commun. Le programme de la Nouvelle France », 5e édition, avec une introduction de Jean-Luc
# Mélenchon (La Dispute, ISBN 978-2-84303-368-1, dépôt légal novembre 2026, 224 p.), PDF transmis par Adrien le
# 06/11/2026 et lu en entier. Numéros de page : pagination imprimée du livre (folio). `citation` est un extrait exact,
# vérifié par outils/verifier_citations.py sur le texte de chaque page (pdftotext, une page par fichier p<folio>.txt) :
#
#     python -I outils/verifier_citations.py programmes/melenchon/mesures.yaml <dossier des pages>
#
# Le livre ne donne aucun chiffrage. Les « plans thématiques » annoncés sur melenchon2027.fr ne sont pas encore parus
# (6 novembre 2026) : à relire quand ils sortiront.
#
# traitement :
#   chiffre      paramètres donnés par le texte, calcul du modèle
#   estime       mesure claire, paramètre(s) manquant(s) : arbitrage ou fourchette par scénario (parametres.yaml)
#   declaratif   recette ou économie sans chiffrage, estimée par le modèle en quatre scénarios (règle)
#   macro        passe par un canal économique (emploi, PIB) plutôt que par une ligne budgétaire
#   hors_budget  flux financier ou patrimonial (achat d'actifs, dette)
#   non_chiffre  effet possible mais non modélisé (raison en note)
#   sans_effet   réglementaire ou institutionnel, ou à la charge du privé
# cle : clé de parametres.yaml (groupe melenchon_mesures sauf indication) ou mesure calculée de programme.py.

programme:
  candidat: Jean-Luc Mélenchon
  parti: La France insoumise
  document: "L'Avenir en commun. Le programme de la Nouvelle France (5e édition, novembre 2026)"
  editeur: La Dispute
  url: https://melenchon2027.fr/programme/
  date_lecture: 2026-11-06
  calendrier_general: "« immédiatement » pour le SMIC (p. 60), « état d'urgence sociale » pour le point d'indice et les APL (p. 57) ; quinquennat 2027-2032 sinon"
  regle_budgetaire_annoncee: "aucune ; suspension des règles budgétaires européennes demandée (p. 193), désobéissance aux « règles bloquantes » (p. 194)"

mesures:

  # ================================================================ salaires et fonction publique
  - {id: LFI-SAL-01, intitule: "SMIC à 1 700 € net par mois, immédiatement", page: 60, citation: "Porter immédiatement le SMIC mensuel à 1 700 euros net", traitement: chiffre, cle: "melenchon_smic (bibliotheque.smic)"}
  - {id: LFI-SAL-02, intitule: "Salaires indexés sur l'inflation dans le privé et la fonction publique", page: 60, citation: "indexer les salaires sur l’inflation dans le privé comme dans la fonction publique", traitement: non_chiffre, note: "Les salaires du statu quo progressent déjà plus vite que les prix ; en crise, l'indexation pèserait sur l'emploi (non modélisé)."}
  - {id: LFI-FP-01, intitule: "Point d'indice +10 %, compensé aux collectivités", page: 57, citation: "Revaloriser la valeur du point d’indice des fonctionnaires de 10 %", traitement: chiffre, cle: "melenchon_fp (programme.py), pensions_fp"}
  - {id: LFI-FP-02, intitule: "Dégel du point inscrit dans la loi", page: 57, citation: "inscrire son dégel dans la loi", traitement: estime, cle: point_2027}
  - {id: LFI-EDU-01, intitule: "Rattrapage du gel du point depuis 2010 dans l'Éducation nationale, grilles revalorisées", page: 120, citation: "Rattraper le gel du point d’indice depuis 2010 et revaloriser les grilles salariales", traitement: estime, cle: rattrapage_education}
  - {id: LFI-FP-03, intitule: "Titularisation des précaires des trois fonctions publiques", page: 73, citation: "Titulariser les précaires des trois fonctions publiques", traitement: estime, cle: titularisations}
