    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ≈ 90 Md€ d'actifs × 2 à 3 % de rendement versé, moins la baisse des péages (« revenant sur les hausses de prix passées ») et des tarifs (Engie, Ehpad)"

# --- Effets en tonnes des mesures écologiques (07/11/2026) ----------------------------------------------------------
# Même méthode que tondelier_ecologie (docs/ecologie.md) : effet à plein par scénario (Mt CO2e par an, négatif =
# évité), montée linéaire, extinction quand le statu quo rattrape la mesure, réduit au rythme de la décarbonation du
# statu quo (moteur/ecologie/emissions.profil). Le coût de chaque mesure est déjà dans melenchon_mesures. L'objectif de
# −65 % en 2033 (p. 27) et la « règle verte » sont des objectifs : seules les mesures qui les servent sont comptées.
melenchon_ecologie:
  renovation:
    valeur: {id: LFI-LOG-05, libelle: "Isolation d'au moins 700 000 logements par an", secteur: batiments, debut: 2028, plein: 2050,
             effet_mt: {crise: -1.7, prudent: -2.8, median: -4.5, optimiste: -6.0}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Mêmes bases que tondelier_ecologie.renovation (Anah, bilan 2024 ; Citepa, Secten 2026 : 1,2 t par logement en moyenne dans le résidentiel)"
    note: "Isolations, en partie complètes : gain énergétique moyen ≈ 35 % (contre 65 % pour une rénovation d'ampleur), soit 0,3 t (crise), 0,35 t (prudent), 0,45 t (médian), 0,6 t (optimiste) par logement. Isolations en plus du statu quo réellement faites (capacité de la filière, plus facile que pour des rénovations complètes) : 250 000 (crise), 350 000 (prudent), 450 000 (médian), 600 000 (optimiste) par an ; cumul sur 2028-2050 plafonné à 10 millions de logements."
  chauffages_fossiles:
    valeur: {id: LFI-LOG-05b, libelle: "Chauffages au fioul et au gaz remplacés progressivement", secteur: batiments, debut: 2028, plein: 2045,
             effet_mt: {crise: -1.9, prudent: -3.0, median: -5.3, optimiste: -7.1}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Budget : +1 Md€ par an d'aides aux pompes à chaleur (melenchon_mesures.renovation) ; Citepa : ≈ 20 Mt pour le chauffage au gaz et au fioul des logements ; même méthode que tondelier_ecologie.sortie_fioul"
    note: "≈ 4 000 € d'aide par pompe à chaleur : 250 000 aidées en plus par an, dont une partie se ferait sans aide : 50 000 (crise), 80 000 (prudent), 125 000 (médian), 150 000 (optimiste) changements en plus par an × 2,2 à 2,8 t évitées (gaz surtout, un peu de fioul), cumulés sur 17 ans. Aucune date de fin des chaudières au gaz : pas d'interdiction comptée. Recoupe en partie l'isolation (même logement) : effets additionnés sans correction en médian et optimiste, la prudence est dans les effectifs."
  ferroviaire:
    valeur: {id: LFI-INV-02, libelle: "Voies rénovées, lignes rouvertes, fret relancé, billets moins chers", secteur: transports, debut: 2030, plein: 2040,
             effet_mt: {crise: -0.8, prudent: -1.6, median: -3.9, optimiste: -6.3}}
