    note: "Coût par poste fixé à 77 000 € pour que la mesure crée 30 000 postes (le reste : temps de travail et statut des AESH en poste)."
  effectifs_classes:
    valeur: {id: LFI-EDU-03, libelle: "Classes à moins de 19 élèves (priorité maternelle et éducation prioritaire), remplaçants, scolarité obligatoire à 18 ans", poste: etat_missions, moteur: "bloc:autres", debut: 2028, plein: 2032, fp: true, postes: true, cout_poste: 60000,
