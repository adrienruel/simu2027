    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : droits de succession et de donation ≈ 21 Md€ (statu quo 2029) ; exonération des héritages de moins de 150 000 € : ≈ −4 à −5 Md€ (droits des héritiers en ligne directe juste au-dessus de l'abattement de 100 000 € et des héritiers hors ligne directe, ≈ 40 % des droits, dont la moitié sur des parts de moins de 150 000 €) ; héritage maximal de 12 M€ : parts de plus de 12 M€ ≈ 5 % du flux transmis (≈ 476 Md€), taxées à 100 % au lieu de 45 %, mais forte optimisation (donations anciennes, expatriation, démembrement, sociétés) : +2 Md€ en prudent ; cumul sur la vie (fin du rappel fiscal de 15 ans) : +1,5"
    note: "Le signe dépend du scénario : en prudent, l'exonération coûte plus que ce que rapportent les héritages les plus élevés. Plafond de 5 logements transmissibles (p. 184, réquisition au-delà) : non chiffré (expropriation)."
  tva_luxe:
