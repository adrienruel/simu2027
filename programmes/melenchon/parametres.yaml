    source: "Même chiffrage que tondelier_mesures.zucman (≈ 20 Md€ en statique, G. Zucman, 2025 ; prudent au quart)"
    note: "L'exit tax renforcée est comptée comme une réduction de l'exil, sans recette propre."
  successions:
    valeur: {id: LFI-REC-07, instrument: successions, libelle: "Successions : dons et héritages cumulés sur la vie, héritage maximal de 12 M€, exonération en dessous de 150 000 €", poste: recettes, moteur: "recette:successions", debut: 2028, plein: 2029,
             montant: {crise: -2.5, prudent: -1.0, median: 1.5, optimiste: 4.0}}
