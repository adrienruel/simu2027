  bati_scolaire:
    valeur: {id: LFI-EDU-07, libelle: "Bâti scolaire et universitaire rénové et adapté au climat, équipements sportifs, lycées de la mer", poste: investissement, moteur: pib, debut: 2028, plein: 2030,
