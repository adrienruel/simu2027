  cvae_remplacee:
    valeur: {id: LFI-REC-16, instrument: capital_entreprises, libelle: "Nouvel impôt sur les entreprises (chiffre d'affaires, empreinte écologique) pour les éco-régions, à la place de la CVAE", poste: recettes, moteur: pib, debut: 2029, plein: 2030,
             montant: {crise: 5.0, prudent: 6.0, median: 7.0, optimiste: 8.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : CVAE ≈ 8 Md€ au taux de 0,75 % (Fipeco, 29/10/2025 ; statu_quo.cvae_rendement_2027) ; statu quo : CVAE supprimée en 2030, donc l'impôt nouveau est une recette en plus"
    note: "Rendement non donné (p. 60) : arbitrage au niveau de l'ancienne CVAE, prudent un peu dessous (impôt de production)."
  taxe_habitation:
    valeur: {id: LFI-REC-17, libelle: "Taxe d'habitation progressive rétablie (80 % des ménages exonérés)", poste: recettes, moteur: pib, debut: 2029, plein: 2029,
             montant: {crise: 5.5, prudent: 6.0, median: 6.5, optimiste: 7.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : dernière tranche supprimée (20 % des ménages les plus aisés) ≈ 7,5 Md€ en 2022 (loi de finances pour 2020, rapport Richard-Bur) ; barème progressif selon les revenus et la valeur du logement"
    note: "Recette des communes, dépensée par elles (« redonner des moyens aux communes », p. 180) : contrepartie au poste collectivités (LFI-COL-02), effet net nul sur le solde."
  logements_vacants:
    valeur: {id: LFI-REC-18, instrument: capital_menages, libelle: "Taxe unique et progressive sur les logements vacants ; niche des meublés de tourisme supprimée", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 0.2, prudent: 0.3, median: 0.4, optimiste: 0.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : taxe sur les logements vacants et taxe d'habitation sur les logements vacants ≈ 0,2 Md€ ; abattement des meublés de tourisme ≈ 0,1 Md€ (loi Le Meur, 2024, déjà réduit)"
  capitalisation_retraite:
    valeur: {id: LFI-REC-19, instrument: capital_menages, libelle: "Avantages fiscaux de la retraite par capitalisation supprimés", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.0, prudent: 1.5, median: 2.0, optimiste: 2.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : déduction des versements sur les plans d'épargne retraite ≈ 2 à 3 Md€ (Voies et moyens, PLF 2026) ; versements réduits ensuite"
  heures_sup:
    valeur: {id: LFI-REC-20, instrument: travail, incidence: milieu, libelle: "Heures supplémentaires majorées « cotisations incluses » : exonération de cotisations supprimée", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.8, prudent: 2.0, median: 2.2, optimiste: 2.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : réduction de cotisations salariales sur les heures supplémentaires ≈ 2 Md€, déduction patronale des petites entreprises ≈ 0,6 Md€ (PLFSS 2026, annexe 4) ; moins d'heures supplémentaires faites"
    note: "L'exonération d'impôt sur le revenu des heures supplémentaires n'est pas visée par le texte : gardée."
  mecenat_culturel:
    valeur: {id: LFI-REC-21, instrument: capital_entreprises, libelle: "Privilèges fiscaux du mécénat culturel abolis", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 0.2, prudent: 0.3, median: 0.3, optimiste: 0.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : réduction d'impôt pour mécénat des entreprises ≈ 1,6 Md€ (Cour des comptes, 2023), dont la culture ≈ 20 à 25 %"
  epargne_etranger:
    valeur: {id: LFI-REC-22, instrument: capital_menages, libelle: "Avantages fiscaux de l'épargne investie à l'étranger supprimés (assurance-vie)", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 0.1, prudent: 0.2, median: 0.4, optimiste: 0.6}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    note: "Assiette mal connue (unités de compte et fonds investis hors de France) ; prudent bas."
  kerosene_fossiles:
    valeur: {id: LFI-REC-23, instrument: consommation, libelle: "Niches du kérosène et subventions aux énergies fossiles supprimées", poste: recettes, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: 1.2, prudent: 1.8, median: 2.3, optimiste: 2.8}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : dépenses fiscales défavorables au climat ≈ 8 Md€ (budget vert) ; remboursement de TICPE aux transporteurs routiers ≈ 1,3 Md€, gazole non routier agricole ≈ 1,4 Md€ ; kérosène des vols intérieurs ≈ 0,3 Md€ (le kérosène des vols internationaux relève des conventions) ; même ordre que tondelier_mesures.niches_fossiles"
  taxe_kilometrique:
    valeur: {id: LFI-REC-24, instrument: consommation, libelle: "Taxe kilométrique aux frontières et droits de douane écologiques", poste: recettes, moteur: pib, debut: 2029, plein: 2029,
             montant: {crise: 0.0, prudent: 0.5, median: 1.5, optimiste: 2.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : importations de biens hors de l'Union ≈ 300 Md€ ; 1 % ≈ 3 Md€ avant détournement des échanges ; les droits de douane sont une ressource propre de l'Union (75 %) et relèvent de sa compétence exclusive : mesure unilatérale contestée (prudent bas, zéro en crise)"
  cannabis:
    valeur: {id: LFI-REC-25, instrument: consommation, libelle: "Cannabis légalisé sous monopole d'État : taxes affectées à la prévention", poste: recettes, moteur: pib, debut: 2029, plein: 2030,
             montant: {crise: 0.5, prudent: 0.7, median: 1.5, optimiste: 2.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même chiffrage que tondelier_mesures.cannabis (CAE, note n° 52, 2019 : ≈ 2 Md€)"
    note: "Recettes affectées à la prévention (p. 142) : contrepartie dans sante_prevention_addictions."
  sport_taxes:
    valeur: {id: LFI-REC-26, instrument: consommation, libelle: "Taxe sur les retransmissions sportives relevée, taxe sur les transferts", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 0.05, prudent: 0.1, median: 0.15, optimiste: 0.2}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    note: "Affectée au sport amateur : contrepartie dans sport."
  regularisations:
    valeur: {id: LFI-MIG-01, instrument: travail, libelle: "Régularisation des travailleurs, étudiants et parents sans papiers : prélèvements sur l'emploi déclaré", poste: recettes, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: 0.2, prudent: 0.4, median: 0.7, optimiste: 1.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ≈ 250 000 à 400 000 personnes concernées ; une partie travaille déjà déclarée sous un autre nom ; prélèvements nets d'un emploi au voisinage du SMIC (≈ 20 000 €) pour ≈ 20 000 à 50 000 emplois déclarés en plus"
    note: "Prestations ouvertes ensuite aux personnes régularisées : comptées dans accueil_migrants."

  # ================================================================ PRESTATIONS
  garantie_autonomie:
    valeur: {id: LFI-PRE-01, instrument: transferts_actifs, libelle: "Garantie d'autonomie : revenu de chaque ménage porté au seuil de pauvreté (1 337 € pour une personne seule)", poste: pauvrete, moteur: "bloc:pauvrete", debut: 2028, plein: 2029,
             montant: {crise: 32.0, prudent: 28.0, median: 24.0, optimiste: 20.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : Insee (enquête Revenus fiscaux et sociaux 2022) : 9,1 millions de personnes sous le seuil de 60 %, intensité de la pauvreté (écart médian) ≈ 20 % du seuil ; écart moyen plus grand (queue basse) ≈ 25 % ; ≈ 6 millions d'unités de consommation × ≈ 320 € par mois × 12 ≈ 23 Md€ en euros de 2026, avant le recours plus élevé (prestation automatique, p. 72) et la baisse d'activité au voisinage du seuil (taux marginal de 100 %) ; Institut Montaigne (2022, garantie à 1 063 €) : 15 Md€"
    note: "Arbitrage : seuil appliqué au niveau de vie du ménage (définition de l'Insee), pas au revenu individuel ; un seuil individuel (« individualisation des droits », p. 72) coûterait plusieurs fois plus. Remplace la hausse « immédiate » des minima sociaux (p. 57). Les allocataires de l'AAH (portée au SMIC) sont au-dessus du seuil. Suit les salaires (seuil de pauvreté)."
  garantie_jeunes:
    valeur: {id: LFI-PRE-02, instrument: transferts_actifs, libelle: "Garantie d'autonomie pour les jeunes détachés du foyer fiscal de leurs parents", poste: pauvrete, moteur: "bloc:pauvrete", debut: 2028, plein: 2030,
             montant: {crise: 12.0, prudent: 10.0, median: 8.0, optimiste: 6.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : Institut Montaigne (2022) : 14,8 Md€ pour la même mesure au seuil de 1 063 € ; ≈ 1,2 million de 18-24 ans vivant seuls ou en couple hors du foyer parental avec des revenus faibles (Insee, DREES, enquête nationale sur les ressources des jeunes) ; une partie est déjà comptée dans la garantie d'autonomie (jeunes en ménages ordinaires)"
    note: "Rattachement au foyer fiscal des parents abandonné pour en bénéficier : demi-part perdue par les parents (non comptée, prudent)."
  aah_smic:
    valeur: {id: LFI-PRE-03, instrument: transferts_actifs, libelle: "AAH portée au niveau du SMIC (1 700 € net)", poste: aah_invalidite, moteur: "bloc:aah_invalidite", debut: 2028, plein: 2029,
             montant: {crise: 12.0, prudent: 11.5, median: 10.5, optimiste: 9.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calcul : ≈ 1,4 million d'allocataires (DREES, 2025), AAH moyenne versée ≈ 900 € contre ≈ 1 680 € (SMIC net de 1 700 € en euros de 2026) pour ceux sans autre revenu : ≈ +600 € par mois en moyenne (revenus d'activité et pensions d'invalidité déduits) = 10 Md€ ; plafond de ressources relevé d'autant : +10 à 15 % d'allocataires"
    note: "Arbitrage : SMIC revalorisé (1 700 € net). Lecture basse (SMIC actuel, ≈ 1 440 € net) : environ 6 Md€."
  apl:
    valeur: {id: LFI-PRE-04, instrument: transferts_actifs, libelle: "APL +10 %", poste: logement, moteur: "bloc:logement", debut: 2027, plein: 2028, depart: 0.85,
             montant: {crise: 1.7, prudent: 1.7, median: 1.7, optimiste: 1.7}}
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Programme, p. 57 ; aides personnelles au logement 16,7 Md€ (statu_quo.aides_logement)"
    note: "Dès juillet 2027 (moitié en 2027). Étudiants étrangers rétablis dans leurs droits (p. 125) : compté dans enseignement_superieur."
  assurance_chomage:
    valeur: {id: LFI-PRE-05, instrument: transferts_actifs, libelle: "Assurance chômage : réformes Macron annulées, indemnisation dès le premier jour, régime des intermittents de l'emploi et des intérimaires", poste: chomage, moteur: "bloc:chomage", debut: 2028, plein: 2029,
             montant: {crise: 8.0, prudent: 7.6, median: 7.2, optimiste: 6.8}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : Unédic, effets des réformes de 2019, 2021, 2023 et 2025 ≈ 6 à 7 Md€ par an en régime de croisière (tondelier_mesures.assurance_chomage, 6,5) ; différé et délai d'attente de 7 jours supprimés ≈ +0,6 ; régime des intérimaires ≈ +0,5"
    note: "Effet sur le chômage (durées plus longues) : melenchon_chomage.hausse_taux. Abrogation de l'obligation de 15 heures d'activité (loi France Travail) : économie de gestion non comptée."
  conge_accueil:
    valeur: {id: LFI-PRE-06, instrument: transferts_actifs, libelle: "Congé d'accueil de l'enfant obligatoire de 20 semaines pour chaque parent", poste: famille, moteur: "bloc:famille", debut: 2028, plein: 2029,
             montant: {crise: 5.5, prudent: 5.0, median: 4.5, optimiste: 4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calcul : ≈ 650 000 naissances (Insee) ; second parent en emploi ≈ 85 % : 550 000 × 16 semaines en plus des 28 jours actuels × 5 jours × ≈ 85 € d'indemnité journalière ≈ 3,7 Md€ ; mères : +4 semaines ≈ 0,7 ; indemnités plafonnées comme aujourd'hui ; congé de naissance du statu quo (loi de financement pour 2026) en partie déduit"
    note: "Absences plus longues en entreprise : effet sur l'emploi non compté."
  famille_monoparentale:
    valeur: {id: LFI-PRE-07, instrument: transferts_actifs, libelle: "ASF déconjugalisée et revalorisée ; statut de famille monoparentale ; congés de proche aidant, de deuil (7 jours) et pour un ami", poste: famille, moteur: "bloc:famille", debut: 2028, plein: 2028,
             montant: {crise: 1.5, prudent: 1.4, median: 1.3, optimiste: 1.2}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ASF ≈ 2 Md€ pour ≈ 800 000 familles (CNAF, 2025) : +40 % et maintien en cas de remise en couple ≈ +1,0 ; congés ≈ 0,3 ; réductions tarifaires ≈ 0,1"
  pensions_alimentaires:
    valeur: {id: LFI-PRE-07, libelle: "Pensions alimentaires défiscalisées pour qui les reçoit", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: -0.3, prudent: -0.3, median: -0.3, optimiste: -0.3}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même chiffrage que tondelier_mesures.pensions_alimentaires"
  premiere_tranche_gratuite:
    valeur: {id: LFI-PRE-08, instrument: transferts_actifs, libelle: "Énergie : tarifs réglementés au coût de production, première tranche gratuite (électricité, chaleur, eau, gaz)", poste: autres, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: 4.0, prudent: 3.0, median: 2.0, optimiste: 1.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : 1 000 kWh d'électricité gratuits par ménage ≈ 250 € × 30 millions ≈ 7 Md€ s'ils étaient payés par l'État ; ici financés en grande partie par une tarification progressive (au-delà de la première tranche) ; dividendes et impôts d'EDF réduits par des tarifs au coût ≈ 1 à 2 Md€"
    note: "Arbitrage : la tarification progressive paie la plus grande part ; reste pour les finances publiques 3 Md€ en prudent. Prix encadrés de l'énergie pour les entreprises (p. 68) compris."
  protections_periodiques:
    valeur: {id: LFI-PRE-09, libelle: "Protections périodiques gratuites", poste: sante, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.0, prudent: 0.8, median: 0.6, optimiste: 0.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ≈ 15 millions de personnes menstruées × 50 à 80 € par an ; prix publics de gros moins élevés"
  blocage_prix:
    valeur: {id: LFI-PRE-10, libelle: "Prix des produits de première nécessité bloqués (alimentation, énergie, carburant) : compensations en crise", poste: autres, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 2.0, prudent: 0.5, median: 0.0, optimiste: 0.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : remise sur les carburants de 2022 ≈ 7,6 Md€ (Cour des comptes) ; un blocage de prix finit souvent par une compensation publique quand les cours montent"
    note: "Hors crise, le blocage est payé par les marges (pas de ligne budgétaire) ; effet sur l'inflation non compté (pas de canal des prix)."
  outre_mer_prestations:
    valeur: {id: LFI-PRE-11, instrument: transferts_actifs, libelle: "Outre-mer : prime de vie chère étendue aux minima sociaux, à l'ASPA et aux ménages pauvres ; prestations de Mayotte alignées", poste: pauvrete, moteur: "bloc:pauvrete", debut: 2028, plein: 2029,
             montant: {crise: 1.6, prudent: 1.5, median: 1.4, optimiste: 1.3}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : minima sociaux versés outre-mer ≈ 2,5 Md€ ; majoration de vie chère des fonctionnaires 20 à 40 % ; Mayotte : RSA et prestations familiales à environ la moitié du niveau hexagonal (≈ 0,5 Md€ d'écart)"
    note: "Arbitrage : +25 % pour les allocataires (prime appliquée au-dessus de la garantie d'autonomie)."

  # ================================================================ RETRAITES (hors âge, calculé)
  duree_decote:
    valeur: {id: LFI-RET-02, libelle: "Taux plein à 40 annuités et décote supprimée (pensions des nouveaux retraités)", poste: retraites, moteur: pensions, debut: 2028, plein: 2055,
             montant: {crise: 17.0, prudent: 12.8, median: 8.5, optimiste: 4.3}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : durée de référence ramenée de 43 à 40 ans (proratisation de la pension de base +7,5 % au plus pour les carrières de moins de 43 ans) et décote supprimée (≈ 8 % des nouveaux retraités, −10 % en moyenne, DREES fiche 11) : +2 à +5 % sur les pensions des départs à venir, moins l'effet des carrières plus courtes des départs à 60 ans, que le calcul de l'âge ne compte pas ; prudent : +3 % des pensions du statu quo (428 Md€ en 2029), atteints par la noria vers 2055"
  minimum_smic:
    valeur: {id: LFI-RET-03, libelle: "Pensions des carrières complètes portées au moins au SMIC revalorisé (salariés, indépendants, agriculteurs)", poste: retraites, moteur: pib, debut: 2028, plein: 2030,
             montant: {crise: 24.0, prudent: 22.0, median: 19.0, optimiste: 16.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : DREES, Les retraités et les retraites 2025 : ≈ 9 à 10 millions de retraités à carrière complète ; pension moyenne nette de droit direct ≈ 1 530 € ; environ 45 % des carrières complètes sous ≈ 1 680 € net (SMIC de 1 700 € en euros de 2026), écart moyen ≈ 350 € par mois : 4,3 millions × 350 € × 12 ≈ 18 Md€ ; plus les agriculteurs et indépendants (pensions plus basses) et la hausse des pensions au voisinage du seuil"
    note: "Suit le SMIC, donc les salaires (moteur pib), quand les pensions suivent les prix : l'écart se creuse avec le temps, en partie compensé par des pensions plus élevées des générations suivantes."
  minimum_vieillesse:
    valeur: {id: LFI-RET-04, libelle: "Minimum vieillesse (ASPA) porté au seuil de pauvreté", poste: retraites, moteur: pib, debut: 2028, plein: 2029,
             montant: {crise: 3.6, prudent: 3.4, median: 3.2, optimiste: 3.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calcul : ASPA ≈ 1 043 € (2026) contre 1 337 € (programme, p. 71) : +28 % pour ≈ 730 000 allocataires (DREES) ≈ 2,6 Md€ ; nouveaux éligibles (plafond relevé) ≈ +0,8"
  rsa_trimestres:
    valeur: {id: LFI-RET-05, libelle: "RSA comptabilisé pour valider des trimestres de retraite", poste: retraites, moteur: pensions, debut: 2030, plein: 2060,
             montant: {crise: 1.0, prudent: 0.8, median: 0.6, optimiste: 0.4}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    note: "Effet lent (validations nouvelles, pensions liquidées des décennies plus tard) ; en grande partie couvert par le minimum au SMIC pour les carrières devenues complètes."
  penibilite_agricoles:
    valeur: {id: LFI-RET-06, libelle: "Facteurs de pénibilité rétablis ; retraites agricoles réformées", poste: retraites, moteur: "bloc:retraites", debut: 2028, plein: 2032,
             montant: {crise: 1.0, prudent: 1.0, median: 0.8, optimiste: 0.6}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    note: "Moins que chez Tondelier (1,5 et 0,5) : avec la retraite à 60 ans pour tous, les départs anticipés pour pénibilité gagnent moins d'années."
  pensions_fp:
    valeur: {id: LFI-RET-07, libelle: "Pensions des fonctionnaires relevées par le point d'indice (+10 %) et le rattrapage dans l'Éducation nationale (départs suivants)", poste: retraites, moteur: pensions, debut: 2028, plein: 2062,
             montant: {crise: 11.8, prudent: 11.8, median: 11.8, optimiste: 11.8}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calcul : pensions de l'État et de la CNRACL ≈ 85 Md€ (tondelier_fp.pensions_fonction_publique) × 10 % = 8,5 ; Éducation nationale ≈ 30 % de ces pensions × 13 % de rattrapage en plus = 3,3 ; les pensions suivent le traitement indiciaire de fin de carrière : montée sur 35 ans"

  # ================================================================ SANTÉ ET AUTONOMIE
  cent_pour_cent_secu:
    valeur: {id: LFI-SAN-01, libelle: "« 100 % Sécu » : soins prescrits remboursés à 100 %, complémentaires intégrées à la Sécurité sociale", poste: sante, moteur: "bloc:sante", debut: 2028, plein: 2030,
             montant: {crise: 30.0, prudent: 28.0, median: 25.0, optimiste: 22.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
