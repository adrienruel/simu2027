# Programme de Jean-Luc Mélenchon (La France insoumise) : chiffrage mesure par mesure sur le noyau (6 novembre 2026).
#
# Source : « L'Avenir en commun. Le programme de la Nouvelle France » (5e édition, La Dispute, novembre 2026, 224 p.),
# lu en entier. Le livre ne donne aucun chiffrage (ni coût, ni recette) : les montants inscrits dans le texte sont des
# paramètres de mesure (SMIC à 1 700 € net, seuil de pauvreté de 1 337 €, point d'indice +10 %, APL +10 %, 3 Md€ pour
# les violences sexistes et sexuelles, 1 Md€ contre le racisme, 0,7 % du RNB pour l'aide au développement, 1 % du PIB
# pour la culture, 200 000 logements publics par an, 700 000 isolations par an, etc.). Fiche des mesures et citations
# vérifiées page par page : programmes/melenchon/mesures.yaml (pagination imprimée du livre).
#
# Règles (README, décisions d'Adrien) : on ne reprend que les mesures, jamais les recettes ni les économies annoncées
# (le livre n'en chiffre aucune ; les « économies réalisées sur le coût du malheur », p. 78, ne sont pas saisies) ;
# chaque ligne sans source est estimée en crise / prudent / médian / optimiste ; dépense : crise ≥ prudent ≥ médian ≥
# optimiste ; recette : l'inverse.
#
# Format d'une mesure (groupe melenchon_mesures, moteur/programme_simple.py) : montant en Md€ de 2026 à l'économie de
# 2029, mesure pleinement en place ; + = recette en plus (poste recettes) ou dépense en plus (bloc de dépense) ;
# participations : − = dette en plus hors solde (achat d'actifs). moteur : ce que suit le montant après 2029 (pib,
# fixe, pensions, recette:<impôt>, bloc:<bloc>) ; debut, plein : montée linéaire ; fin : dernière année ; depart :
# montant de la première année ; fp : rémunération publique (57 % reviennent en prélèvements) ; postes : la dépense
# paie des postes publics (coût par poste : cout_poste, sinon melenchon_emploi.cout_poste_public).
#
# Calendrier (arbitrage) : élection en mai 2027 ; SMIC, point d'indice et APL dès 2027 (« immédiatement », « état
# d'urgence sociale », p. 57 et 60), en demi-année ; le reste à partir de la loi de finances 2028. Les montants de 2027
# et 2028 s'ajoutent à la dette de fin 2028.
#
# Arbitrages pris par Claude le 06/11/2026 (le livre ne règle pas) : docs/melenchon.md, section « Arbitrages ».

melenchon_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

melenchon_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

melenchon_smic:
  smic_net_programme:
    valeur: 1700
    unite: eur_mois
    annee_euros: 2027
    statut: SOURCE
    source: "Programme, p. 57 et 60 : « Porter immédiatement le SMIC mensuel à 1 700 euros net »"
    note: "En euros de 2027, ramené en euros de 2026 par l'inflation de 2027 (inflation.base), puis en brut par le barème OpenFisca de 2026. Dès juillet 2027 (moitié de l'effet en 2027)."
  allegements_suivent_smic:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Le livre ne dit rien des allègements : lecture de la loi actuelle (allègements définis en multiples du SMIC), comme pour Arthaud. Variante « nominalisés » (lecture Tondelier) : coût au SMIC plus élevé, plus d'emplois perdus."
  diffusion_jusqu_a:
    valeur: 1.4
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.diffusion_jusqu_a (Dares, Insee : diffusion jusqu'à 1,3 à 1,5 SMIC)"
    note: "L'indexation des salaires sur l'inflation (p. 60) n'est pas chiffrée : les salaires du statu quo progressent déjà plus vite que les prix."
  elasticite_emploi:
    valeur: {crise: -1.0, prudent: -0.8, median: -0.6, optimiste: -0.4}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Mêmes valeurs que tondelier_smic.elasticite_emploi (Kramarz et Philippon, 2001 ; Crépon et Desplatz, 2001 ; L'Horty, 2006)"
    note: "Élasticité constante (emplois × (1 − rapport des coûts^élasticité)), montée en trois ans (2027-2029)."
  part_marge_absorbee:
    valeur: 0.5
    unite: taux
    statut: HYPOTHESE
    note: "Même valeur que Tondelier et Arthaud."
  valeur_emploi_chomeur:
    valeur: 9000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.valeur_emploi_chomeur"

melenchon_fp:
  part_indiciaire:
    valeur: 0.55
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que tondelier_mesures.point_indice : traitement indiciaire ≈ 55 % du coût employeur des agents (390 Md€, OpenFisca 2026 sur les distributions DGAFP)"
  hausse_point:
    valeur: 0.10
    unite: taux
    statut: SOURCE
    source: "Programme, p. 57 : « Revaloriser la valeur du point d'indice des fonctionnaires de 10 % »"
    note: "Dès juillet 2027 (moitié en 2027). Compensation intégrale aux collectivités : transfert interne aux administrations publiques, sans effet sur le solde consolidé."

melenchon_retraites:
  profil_62_ans:
    valeur: {58: 0.03, 59: 0.05, 60: 0.12, 61: 0.17, 62: 0.72, 63: 0.80, 64: 0.86, 65: 0.95, 66: 0.97, 67: 0.98, 68: 1.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même profil que tondelier_retraites.profil_62_ans (DREES, fiche 16, 2023, âge légal 62 ans)"
    note: "Abrogation de la réforme de 2023 (p. 78) : 62 ans pour les départs de 2028."
  profil_60_ans:
    valeur: {58: 0.03, 59: 0.05, 60: 0.65, 61: 0.74, 62: 0.81, 63: 0.86, 64: 0.90, 65: 0.96, 66: 0.97, 67: 0.98, 68: 1.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : DREES et CNAV, départs des années 2000 (âge légal 60 ans, 40 annuités, décote) : environ 55 % des départs du régime général à 60 ans, âge moyen de départ ≈ 61 ans ; ici la décote est supprimée (p. 79) : plus de départs à 60 ans (65 % partis à 60 ans)"
    note: "Carrières longues avant 60 ans gardées comme dans le profil commun (pas de départ avant 60 ans en plus)."
  calendrier:
    valeur: {abrogation: 2028, soixante_ans: 2032}
    unite: sans_unite
    statut: DECISION
    note: "« Abroger la réforme Macron [...] puis abaisser l'âge de départ jusqu'à restaurer le droit à la retraite à 60 ans » (p. 78) : 62 ans pour les départs de 2028, puis six mois de moins par an jusqu'à 60 ans pour les départs de 2032 (mélange linéaire des deux profils par année de départ). Durée de 40 annuités et fin de la décote : mesure à part (duree_decote)."

melenchon_chomage:
  hausse_taux:
    valeur: {crise: 0.006, prudent: 0.006, median: 0.0045, optimiste: 0.003}
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.assurance_chomage (Banque de France, Bulletin n° 264, 2026 : les réformes de 2021 et 2023 ont baissé le chômage structurel de 0,6 point)"
    note: "Hausse du taux de chômage quand ces réformes sont annulées (PRE-03), montée de 2028 à 2030 ; chaque chômeur en plus coûte la valeur d'un emploi au SMIC."

melenchon_temps_travail:
  hausse_cout_horaire:
    valeur: 0.027
    unite: taux
    statut: HYPOTHESE
    source: "Calcul : sixième semaine de congés payés (5 jours) et 4 février férié (1 jour) sur ≈ 220 jours travaillés par an : −2,7 % d'heures payées au même salaire, soit +2,7 % de coût horaire du travail dans le privé"
    note: "Les 32 heures dans les métiers pénibles et de nuit « favorisées par la négociation » (p. 74) ne sont pas comptées dans le privé."
  elasticite_emploi:
    valeur: {crise: -0.5, prudent: -0.3, median: -0.2, optimiste: -0.1}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : élasticité de l'emploi au coût du travail hors du voisinage du SMIC −0,2 à −0,5 (Mésange, DG Trésor ; L'Horty, 2006) ; une partie de la baisse d'heures est rattrapée en productivité ou en embauches (35 heures : Insee, 2004)"
  emplois_prive:
    valeur: 20300000
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : salariés du privé ≈ 20 millions (Insee, 2025)"

melenchon_emplois_aides:
  garantie_emploi:
    valeur: {emplois: 240000, eviction: {crise: 0.2, prudent: 0.15, median: 0.1, optimiste: 0.05}, debut: 2028, plein: 2031}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Emplois : ≈ 600 000 chômeurs de longue durée × 40 % (melenchon_mesures.garantie_emploi) ; éviction faible : emplois « utiles à la bifurcation écologique ou à l'action sociale » non concurrents, comme Territoires zéro chômeur (éviction 10 %, tondelier_emploi.garantie_emploi)"
    note: "Emplois venus du chômage (pas de l'inactivité), comptés hors de l'éviction commune des postes publics ; leurs prélèvements sont dans la part fp de la mesure."
  emploi_jeune:
    valeur: {emplois: 150000, eviction: {crise: 0.5, prudent: 0.4, median: 0.3, optimiste: 0.2}, debut: 2028, plein: 2031}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : emplois-jeunes de 1997-2002 : une partie a remplacé des embauches que les collectivités et associations auraient faites (Dares, 2001, effets d'aubaine ≈ 30 à 50 %)"

melenchon_mesures:

  # ================================================================ RECETTES : revenus et patrimoine
  ir_hauts_revenus:
    valeur: {id: LFI-REC-01, instrument: travail, incidence: haut, libelle: "Impôt sur le revenu à 14 tranches : tranches du haut relevées", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.5, prudent: 2.0, median: 3.0, optimiste: 4.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : tranche à 60 % au-delà de 250 000 € par part ≈ 1,2 Md€ en prudent (tondelier_mesures.ir_tranche_60) ; 14 tranches : tranches de 50 à 60 % à partir de ≈ 100 000 € par part (barème de L'Avenir en commun 2022) ; élasticité du revenu imposable des hauts revenus 0,5 à 0,8"
    note: "Barème non donné (p. 58). Arbitrage : hausse des taux au-delà de 100 000 € par part, baisse en bas du barème (ir_bas_revenus)."
  ir_bas_revenus:
    valeur: {id: LFI-REC-01, instrument: travail, incidence: ir, libelle: "Impôt sur le revenu à 14 tranches : tranches du bas abaissées", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: -4.5, prudent: -4.5, median: -3.3, optimiste: -3.3}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même chiffrage que tondelier_mesures.ir_tranches_basses (2 points de moins en bas du barème, 3,3 à 4,5 Md€)"
  quotient_conjugal:
    valeur: {id: LFI-REC-02, instrument: travail, incidence: haut, libelle: "Fin du quotient conjugal (impôt individualisé)", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 5.0, prudent: 6.0, median: 7.0, optimiste: 8.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : avantage du quotient conjugal ≈ 8 à 10 Md€ (Conseil des prélèvements obligatoires ; Allègre, Périvier et Pucci, OFCE, 2023, ≈ 9 Md€ pour une individualisation pure) ; prudent ≈ 65 % (choix de déclaration, abattements de transition)"
  credit_impot_enfant:
    valeur: {id: LFI-REC-03, instrument: travail, incidence: ir, libelle: "Crédit d'impôt par enfant pour toutes les familles (à la place du quotient familial)", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: -1.5, prudent: -1.0, median: 0.0, optimiste: 0.0}}
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Encadrement : avantage du quotient familial pour les enfants ≈ 10 à 12 Md€ (DREES, Panorama des prestations ; France Stratégie)"
    note: "Arbitrage : le crédit d'impôt remplace le quotient familial à budget constant (médian) ; prudent : surcoût de transition (personne ne perd plus de 500 €). Montant du crédit non donné (p. 59)."
  flat_tax:
    valeur: {id: LFI-REC-04, instrument: capital_menages, libelle: "Flat tax supprimée : revenus du capital au barème de l'impôt sur le revenu", poste: recettes, moteur: "recette:capital_dividendes_ifi", debut: 2028, plein: 2028,
             montant: {crise: 0.5, prudent: 1.0, median: 2.0, optimiste: 3.0}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : passage du PFU (12,8 %) au barème : ≈ 3 à 4 Md€ en statique ; baisse des dividendes versés après la hausse de 2013 et hausse après 2018 (IPP, rapports d'évaluation de 2019 à 2023) : prudent au quart"
  isf:
    valeur: {id: LFI-REC-05, instrument: capital_menages, libelle: "ISF rétabli et renforcé, volet climatique (à la place de l'IFI)", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 1.5, prudent: 2.5, median: 3.5, optimiste: 4.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : ISF 2017 ≈ 4,2 Md€, IFI ≈ 2,2 Md€ (DGFiP) ; gain net sur l'IFI ≈ 2 Md€ (tondelier_mesures.isf_climatique) ; « renforcé » : barème non donné, +0,5 Md€ en prudent"
  zucman:
    valeur: {id: LFI-REC-06, instrument: capital_menages, libelle: "Taxe Zucman : garantie d'impôt de 2 % sur les patrimoines de plus de 100 M€ ; exit tax renforcée", poste: recettes, moteur: pib, debut: 2028, plein: 2028,
             montant: {crise: 3.0, prudent: 5.0, median: 8.0, optimiste: 12.0}}
