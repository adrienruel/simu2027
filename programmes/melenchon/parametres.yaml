    note: "Arbitrage : « faire mieux que la moyenne européenne de 19 élèves par classe » (p. 118) lu comme 19 en primaire et en éducation prioritaire, une baisse plus modeste ailleurs ; 19 élèves partout au lycée coûterait plusieurs Md€ de plus."
