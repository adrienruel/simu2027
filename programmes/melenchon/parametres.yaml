    note: "Plus fort que l'interdiction actuelle (2 h 30 et trois lignes) : 30 % (crise), 40 % (prudent), 50 % (médian), 60 % (optimiste) des émissions des vols métropolitains (la Corse et les liaisons de plus de quatre heures en train restent)."
