    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même budget (1 Md€ par an) et même effet que tondelier_ecologie.leasing_social"
  plan_velo:
    valeur: {id: LFI-INV-03, libelle: "Plan vélo rétabli", secteur: transports, debut: 2028, plein: 2035,
             effet_mt: {crise: -0.03, prudent: -0.05, median: -0.12, optimiste: -0.25}}
    unite: mt_co2e
    statut: HYPOTHESE
