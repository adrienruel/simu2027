# Programme de Bruno Retailleau (Les Républicains) : chiffrage sur le noyau (7 novembre 2026).
#
# Pas de programme présidentiel consolidé au 6/11/2026 : livrets thématiques « Nos propositions pour la France » (LR,
# janvier à septembre 2026), entretiens et communiqués ; 93 mesures recensées par programmes-2027.fr (fiche :
# programmes/retailleau/mesures.yaml).
#
# Règles : on ne reprend que les mesures, jamais les économies annoncées (plan de 197 Md€, 8 Md€ de l'assurance chômage,
# 4 Md€ des arrêts maladie, 25 Md€ des fonctionnaires : non saisis ; chaque mesure nommée est estimée) ; les montants des
# mesures donnés par le candidat (restitution de 30 Md€, 700 M€ du congé de naissance, défense à 100 Md€) sont des
# paramètres ; dépense : crise ≥ prudent ≥ médian ≥ optimiste ; recette : l'inverse. Calendrier : loi de finances 2028.

retailleau_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

retailleau_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

retailleau_retraites:
  solde_reforme:
    valeur: {crise: 0.0, prudent: 1.0, median: 2.5, optimiste: 4.0}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "LCP (23/09/2026) : âge minimal de 63 ans avec une décote de 7 % par année d'anticipation (taux plein à 63 ans pour les carrières longues complètes), taux plein automatique ramené de 67 à 65 ans. Relecture neutre (11/11/2026) : ce n'est pas un report de l'âge à 65 ans. Effets : départs à 63-64 ans avec décote proches de la neutralité actuarielle ; décote à 64 ans pour ceux qui ont leur durée, d'où des départs plus tardifs (économie) ; taux plein dès 65 ans au lieu de 67 (coût : ≈ 7 % d'une génération part à 67 ans pour le taux plein, DREES fiche 16 ; 0,07 × 0,8 million × 2 ans × ≈ 14 000 € ≈ 1,6 Md€, plus ≈ 0,5 Md€ de décote annulée à 65-66 ans)"
    note: "Solde net de la réforme à plein effet (économie, Md€ par an), montée de 2030 à 2036 ; emploi des seniors non compté (effets de sens contraires). Remplace le report à 65 ans et la ligne taux_plein_65 du chiffrage du 07/11/2026."
  debut:
    valeur: 2030
    unite: sans_unite
    statut: DECISION
  plein:
    valeur: 2036
    unite: sans_unite
    statut: DECISION

retailleau_restitution:
  baisse_salaries:
    valeur: 13.0
    unite: md_eur
    annee_euros: 2026
    statut: DECISION
    source: "Le travail gagnant (09/01/2026), p. 36 : au moins 30 Md€ par an restitués, moitié aux salariés (≈ 500 € par an au salaire médian), moitié aux entreprises ; arbitrage : moitié salariés = 15 Md€, dont ≈ 2 Md€ par le « zéro cotisation » au-delà de 1 623 heures (retailleau_mesures.zero_cotisation) ; le reste (13 Md€) en cotisations salariales en moins ; moitié entreprises = impôts de production (retailleau_mesures.impots_production)"
    note: "Montant de la mesure (paramètre), pas une recette annoncée. Même calcul que le « droit au brut » d'Attal : cotisations entièrement déductibles, impôt sur le revenu en plus, prestations en moins, effet d'offre par OpenFisca."
  part_ir_retrouvee:
    valeur: {crise: 0.6, prudent: 0.65, median: 0.72, optimiste: 0.8}
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que zemmour_csg.part_ir_retrouvee"
  premiere_annee:
    valeur: 2029
    unite: sans_unite
    statut: DECISION
    note: "Restitution financée par le plan d'économies, montée à partir de 2029 (arbitrage)."

retailleau_chomage:
  baisse_taux:
    valeur: {crise: 0.0015, prudent: 0.003, median: 0.004, optimiste: 0.005}
    unite: taux
    statut: HYPOTHESE
    source: "Encadrement : réformes de 2021 et 2023 = 0,6 point de chômage structurel (Banque de France, Bulletin n° 264, 2026) ; règles de juin 2024 ≈ 0,3 point selon le gouvernement ; ruptures conventionnelles et dégressivité en plus"

