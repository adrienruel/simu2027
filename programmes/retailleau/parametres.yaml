             montant: {crise: -6.5, prudent: -6.0, median: -6.0, optimiste: -5.5}}
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Produire plus pour vivre mieux (19/02/2026), p. 20 : quatre impôts de production (≈ 15 Md€) supprimés ou réduits : C3S, CVAE, part industrielle de la CFE ; calcul : C3S ≈ 4,5 Md€ (2025), CFE industrielle ≈ 1,5 Md€ ; la CVAE est déjà supprimée en 2030 au statu quo (lignes cvae)"
    note: "Les ≈ 15 Md€ du livret comptent la CVAE entière : au statu quo elle ne rapporte plus que ≈ 2 Md€ en 2028 et 1 Md€ en 2029."
  cvae:
