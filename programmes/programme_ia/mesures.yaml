# « Programme IA » — les 20 mesures et leur traitement dans le chiffrage (18 novembre 2026)
#
# Programme de test écrit par Claude à la demande de Dana, pour un benchmark ludique. Pas un candidat : non publié
# (absent de programmes/publies.yaml), hors des sorties et des tests par défaut.
#
# traitement :
#   chiffre        ligne de programme_ia_mesures (cle)
#   estime         économie sans détail : enveloppe commune (cle)
#   non_chiffre    effet possible, pas de paramètre (raison)
#   sans_effet     pas d'effet sur les comptes publics, ou déjà dans le statu quo

programme:
  candidat: "Programme IA (Claude)"
  parti: aucun
  document: "Programme IA 2027, 20 mesures chiffrées (conversation du 18/11/2026)"
  date_lecture: 2026-11-18
  annonce_non_saisie: "+41,5 Md€ net par an en 2032, dont 30 Md€ par la règle de dépense ; déficit annoncé ≈ 3,6 % du PIB en 2032"
  version: "3 (18/11/2026, soir) : mesures 8, 12, 14, 15, 16 et 18 retirées, mesure 4 portée à 5 ans, santé en cible de la règle de dépense, prestations protégées (docs/programme_ia.md)"

mesures:
  - {id: IA-FIN-01, intitule: "Règle de dépense : hors défense et charge de la dette, +0,5 % par an en volume au plus (loi organique)", traitement: estime, cle: "programme_ia_enveloppe",
     note: "Les 30 Md€ annoncés ne sont pas repris : enveloppe commune, domaine par domaine, l'annonce sert de plafond."}
  - {id: IA-FIN-02, intitule: "Revue des niches fiscales et sociales", traitement: chiffre, cle: niches}
  - {id: IA-FIN-03, intitule: "Fusion d'agences, fin des doublons État-collectivités", traitement: chiffre, cle: "agences, doublons_collectivites"}
  - {id: IA-FIN-04, intitule: "Sous-indexation des pensions au-dessus de 2 000 €/mois (inflation − 0,8 pt pendant 5 ans ; 3 ans avant la version 3)", traitement: chiffre, cle: "pensions_sous_indexees, pensions_prelevements"}
  - {id: IA-FIN-05, intitule: "Lutte contre la fraude fiscale et sociale", traitement: chiffre, cle: "fraude, fraude_controleurs"}
  - {id: IA-EMP-06, intitule: "Refonte des allègements de charges (fin de la trappe à bas salaires)", traitement: chiffre, cle: allegements,
     note: "Le gain d'emplois annoncé par le lissage n'est pas compté : seul le coût du travail en hausse passe par le canal commun."}
  - {id: IA-EMP-07, intitule: "Aides à l'apprentissage recentrées sur le niveau bac et infra-bac", traitement: chiffre, cle: apprentissage}
  - {id: IA-EMP-08, intitule: "Emploi des seniors : cumul emploi-retraite créateur de droits, cotisations allégées en CDI", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-LOG-09, intitule: "Choc d'offre de logements (densification autour des gares, permis en 3 mois, foncier public)", traitement: chiffre, cle: "programme_ia_canaux.logement",
     note: "Version 3 : dépense de foncier public retirée, seul le canal commun reste. Version 2 : la dépense est ramenée au foncier public ; densification et permis passent par le canal commun de l'offre de logements (intensité 0,5)."}
  - {id: IA-LOG-10, intitule: "Moins de droits de mutation, plus de taxe foncière (à budget constant)", traitement: non_chiffre,
     note: "Bascule neutre pour les collectivités ; pas de canal de mobilité résidentielle dans le noyau."}
  - {id: IA-ECO-11, intitule: "Rénovation des passoires thermiques des ménages modestes", traitement: chiffre, cle: "renovation (et programme_ia_ecologie.renovation)"}
  - {id: IA-ECO-12, intitule: "Leasing social électrique reconduit, ciblé sur le rural", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-ECO-13, intitule: "Mix électrique : EPR2 au calendrier, solaire et éolien en mer accélérés", traitement: sans_effet, note: "Porté par EDF et les tarifs ; trajectoire du statu quo."}
  - {id: IA-EDU-14, intitule: "Revalorisation des enseignants en début de carrière, formation refondue", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-EDU-15, intitule: "100 000 places de crèche", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-SAN-16, intitule: "Accès aux soins : assistants médicaux, délégation de tâches, 4e année d'internat en zone sous-dotée", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-SAN-17, intitule: "Taxe sur les boissons sucrées renforcée, prévention", traitement: chiffre, cle: boissons_sucrees}
  - {id: IA-REG-18, intitule: "Justice : greffiers et magistrats, procédures numérisées", traitement: non_chiffre, note: "Retirée en version 3 (règle : meilleur déficit du simulateur, émissions en baisse, minima protégés) : la mesure ne faisait que coûter dans le modèle."}
  - {id: IA-REG-19, intitule: "Défense : tenir la loi de programmation militaire", traitement: sans_effet, note: "Déjà dans le statu quo (statu_quo.yaml : LPM actualisée, 2,5 % du PIB en 2030)."}
  - {id: IA-INS-20, intitule: "Dose de proportionnelle, référendum d'initiative partagée plus accessible", traitement: sans_effet}
  # ---------------------------------------------------------------- version 2
  - {id: IA-EMP-21, intitule: "Assurance chômage : durée modulée selon la conjoncture, affiliation de 6 à 8 mois", traitement: chiffre, cle: "assurance_chomage, programme_ia_chomage.baisse_taux"}
  - {id: IA-NUM-22, intitule: "Plan IA (1 Md€ par an) : diffusion de l'IA dans les PME et les services publics", traitement: non_chiffre,
     note: "Testé puis retiré : le canal commun d'adoption de l'IA rend +0,2 Md€ au solde en 2037 (prudent) pour 1,1 Md€ de coût."}
  - {id: IA-ECO-23, intitule: "TER et Intercités ouverts à la concurrence d'ici 2030 ; fin des tarifs réglementés d'électricité pour les petites entreprises", traitement: chiffre, cle: "programme_ia_canaux.reformes_structurelles (pmr 1,0)"}
  - {id: IA-RET-24, intitule: "Âge légal porté à 65 ans (un trimestre par génération dès 1966), carrières longues et usure gardées", traitement: chiffre, cle: "programme_ia_retraites (bibliotheque.report_age_legal)"}
  - {id: IA-FIS-25, intitule: "Successions : cumul sur la vie, abattement relevé pour les petits héritages, Dutreil et assurance-vie plafonnés au-delà de 1 M€", traitement: chiffre, cle: successions}
  - {id: IA-FIN-26, intitule: "Trois jours de carence dans le public comme dans le privé", traitement: chiffre, cle: carence}
