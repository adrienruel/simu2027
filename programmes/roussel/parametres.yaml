    unite: sans_unite
    statut: HYPOTHESE
    source: "Même échelle que melenchon_emplois_aides.garantie_emploi (≈ 600 000 chômeurs de longue durée × 40 %) ; objectif d'éradiquer le chômage de longue durée en cinq ans (Le Parti pris du travail, 2025)"
    note: "Emplois venus du chômage ; coût dans roussel_mesures.securite_emploi_cout."

roussel_temps_travail:
  elasticite_emploi:
    valeur: {crise: -0.5, prudent: -0.3, median: -0.2, optimiste: -0.1}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même valeur que melenchon_temps_travail.elasticite_emploi (Mésange, DG Trésor ; L'Horty, 2006)"
  trente_deux_heures:
    valeur: {heures_actuelles: 35, heures_cible: 32, debut: 2028, plein: 2032, emplois_prive: 20300000, part_marchande: 0.75,
             gain_productivite: {crise: 0.2, prudent: 0.3, median: 0.35, optimiste: 0.4},
             part_embauches: {crise: 0.25, prudent: 0.3, median: 0.35, optimiste: 0.4},
             part_compensee_fp: {crise: 0.7, prudent: 0.6, median: 0.5, optimiste: 0.4}}
    unite: sans_unite
    statut: HYPOTHESE
    source: "« La semaine de travail passera à 32 heures, sans diminution de salaires » (votons-2027.fr, mesure phare ; france-vote.fr, 2026). Précédent des 35 heures : ≈ 350 000 emplois créés de 1998 à 2002 (Dares, 2005), avec des allègements de cotisations et une modération salariale ; Askenazy (2008) : gains de productivité horaire importants"
    note: "Baisse de 8,6 % des heures par salarié, au même salaire : coût horaire +9,4 %, réduit des gains de productivité (crise 20 %, prudent 30 %, médian 35 %, optimiste 40 % de la baisse d'heures) ; une autre part des heures est rendue par des embauches (25 à 40 %, ≈ 350 000 en 2002 pour une baisse de 10 % sur 60 % des salariés, soit ≈ 35 %). Le reste est de la production en moins (part marchande du PIB ≈ 75 %). Emplois perdus par le coût horaire : élasticité de melenchon_temps_travail. Sans allègements de cotisations (le programme n'en prévoit pas). Fonction publique : embauches pour garder le service, 40 à 70 % des heures perdues. Montée de 2028 à 2032 (négociation)."

