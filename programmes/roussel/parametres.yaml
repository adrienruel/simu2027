# ---------------------------------------------------------------- effets en tonnes (même méthode que tondelier_ecologie)
# Négatif : émissions évitées. Prudence : dans le prudent, l'effet favorable au climat est le plus faible.
roussel_ecologie:
  ferroviaire:
    valeur: {id: PCF-TRA-01, libelle: "Ferroviaire : +15 Md€ par an, fret doublé", secteur: transports, debut: 2030, plein: 2040, effet_mt: {crise: -1.5, prudent: -3.0, median: -6.0, optimiste: -9.0}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que tondelier_ecologie.ferroviaire (SNCF, 2022 : reporter 10 % du trafic routier sur le rail ; Citepa : ≈ 117 Mt pour la route)"
    note: "Cinq fois le budget de Tondelier (3 Md€) : part des émissions routières reportée 1,3 % (crise), 2,5 % (prudent), 5 % (médian), 7,5 % (optimiste), rendement décroissant (capacité du réseau)."
  transports_gratuits:
    valeur: {id: PCF-TRA-02, libelle: "Transports en commun gratuits", secteur: transports, debut: 2028, plein: 2030, effet_mt: {crise: -0.5, prudent: -1.0, median: -2.0, optimiste: -3.0}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que tondelier_ecologie.ticket_climat ; retours d'expérience de Dunkerque et Montpellier : fréquentation +60 à +85 %, mais une partie vient de la marche et du vélo (Agence d'urbanisme Flandre-Dunkerque, 2020)"
    note: "Une fois et demie l'effet du Ticket climat de Tondelier : 0,8 à 4,7 % des émissions des voitures, selon le report réel depuis la voiture."
  vehicules:
    valeur: {id: PCF-TRA-03, libelle: "Aide de 10 000 € pour les véhicules peu polluants", secteur: transports, debut: 2028, plein: 2032, fin_debut: 2035, fin: 2045, effet_mt: {crise: -0.32, prudent: -0.32, median: -0.48, optimiste: -0.64}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que tondelier_ecologie.leasing_social (1,6 t par voiture thermique remplacée et par an)"
    note: "≈ 100 000 aides par an, ≈ 500 000 véhicules en 2032 ; additionnalité 40 / 40 / 60 / 80 %."
  carburants:
    valeur: {id: PCF-FIS-07, libelle: "Carburant bloqué à 1,50 € le litre", secteur: transports, debut: 2028, plein: 2032, effet_mt: {crise: 3.0, prudent: 2.5, median: 1.8, optimiste: 1.2}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Labandeira et al. (2017) : élasticité-prix de long terme ≈ −0,3 à −0,6 ; Citepa : voitures et véhicules utilitaires ≈ 90 Mt"
    note: "Prix ≈ −15 % pour les ménages et les entreprises : +1,3 à +3,3 % de consommation de carburant."

# --- Canaux déclarés (moteur/canaux_declares.py) : effets ouverts à tous les programmes, barème commun -----------
roussel_canaux:
  reformes_structurelles:
    valeur: {pmr: -2, epl: 0, debut: 2028}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Égert et Gal (2017), OCDE, document de travail n° 1354"
    note: "Marchés de produits : nationalisation de BNP Paribas, de la Société générale et d'AXA (1), d'Engie et pôle public de l'énergie (0,5), des autoroutes (0,5), de la pharmacie et des transports (0,5), carburant bloqué à 1,50 € (0,5) : au-delà du plafond, −2. Barème commun des réformes de structure (macro.reformes_structurelles : Égert et Gal, OCDE, 2017 ; 12/11/2026, demande d'Adrien : gains de productivité évalués de la même façon pour tous). Grille : 1 = refonte d'un domaine, 0,5 = mesure ciblée, 0,25 = une entreprise ou un média ; positif = libéralise, négatif = réglemente ou nationalise ; plafond ±2."
  ecole:
    valeur: {niveau_eleves: {crise: 0, prudent: 0, median: 0, optimiste: 0.1}, debut: 2045, annees: 40}
    unite: sans_unite
    statut: HYPOTHESE
    note: "Niveau des élèves (écart-type ; 0,1 ≈ 10 points PISA), compté dans le seul scénario optimiste. Mesure du programme : PCF-EDU-01 (90 000 enseignants, classes de 20 élèves en primaire). Barème commun (12/11/2026, décision d'Adrien : canaux ouverts à tous) : même valeur que pour Écologie de droite dès qu'une mesure du programme porte sur le même objet, quelle que soit son ampleur. À affiner mesure par mesure."
