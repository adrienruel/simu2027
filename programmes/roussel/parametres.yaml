# Programme de Fabien Roussel (Parti communiste français) : chiffrage sur le noyau (11 novembre 2026).
#
# Pas de programme présidentiel 2027 publié : discours de l'université d'été (22/08/2026), Fête de l'Humanité (2025 et
# 12/09/2026), « Pacte pour l'avenir de la France » (2025), pages thématiques de pcf.fr, recensés par
# programme-candidat.fr, quivoter2027.com et swipetonvote.fr. Fiche : programmes/roussel/mesures.yaml.
#
# Règles (décisions d'Adrien) : on ne reprend que les mesures, jamais les recettes annoncées ; les montants des
# mesures donnés par le candidat (15 Md€ pour le rail, 10 Md€ pour les transports gratuits, 1 Md€ pour les droits des
# femmes) sont des paramètres ; les mesures communes avec L'Avenir en commun reprennent les estimations de Mélenchon.
# Dépense : crise ≥ prudent ≥ médian ≥ optimiste ; recette : l'inverse. Calendrier : loi de finances 2028.

roussel_emploi:
  cout_poste_public:
    valeur: 55000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.cout_poste_public : coût employeur moyen d'un agent ≈ 68 000 € (390 Md€ pour 5,7 millions d'agents), plus bas pour les postes créés"
  valeur_emploi:
    valeur: 20000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Calculée pour le programme Tondelier (SMIC) : prélèvements, TVA et dépense de chômage d'un emploi au voisinage du SMIC, OpenFisca 2026 ≈ 19 600 €"
  valeur_ajoutee_emploi:
    valeur: 35000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même règle que Tondelier et Arthaud : coût moyen d'un emploi perdu par le SMIC ≈ 28 000 € × 1,25"

roussel_macro:
  multiplicateur_actif:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Même mécanique que tous les programmes (moteur/programme_simple.py)."

roussel_smic:
  smic_net_programme:
    valeur: 1700
    unite: eur_mois
    annee_euros: 2027
    statut: SOURCE
    source: "Université d'été du PCF (22/08/2026, pcf.fr, repris par quivoter2027.com) : SMIC à 1 700 € net, hausse de 5 % de tous les salaires, échelle mobile ; 2 000 € brut (≈ 1 560 € net) à la Fête de l'Humanité 2025"
    note: "En euros de 2027, ramené en euros de 2026 par l'inflation de 2027 (inflation.base), puis en brut par le barème OpenFisca de 2026. À partir de 2028. La hausse de 5 % des autres salaires du privé et l'échelle mobile ne sont pas des mesures budgétaires (négociation) : non comptées."
  allegements_suivent_smic:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Le livre ne dit rien des allègements : lecture de la loi actuelle (allègements définis en multiples du SMIC), comme pour Arthaud. Variante « nominalisés » (lecture Tondelier) : coût au SMIC plus élevé, plus d'emplois perdus."
  diffusion_jusqu_a:
    valeur: 1.4
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.diffusion_jusqu_a (Dares, Insee : diffusion jusqu'à 1,3 à 1,5 SMIC)"
    note: "L'échelle mobile des salaires n'est pas chiffrée : les salaires du statu quo progressent déjà plus vite que les prix."
  elasticite_emploi:
    valeur: {crise: -1.0, prudent: -0.8, median: -0.6, optimiste: -0.4}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Mêmes valeurs que tondelier_smic.elasticite_emploi (Kramarz et Philippon, 2001 ; Crépon et Desplatz, 2001 ; L'Horty, 2006)"
    note: "Élasticité constante (emplois × (1 − rapport des coûts^élasticité)), montée en trois ans (2027-2029)."
  part_marge_absorbee:
    valeur: 0.5
    unite: taux
    statut: HYPOTHESE
    note: "Même valeur que Tondelier et Arthaud."
  valeur_emploi_chomeur:
    valeur: 9000
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.valeur_emploi_chomeur"

roussel_fp:
  part_indiciaire:
    valeur: 0.55
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que tondelier_mesures.point_indice : traitement indiciaire ≈ 55 % du coût employeur des agents (390 Md€, OpenFisca 2026 sur les distributions DGAFP)"
  hausse_point:
    valeur: 0.05
    unite: taux
    statut: SOURCE
    source: "Université d'été (22/08/2026) : hausse de 5 % de tous les salaires, appliquée au point d'indice ; +10 % à la Fête de l'Humanité 2025 (non repris en 2026)"
    note: "À partir de 2028. Compensation intégrale aux collectivités : transfert interne aux administrations publiques, sans effet sur le solde consolidé."

roussel_retraites:
  profil_62_ans:
    valeur: {58: 0.03, 59: 0.05, 60: 0.12, 61: 0.17, 62: 0.72, 63: 0.80, 64: 0.86, 65: 0.95, 66: 0.97, 67: 0.98, 68: 1.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Même profil que tondelier_retraites.profil_62_ans (DREES, fiche 16, 2023, âge légal 62 ans)"
    note: "Abrogation de la réforme de 2023 : 62 ans pour les départs de 2028."
  profil_60_ans:
    valeur: {58: 0.03, 59: 0.05, 60: 0.65, 61: 0.74, 62: 0.81, 63: 0.86, 64: 0.90, 65: 0.96, 66: 0.97, 67: 0.98, 68: 1.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : DREES et CNAV, départs des années 2000 (âge légal 60 ans, 40 annuités, décote) : environ 55 % des départs du régime général à 60 ans, âge moyen de départ ≈ 61 ans ; ici à taux plein, sans décote : plus de départs à 60 ans (65 % partis à 60 ans)"
    note: "Carrières longues avant 60 ans gardées comme dans le profil commun (pas de départ avant 60 ans en plus)."
  calendrier:
    valeur: {abrogation: 2028, soixante_ans: 2032}
    unite: sans_unite
    statut: DECISION
    note: "Même calendrier que Mélenchon (comparabilité) : « Une loi rétablira la retraite à 60 ans, à taux plein » (votons-2027.fr, mesure phare) ; abrogation de la réforme de 2023 (swipetonvote.fr, 07/11/2026) : 62 ans pour les départs de 2028, puis six mois de moins par an jusqu'à 60 ans pour les départs de 2032 (mélange linéaire des deux profils par année de départ). Durée de 40 annuités et fin de la décote : mesure à part (duree_decote)."
  anciennete_moyenne:
    valeur: 12
    unite: sans_unite
    statut: HYPOTHESE
    source: "Fête de l'Humanité 2025 (pcf.fr, repris par programme-candidat.fr) : retraites indexées sur le salaire moyen ; DREES : âge moyen des retraités ≈ 75 ans, âge moyen de départ ≈ 63 ans"
    note: "Chaque pension gagne, depuis sa liquidation (ou 2029), la croissance réelle des salaires au lieu des prix ; écart moyen calculé sur 12 ans d'ancienneté. Montée progressive : ≈ +0,7 à +1 % des pensions par an la première décennie."

roussel_chomage:
  hausse_taux:
    valeur: {crise: 0.006, prudent: 0.006, median: 0.0045, optimiste: 0.003}
    unite: taux
    statut: HYPOTHESE
    source: "Même valeur que tondelier_emploi.assurance_chomage (Banque de France, Bulletin n° 264, 2026 : les réformes de 2021 et 2023 ont baissé le chômage structurel de 0,6 point)"
    note: "Hausse du taux de chômage quand ces réformes sont annulées (programme du Nouveau Front populaire, 14/06/2024, signé par le PCF), montée de 2028 à 2030 ; chaque chômeur en plus coûte la valeur d'un emploi au SMIC."

roussel_emplois_aides:
  securite_emploi:
