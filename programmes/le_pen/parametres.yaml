# ---------------------------------------------------------------- effets en tonnes (phase 3, 11/11/2026)
# Même méthode que tondelier_ecologie (moteur/ecologie/emissions.profil, lu par ProgrammeSimple.mesures_ecologie).
# Négatif : émissions évitées. Prudence : dans le prudent, l'effet favorable au climat est le plus faible.
le_pen_ecologie:
  tva_energie:
    valeur: {id: RN-FIS-01, libelle: "TVA à 5,5 % sur l'énergie : carburants, gaz et fioul moins chers", secteur: transports, debut: 2028, plein: 2032, effet_mt: {crise: 6.0, prudent: 5.0, median: 3.5, optimiste: 2.5}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Labandeira et al. (Energy Policy, 2017, méta-analyse) : élasticité-prix de long terme de l'énergie ≈ −0,3 à −0,6 (−0,6 dans ecologie.reponse_prix) ; Citepa, Secten 2026 : voitures particulières ≈ 64 Mt, chauffage au gaz et au fioul des logements ≈ 35 Mt"
    note: "Prix TTC −12 % pour les ménages (la TVA des entreprises est déductible). Voitures : +3,6 à +7 % de consommation, soit +2,3 à +4,5 Mt ; logements : +1,3 à +2,5 Mt. Total ≈ +3,5 à +7 Mt : 6 (crise), 5 (prudent), 3,5 (médian), 2,5 (optimiste). Classé dans les transports (majorité de l'effet)."
  carbone_2017:
    valeur: {id: RN-ENE-03, libelle: "Composante carbone ramenée à son niveau de 2017", secteur: transports, debut: 2028, plein: 2032, effet_mt: {crise: 0.8, prudent: 0.6, median: 0.5, optimiste: 0.4}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même élasticité que tva_energie ; −14 € par tonne ≈ −3,5 c par litre de carburant (≈ −2 %)"
  eolien:
    valeur: {id: RN-ENE-02, libelle: "Moratoire sur l'éolien terrestre et démontage progressif des parcs", secteur: energie, debut: 2029, plein: 2037, suit_intensite: false, effet_mt: {crise: 6.0, prudent: 4.0, median: 2.0, optimiste: 1.0}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "RTE, Bilan prévisionnel 2023-2035 : éolien terrestre ≈ 50 TWh en 2025, ≈ 90 TWh visés en 2035 par la PPE3 ; nouveaux réacteurs pas avant la fin des années 2030"
    note: "Production perdue (parcs démontés et non construits) : ≈ 60 à 90 TWh vers 2035, compensée surtout par moins d'exportations (émissions évitées à l'étranger, non comptées) et par du gaz en France en pointe : 1 à 6 Mt vers 2037, jusqu'à l'arrivée des réacteurs neufs (non modélisée : effet gardé constant). Plus fort que la seule fin du soutien aux renouvelables de Retailleau et Lisnard (0,3 à 2,5 Mt)."
  renovation:
    valeur: {id: RN-LOG-01, libelle: "« 100 % Rénov' »", secteur: batiments, debut: 2028, plein: 2050, effet_mt: {crise: -1.05, prudent: -1.26, median: -2.24, optimiste: -3.85}}
    unite: mt_co2e
    statut: HYPOTHESE
    source: "Même méthode que glucksmann_ecologie.maprimerenov (Anah 2024, ≈ 25 000 € d'aide par rénovation d'ampleur)"
    note: "3,8 Md€ par an ≈ 150 000 rénovations de plus par an, ≈ 3,5 millions en 2050 × 0,3 / 0,36 / 0,64 / 1,1 t (tonne par rénovation × part additionnelle)."

