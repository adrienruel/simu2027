# Programme de Nathalie Arthaud (Lutte ouvrière) — les 37 mesures recensées et leur traitement (chiffrage partiel)
#
# Source de la liste : programmes-2027.fr (fiche du candidat, données du 4 novembre 2026), qui renvoie à la brochure
# « Présidentielle 2027 » (juin 2026), aux discours de meeting et aux éditoriaux signés par la candidate. Sources
# primaires non relues une à une : à vérifier avant publication. Traitement : voir programmes/bertrand/mesures.yaml.
#
# Avertissement : Lutte ouvrière présente un « programme révolutionnaire à imposer par les luttes, pas un programme
# électoral ». Les mesures centrales (expropriation, interdiction des licenciements, répartition du travail sans perte
# de salaire, planification) transforment l'économie entière : un modèle budgétaire à économie inchangée ne les
# représente pas. Le chiffrage ne couvre que les mesures qui ont une ligne budgétaire.

programme:
  candidat: Nathalie Arthaud
  parti: Lutte ouvrière
  document: "Brochure « Nathalie Arthaud – Présidentielle 2027 » (juin 2026, 32 p.), meeting du 26 septembre 2026, éditoriaux"
