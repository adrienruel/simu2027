    source: "Insee, consommation des ménages par fonction, 2025 : 1 545,9 Md€ (dont boissons alcoolisées, tabac et stupéfiants 49,9 Md€)"
    note: "Les bases par produit sont les parts du panier médian de tva_produits.csv : tabac 28 Md€, alcool 23 Md€ (51 Md€ contre 46 Md€ hors stupéfiants dans la comptabilité nationale : base un peu haute, à recaler sur le détail de l'Insee), produits sucrés et ultra-transformés 40 Md€."
