# --- Retraités en régime de croisière -----------------------------------------
retraites:
  socle_plein:
    valeur: 1200
    v235: 1300
    unite: eur_mois
    annee_euros: 2026
    statut: DECISION
    note: "DÉCISION d'Adrien du 29/10/2026 : 1 200 € (avant : 1 300 €)."
  attente_age_legal_67:
    valeur: {active: true, part_annuites_completes: 0.0}
    v235: {active: false, part_annuites_completes: 0.9}
    unite: sans_unite
    statut: DECISION
    source: "Encadrement de la part : DREES, Les retraités et les retraites 2025, fiche 16 : 7 % d'une génération partent à 67 ans (âge du taux plein automatique, faute de trimestres)"
    note: "DÉCISION d'Adrien du 29/10/2026 (révisée le même jour) : le socle n'est versé qu'à 67 ans ; entre l'âge légal (65 ans) et 67 ans, une personne sans emploi touche le RUI ; si elle a ses annuités, elle peut en plus tirer la rente de son épargne (son capital, sans coût pour l'État ; prudent : le RUI n'est pas réduit par cette rente). Part avec socle anticipé : 0. Première version (remplacée) : socle si annuités, RUI sinon. S'applique au nouveau système (générations de 22 à 49 ans en 2029, de 65 à 66 ans) et aux personnes de l'ancien système dont le départ est reporté de 64 à 65 ans. Part avec les annuités complètes : 90 % (hypothèse ; plus elle est haute, plus le coût est élevé, le socle étant au-dessus du RUI). Point relevé par la relecture du 29/10/2026 (le modèle ne versait rien entre l'âge légal et 67 ans)."
  rente_annulant_socle:
    valeur: 2500
    unite: eur_mois
    annee_euros: 2026
    statut: DECISION
    note: Le socle décroît linéairement avec le revenu du capital, nul à 2 500 €/mois.
  nombre_retraites:
