    unite: sans_unite
    statut: DECISION
    note: "Chiffrage demandé par Adrien le 29/10/2026 : les points d'épargne pris par la règle sont rendus à la génération qui les a versés, avec le rendement du fonds, sur son compte au départ à 67 ans (version « pas avant 2055 » écartée : elle crée un versement de 316 Md€ en 2055, 10 % de déficit cette année-là). Répartis entre générations selon l'emploi par âge l'année du prélèvement. Compté en dépense l'année du versement (comme le remboursement de 35 %) ; le capital ainsi rendu rejoint le fonds et le socle n'augmente plus pour ces générations. Les droits des générations qui partent après 2073 restent dus : affichés à part."
  ordre: {valeur: [contribution, rui], unite: sans_unite, statut: DECISION, note: "Ordre des instruments de la règle après l'étalement de la déduction : contribution (points d'épargne obligatoire versés à l'État, jusqu'au maximum) puis baisse du RUI (jusqu'au plancher). Ordre de la v221."}
  cible: {valeur: 0.03, v235: median, unite: taux, statut: DECISION, note: "Déficit visé par la règle : 3 % du PIB (DÉCISION d'Adrien du 29/10/2026, règle automatique au lieu d'une clause temporaire calée sur le médian ; la relecture relevait que viser le médian faisait publier le médian). v235 : déficit du scénario médian."}
  contribution_en_emprunt: {valeur: true, unite: sans_unite, statut: DECISION, note: "DÉCISION d'Adrien du 12/11/2026 (seconde relecture neutre, point 3 : « le déficit au sens de Maastricht », règle inchangée) : la contribution prise par la règle est rendue à 67 ans avec le rendement du fonds ; c'est un emprunt aux ménages, pas une recette. Elle n'entre plus dans les recettes : le déficit publié la compte, et la dette au sens de Maastricht comprend ce que l'État doit aux ménages. Le remboursement à 67 ans est une opération financière, hors solde ; les intérêts sont ceux de la dette du noyau. La règle elle-même ne change pas (mêmes leviers, même ordre, mêmes montants pris) : elle vise toujours 3 % comme si la contribution était une recette, d'où un déficit publié au-dessus de 3 %. false : ancienne convention (contribution en recette, créances publiées à part)."}
  points_contribution_max: {valeur: 5, unite: sans_unite, statut: DECISION, note: "Sur les 10 points d'épargne obligatoire."}
  plancher_rui: {valeur: 651.69, unite: eur_mois, annee_euros: 2026, statut: DECISION, note: "RSA d'une personne seule en 2026."}

