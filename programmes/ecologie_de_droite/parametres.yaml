# --- Surplus de santé financé par les produits nocifs (décision du 05/11/2026) --------------
sante_produits_nocifs:
  active:
    valeur: true
    v235: false
    unite: sans_unite
    statut: DECISION
    note: "DÉCISION d'Adrien du 05/11/2026 : le surplus de dépenses de santé au-delà d'une part constante du PIB est financé par une accise sur les produits nocifs (tabac, alcool, produits sucrés et ultra-transformés), qui réduit la consommation et donc, avec délai, les dépenses de santé. Remplace le garde-fou de la v235 (dépassement de la pente d'engagement, sans effet sur la consommation). Ce qui dépasse les plafonds de prix reste en dépense et est publié (moteur/sante.accise_produits_nocifs)."
