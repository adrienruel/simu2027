      optimiste: {tabac: -0.6, alcool: -0.5, sucres: -0.8}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : tabac, élasticité-prix de la consommation −0,25 à −0,5 dans les pays riches (CIRC, Handbook of Cancer Prevention vol. 14, 2011), à laquelle s'ajoutent les achats hors du réseau des buralistes (environ un tiers des cigarettes consommées en France, études d'emballages vides) ; alcool −0,51 (méta-analyse de Wagenaar, Salois et Komro, Addiction, 2009 ; vin −0,69, spiritueux −0,80) ; boissons sucrées −0,79 (Andreyeva, Long et Brownell, AJPH, 2010)"
    note: "Baisse du volume TAXÉ (consommation + fuite hors réseau) pour une hausse de prix. Prudent : fuite forte, donc assiette qui fond vite. Supérieures à −1 : la recette monte avec la hausse jusqu'au plafond."
