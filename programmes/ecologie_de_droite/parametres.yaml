    # part de la masse salariale publique ; charges patronales actuelles (% du brut, null = calcul État)
    valeur:
      etat_civils: {part: 0.43, charges_actuelles: null}
      etat_militaires: {part: 0.05, charges_actuelles: null}
      territoriale: {part: 0.29, charges_actuelles: 0.52}
      hospitaliere: {part: 0.23, charges_actuelles: 0.52}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement des parts : Insee, dépenses par administration publique 2025, rémunération des salariés (D1) : État 153,8 Md€, administrations locales 97,0 Md€, sécurité sociale 88,2 Md€ (hôpitaux publics compris), soit environ 45 % / 29 % / 26 %. Charges : récapitulatif des cotisations CNRACL au 1er juin 2026 (CDG 33) : 60,7 % du traitement indiciaire hors versement mobilité, dont CNRACL 37,65 %"
    note: "Militaires = même baisse que les civils, faute de détail. Les parts sont cohérentes avec l'Insee. Les charges de 52 % s'appliquent au brut, primes comprises (le traitement indiciaire porte 60,7 %, les primes surtout la RAFP) et mêlent titulaires et contractuels : ordre de grandeur plausible, à recalculer à l'étape OpenFisca."

