    note_v235: "v215 (22 octobre 2026) — SOURCÉ. Usure du capital des sociétés non financières : ≈ 10 % par an (9,3 % en 1999, 10 % en 2016, plus d'immatériel ; Banque de France, Bloc-notes Éco n° 64, Sicsic, 2018) ; consommation de capital fixe ≈ 20 % de la valeur ajoutée (même auteur, billet n° 59), soit ≈ 309 Md€ pour 1 545 Md€ de valeur ajoutée (Insee 2025). Rendement net : (excédent brut 497,5 − usure 309) / (actifs fixes 3 084 + terrains bâtis 1 596 Md€, Insee) ≈ 4,0 % réel, terrains rémunérés au même taux (≈ 65 Md€ de rente, au lieu de 48 supposés). Actifs régulés ≈ 3,2 % réel (CRE, TURPE 7). Mélange du fonds : ≈ 3,6 %, ≈ 3,2 % après rendements décroissants. Repère : taux d'actualisation public de 3,2 % pour un bêta de 1 (avis Guesnerie, 2021). Prudent 3,2 %, médian 4,2 % (effets d'entraînement des réseaux et de l'énergie, hypothèse), optimiste 5,2 %. Avant : 5 / 6 / 7 %, avec une usure supposée de 6,4 %. | Avant : v213 (22 octobre 2026) — RECOUPÉ À PARTIR DE SOURCES. Rendement des entreprises : excédent brut d’exploitation des sociétés non financières de 497,5 Md€ (Insee, 2025), moins ≈ 48 Md€ de rente des terrains bâtis (1 596 Md€ × ≈ 3 %, HYPOTHÈSE), pour 3 084 Md€ d’actifs fixes produits (Insee, patrimoine national 2024) : ≈ 14,6 % brut ; usure ≈ 6,4 % par an (bâtiments 2,5 %, machines 12 %, autres actifs 20 %, HYPOTHÈSES, pondérées par les stocks de l’Insee), soit ≈ 8,2 % net. Actifs régulés : rémunération de RTE de 5 % nominal avant impôt (CRE, TURPE 7), ≈ 3,2 % réel. Le capital nouveau du fonds est pour moitié régulé ou à rendement faible (nucléaire, réseaux, renouvelables, logement : feuille Fonds, lignes 32 à 38), pour moitié industrie et IA : ≈ 0,5 × 3,2 % + 0,5 × 8,2 % ≈ 5,7 %, ≈ 5,1 % après les rendements décroissants (capital des entreprises en hausse d’environ un tiers en 2050). Prudent 5 %, médian 6 % (effets d’entraînement des réseaux et de l’énergie), optimiste 7 % : inchangés, désormais recoupés."
