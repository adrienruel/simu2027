    note: "Militaires = même baisse que les civils, faute de détail. Les parts sont cohérentes avec l'Insee. Les charges de 52 % s'appliquent au brut, primes comprises (le traitement indiciaire porte 60,7 %, les primes surtout la RAFP) et mêlent titulaires et contractuels : ordre de grandeur plausible, à recalculer à l'étape OpenFisca."

