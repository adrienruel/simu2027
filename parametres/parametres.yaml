    valeur: 7.184
    v235: 2.05
    unite: sans_unite
    statut: SOURCE
    source: "Ajusté sur Insee Première n° 1815 (septembre 2020), consommation et revenu disponible par unité de consommation, par quintile, 2017 : régression log-log de la consommation TTC sur le revenu, convertie en hors taxe avec le taux moyen de 13 %"
    note: "Consommation HT = coefficient × (revenu disponible HT)^exposant. DÉCISION d'Adrien du 29/10/2026 : recalée sur l'Insee maintenant, à recaler sur des ménages à l'étape OpenFisca. Épargne implicite : −2 % à 13 000 €, 12 % à 26 000 €, 25 % à 56 000 € (Insee : 2,7 % ; 9,7 % ; 28,4 %). v235 : 2,05 × revenu^0,92 (3 % à 17 %)."
