  taux:
    valeur: [0.0, 0.179, 0.57, 0.66]
    unite: taux
    statut: DECISION
    note: DÉCISION du 28 octobre 2026 (v232). 66 % est le plafond de tous les taux marginaux.
  plafond_taux_marginal:
    valeur: 0.66
    unite: taux
    statut: DECISION
    note: DÉCISIONS du 17 octobre 2026.
  demi_part_enfant_plafond:
    valeur: 1000
    unite: eur_an
    annee_euros: 2026
    statut: DECISION
    note: Mécanique du quotient à préciser avant codage (couples imposés ensemble).

