# Fichier de paramètres unique du programme « Écologie de droite ».
#
# Chaque paramètre porte :
#   valeur      : un nombre, ou un dictionnaire par scénario (crise, prudent, median, optimiste)
#   unite       : taux, eur_an, eur_mois, md_eur, sans_unite, annee…
#   annee_euros : année des euros pour tout montant (2024, 2025 ou 2026) ; absent pour un taux
#   statut      : SOURCE, HYPOTHESE ou DECISION
#   source      : référence (obligatoire si statut = SOURCE)
#   note        : facultatif
#
# Règle : une valeur sans source est prise prudente. Le scénario prudent est publié.
# Valeurs reprises de l'état du programme (v232) et de l'audit v235 ; elles seront
# recontrôlées contre le registre des paramètres de la v235 à l'étape 2.

scenarios: [crise, prudent, median, optimiste]

