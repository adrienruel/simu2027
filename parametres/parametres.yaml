  ia_productivite:
    source: "Encadrement : Acemoglu (2024) : 0,07 point par an ; Aghion et Bunel (2024) : 0,27 à 0,4 (fourchette 0,07 à 1,24)"
    valeur: {crise: 0.0007, prudent: 0.0007, median: 0.0027, optimiste: 0.00475}
    v235: {crise: 0.001, prudent: 0.00185, median: 0.0027, optimiste: 0.00475}
    note: "DÉCISION d'Adrien du 29/10/2026 : crise et prudent prennent la source la plus prudente, Acemoglu (2024), 0,07 point par an pendant dix ans ; médian 0,27 (Aghion et Bunel, bas de leur fourchette) ; optimiste 0,475. v235 : 0,10 en crise et 0,185 en prudent (milieu crise-médian)."
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "SOURCÉ : Acemoglu (2024) ≈ 0,07 point par an sur dix ans (prudent) ; Aghion et Bunel (2024) : 0,27 à 0,4 point selon les gains mesurés tâche par tâche (médian : 0,27), médiane de leur fourchette 0,68 point (optimiste), fourchette 0,07 à 1,24. Repères de la Commission de l’IA (2024) : électricité en Europe +1,3 point pendant dix ans, numérique aux États-Unis +0,8 point de 1995 à 2006. Le COR (0,7 %) ne compte pas cet effet à part. | v209 (22 octobre 2026), DEMANDE d’Adrien : compter la hausse de la demande d’IA due à la baisse des coûts. SOURCÉ : le coût d’une requête de niveau GPT-3.5 a été divisé par 280 entre novembre 2022 et octobre 2024 (Stanford, AI Index 2025) ; l’usage de l’IA par les entreprises françaises a triplé de 2023 à 2025 (Insee). L’estimation basse d’Acemoglu (0,07 point) suppose que seuls 23 % des tâches exposées sont rentables à automatiser au coût actuel (Svanberg et al., MIT, 2024). Ces auteurs montrent que si le coût des systèmes baisse de 50 % par an, la moitié des tâches devient rentable en trois ans ; s’il baisse de 10 % par an, moins de la moitié en 2042. Crise : baisse de 10 % par an, part rentable portée à ≈ un tiers en moyenne sur la décennie, soit 0,07 × 33 / 23 ≈ 0,10 point. Prudent : milieu entre crise et médian, 0,185 point (avant : 0,17). Médian et optimiste inchangés : Aghion et Bunel comptent déjà une diffusion large."
  adoption_ia:
    source: "Encadrement : Eurostat (décembre 2025) : 18,2 % des entreprises françaises utilisent l'IA, contre 20 % dans l'Union"
    valeur: {crise: 0, prudent: 0.05, median: 0.1, optimiste: 0.431718061674009}
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "v208 (22 octobre 2026), DÉCISION d’Adrien : le programme finance l’IA souveraine (Mistral et autres) et le cloud souverain, sans cap ; l’IA est prise dans sa globalité, cloud compris. CANAL RETENU : le rattrapage de l’adoption. SOURCÉ : 18,2 % des entreprises françaises de 10 salariés ou plus utilisent l’IA en 2025, contre 20 % dans l’Union, 26 % en Allemagne, 33 à 42 % aux Pays-Bas et dans les pays nordiques (Eurostat, décembre 2025 ; Insee Première, 2025). L’effet de la tendance (ligne 256, Aghion et Bunel pour la France) est supposé proportionnel au taux d’adoption. Crise : aucun rattrapage. Médian : la France rejoint la moyenne de l’Union (20 / 18,2 − 1 ≈ +10 %). Optimiste (« tout le monde joue le jeu ») : la France rejoint l’Allemagne (26 / 18,2 − 1 ≈ +43 %). Prudent : milieu entre crise et médian (+5 %, règle du 17 octobre). Leviers du programme : l’État client de l’IA française (feuille IA administration, 25 % des salaires économisés versés à des entreprises françaises), capital du fonds pour le cloud et l’IA souverains (feuille Fonds, ligne 51), électricité nucléaire peu taxée (5 %). Le frein principal reste la demande : 71 % des entreprises qui n’utilisent pas l’IA n’y voient pas d’utilité, 54 % manquent d’expertise (Insee). NON COMPTÉ À PART, pour éviter un double compte : la valeur ajoutée du cloud et de l’IA souverains produits en France, déjà comptée comme rendement du capital du fonds (ligne 98). Avant : 5 % / 10 % / 25 %, sans source."
