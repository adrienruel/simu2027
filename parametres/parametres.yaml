# Fichier de paramètres unique du programme « Écologie de droite ».
#
# Chaque paramètre porte :
#   valeur      : un nombre, ou un dictionnaire par scénario (crise, prudent, median, optimiste)
#   unite       : taux, eur_an, eur_mois, md_eur, sans_unite, annee…
#   annee_euros : année des euros pour tout montant (2024, 2025 ou 2026) ; absent pour un taux
#   statut      : SOURCE, HYPOTHESE ou DECISION
#   source      : référence (obligatoire si statut = SOURCE)
#   note        : facultatif
#
# Règle : une valeur sans source est prise prudente. Le scénario prudent est publié.
# Valeurs reprises de l'état du programme (v232) et de l'audit v235 ; elles seront
# recontrôlées contre le registre des paramètres de la v235 à l'étape 2.

scenarios: [crise, prudent, median, optimiste]

# --- Unités -----------------------------------------------------------------
unites:
  annee_modele:
    valeur: 2026
    unite: annee
    statut: DECISION
    note: Modèle en euros constants de 2026 ; l'économie de 2026 est placée en 2029.
  annee_bascule:
    valeur: 2029
    unite: annee
    statut: DECISION
  pib_valeur_2025:
    valeur: 0.019
    unite: taux
    statut: SOURCE
    source: Insee Première n° 2105 (croissance du PIB en valeur 2025)
    note: Sert au passage des montants de 2024 en euros de 2026 (Total!B124), recettes calées sur 2024 seulement.
  pib_volume_2026:
    valeur: 0.005
    unite: taux
    statut: SOURCE
    source: Prévision du gouvernement, septembre 2026
  deflateur_2026:
    valeur: 0.015
    unite: taux
    statut: HYPOTHESE
    note: Prudente, sous l'inflation prévue de 2,1 %.
  salaire_prive_2025:
    valeur: 0.020
    unite: taux
    statut: SOURCE
    source: Insee, Note de conjoncture juin 2026 (salaire moyen par tête)
  salaire_prive_2026:
    valeur: 0.022
    unite: taux
    statut: SOURCE
    source: Insee, Note de conjoncture juin 2026 (salaire moyen par tête)
  salaire_public_2024:
    # hausse du salaire net moyen en 2024 par versant, pondérée par les effectifs (millions)
    valeur:
      etat: {hausse: 0.047, effectif: 2.54}
      territoriale: {hausse: 0.033, effectif: 1.94}
      hospitaliere: {hausse: 0.033, effectif: 1.21}
    unite: sans_unite
    statut: SOURCE
    source: Insee Première n° 2100 (État) et n° 2101 (territoriale) ; hospitalière = territoriale (HYPOTHÈSE)
  salaire_public_2025_2026:
    valeur: 0.0
    unite: taux
    statut: HYPOTHESE
    note: Grille stable (DGAFP) ; glissement vieillesse-technicité non compté. Sens prudent.

# --- Impôt unique sur le revenu (sur le coût employeur annuel) ----------------
impot_unique:
  seuils:
    valeur: [12500, 24000, 32000]
    unite: eur_an
    annee_euros: 2026
    statut: DECISION
    note: DÉCISION du 23 octobre 2026 (seuil de 32 000 €, v227).
  taux:
    valeur: [0.0, 0.179, 0.57, 0.66]
    unite: taux
    statut: DECISION
    note: DÉCISION du 28 octobre 2026 (v232). 66 % est le plafond de tous les taux marginaux.
  plafond_taux_marginal:
    valeur: 0.66
    unite: taux
    statut: DECISION
    note: DÉCISIONS du 17 octobre 2026.
  demi_part_enfant_plafond:
    valeur: 1000
    unite: eur_an
    annee_euros: 2026
    statut: DECISION
    note: Mécanique du quotient à préciser avant codage (couples imposés ensemble).

# --- Repères de profils -------------------------------------------------------
profils:
  cout_smic_annuel:
    valeur: 23750
    unite: eur_an
    annee_euros: 2026
    statut: SOURCE
    source: État du programme v232 (coût employeur du SMIC, profil type)
    note: L'audit v235 cite 1 930 €/mois (juin 2026) ; écart avec 1 979 €/mois à éclaircir à l'étape 1.
  cout_median_annuel:
    valeur: 42500
    unite: eur_an
    annee_euros: 2026
    statut: SOURCE
    source: État du programme v232 (salarié médian, profil type)

# --- Trajectoire --------------------------------------------------------------
trajectoire:
  dette_depart:
    valeur: 3810.31529768761
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: Classeur v235, Trajectoire (dette fin 2028, feuille Calendrier budgétaire)
    note: Valeur reprise telle quelle ; sera calculée par le module Calendrier (déficits 2027-2028).
  inflation:
    valeur: 0.018
    unite: taux
    statut: HYPOTHESE
    note: Sert au passage au déficit de Maastricht (intérêts réels + inflation × dette de l'année précédente).

# --- RUI ------------------------------------------------------------------------
rui:
  montant:
    valeur: 800
    unite: eur_mois
    annee_euros: 2026
    statut: DECISION
    note: DÉCISION du 22 octobre 2026 (v220). Revalorisé de la croissance, jamais de l'inflation.
  plancher_rsa_2026:
    valeur: 651.69
    unite: eur_mois
    annee_euros: 2026
    statut: SOURCE
    source: Montant du RSA 2026

# --- Fonction publique : alignement du coût employeur sur le privé --------------
alignement:
  charges_patronales_prive:
    valeur: 0.40
    unite: taux
    statut: HYPOTHESE
    note: Moyenne pour des salaires de 1,5 à 3 SMIC, après allègements (feuille Alignement public-privé, B4).
  masse_salariale_etat_2026:
    valeur: 161.6
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: Budget de l'État 2026, masse salariale CAS Pensions compris (feuille Budget État 2026, B4)
  remunerations_activite_etat_2026:
    valeur: 92.8
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: Budget de l'État 2026, rémunérations d'activité ≈ brut (feuille Budget État 2026, B5)
  versants:
    # part de la masse salariale publique ; charges patronales actuelles (% du brut, null = calcul État)
    valeur:
      etat_civils: {part: 0.43, charges_actuelles: null}
      etat_militaires: {part: 0.05, charges_actuelles: null}
      territoriale: {part: 0.29, charges_actuelles: 0.52}
      hospitaliere: {part: 0.23, charges_actuelles: 0.52}
    unite: sans_unite
    statut: HYPOTHESE
    note: Militaires = même baisse que les civils, faute de détail. CNRACL ≈ 37,65 % du traitement en 2026.
