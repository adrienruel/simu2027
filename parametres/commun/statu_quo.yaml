# Scénario sans réforme (statu quo projeté), commun à tous les programmes (moteur/statu_quo.py, 4 novembre 2026).
#
# Le système actuel à législation constante, projeté de 2029 à 2073 avec la même démographie (Insee 2026), la même
# macroéconomie (productivité, IA, inflation, taux) et la même santé que les programmes. Chaque programme se lit
# comme un écart à ce scénario. Aucun paramètre d'un programme n'est lu par le module.
#
# Point de départ : la législation du PLF 2027 (déficit de 5 % en 2027, cohérent avec calendrier.deficit_tendanciel_2027_2028),
# en parts du PIB, appliquée à l'économie de 2026 placée en 2029 (convention du modèle, unites.annee_modele).

statu_quo:
  # --- Point de départ (comptes de 2027, PLF 2027) ---------------------------------------------------------
  depense_publique_base:
    valeur: 0.569
    unite: taux
    statut: SOURCE
    source: "PLF 2027 : dépense publique hors crédits d'impôt 56,9 % du PIB en 2027 (57,1 % en 2026) ; HCFP, avis n° 2026-5 sur les PLF et PLFSS pour 2027 (octobre 2026)"
  deficit_base:
    valeur: 0.050
    unite: taux
    statut: SOURCE
    source: "PLF 2027 : déficit public de 5,0 % du PIB en 2027 (5,4 % en 2026) ; HCFP, avis n° 2026-5"
    note: "Recettes publiques de départ = dépense − déficit = 51,9 % du PIB (prélèvements obligatoires 44,2 % ; le reste : ventes, revenus de la propriété, transferts). Hypothèse : les mesures du PLF 2027 sont votées et maintenues, comme dans calendrier.deficit_tendanciel_2027_2028. DÉCISION d'Adrien du 04/11/2026 : point de départ provisoire, à actualiser quand la loi de finances 2027 sera votée."
  charge_interets_base:
    valeur: 0.029
    unite: taux
    statut: SOURCE
    source: "HCFP, avis n° 2026-5 : charge d'intérêts des administrations publiques ≈ 91 Md€ en 2027 (+12 Md€) ; PIB en valeur 2027 ≈ 3 135 Md€ (croissance en valeur de 2,7 %)"
    note: "Sert seulement à passer de la dépense totale à la dépense primaire de départ (56,9 − 2,9 = 54,0 % du PIB). Les intérêts de 2029 et après sont recalculés (taux apparent, taux de marché, dette)."

  # --- Retraites (système actuel, toutes générations) -----------------------------------------------------
  retraites_part_pib_base:
    valeur: 0.141
    unite: taux
    statut: SOURCE
    source: "COR, rapport annuel de juin 2026 : dépenses de retraite 422 Md€ en 2025, soit 14,1 % du PIB ; 14,1 % en 2030, 14,2 % en 2045, 15,3 % en 2070 (productivité 0,7 % par an ; 16,1 % à 0,4 % ; 14,5 % à 1,0 %)"
  retraites_decalage_carriere:
    valeur: 15
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : salaires portés au compte du régime général (25 meilleures années) revalorisés sur les prix ; points Agirc-Arrco acquis sur toute la carrière"
    note: "Années de retard entre les salaires d'une carrière et le départ : la pension liquidée suit le salaire moyen de quinze ans plus tôt (centre de gravité des droits, revalorisés sur les prix). C'est ce retard qui fait qu'une productivité plus forte baisse le poids des retraites (mécanisme du COR)."
  retraites_erosion_relative:
    valeur: 0.0046
    unite: taux
    statut: HYPOTHESE
    source: "Calée sur le COR, rapport annuel de juin 2026 (scénario de référence, productivité 0,7 % : 15,3 % du PIB en 2070) ; contrôles : 2045 et les variantes de productivité 0,4 % et 1,0 % (tests/test_statu_quo.py) : 2045 14,15 % (COR 14,2 %) ; productivité 0,4 % : 15,96 % (COR 16,1 %) ; 1,0 % : 14,72 % (COR 14,5 %)"
    note: "Baisse annuelle de la pension liquidée rapportée au salaire décalé, à règles inchangées (rendement des points Agirc-Arrco dont la valeur de service suit les prix, décote et durée requise de la réforme de 2023, carrières plus heurtées). Seul paramètre calé : il porte aussi l'écart d'emploi avec le COR (le COR fait monter l'emploi des seniors et ramène le chômage à 7 % ; ici les taux d'emploi par âge restent ceux de 2025, donc le PIB est plus bas et la part des retraites un peu plus haute à pension égale)."
  # --- Recettes impôt par impôt ---------------------------------------------------------------------------
  recettes_non_fiscales_part_pib:
    valeur: 0.063
    unite: taux
    statut: SOURCE
    source: "Insee, Le compte des administrations publiques en 2025 (Insee Première n° 2106) : recettes de production 129,2 Md€, revenus de la propriété 23,0, autres transferts 35,5, soit 187,7 Md€ pour un PIB d'environ 2 990 Md€ (6,3 %)"
    note: "Recettes hors impôts et cotisations (ventes, tarifs, revenus de la propriété, transferts). Suivent le PIB. Le reste des recettes de départ (51,9 − 6,3 = 45,6 % du PIB) est réparti entre impôts selon statu_quo.structure_impots."
  structure_impots:
    valeur:
      salaires_prive: 506.24
      salaires_public: 202.88
      independants: 38.0
      retraites: 50.0
      tva: 213.57
      accises_et_taxes_sur_produits: 103.83
      impot_sur_les_societes: 70.3
      impots_de_production: 75.31
      capital_dividendes_ifi: 38.13
      successions: 20.82
      droits_de_mutation: 14.74
      taxes_locales_et_affectees: 16.70
    unite: sans_unite
    statut: SOURCE
    source: "Classeur v235, feuille Total, colonne « Ancien » (Md€ de 2024), reconstitution du système actuel impôt par impôt ; feuille « Contrôle système actuel » : 1 318,9 Md€ contre 1 322,5 Md€ d'impôts et cotisations des administrations à l'Insee pour 2024 (−0,27 %)"
    note: "Sert de clé de répartition (parts), le niveau étant celui du PLF 2027. Salaires du privé et du public, indépendants : cotisations, CSG, CRDS et impôt sur le revenu ; retraités : CSG, CASA et impôt sur le revenu des pensions (12 % des pensions) ; la taxe foncière des ménages est comptée avec leurs revenus. Moteur de chaque impôt : masse salariale (salaires, indépendants), pensions (retraités), PIB (consommation, bénéfices, patrimoine), PIB × décès (successions)."

  baremes_retraites:
    valeur: prix
    unite: sans_unite
    statut: DECISION
    source: "Législation : seuils de revenu fiscal de référence des taux de CSG sur les pensions revalorisés sur l'inflation (code de la sécurité sociale, art. L136-8) ; barème de l'impôt sur le revenu revalorisé chaque année par la loi de finances, d'ordinaire sur l'inflation"
    note: "prix : seuils et barèmes revalorisés sur les prix (législation constante) ; le taux moyen sur les pensions reste vers 12 % (prudent : 1,7 % du PIB en 2029, 1,9 % en 2073). salaires : barèmes qui suivent la croissance, comme pour les programmes ; le taux moyen baisse quand les pensions baissent par rapport aux salaires (7,5 % en 2073, 0,7 point de PIB de recettes en moins). À trancher. Les prélèvements sur les salaires suivent la masse salariale (élasticité 1) dans les deux cas. DÉCISION d'Adrien du 04/11/2026 : la loi actuelle (prix)."

  retraites_ratio_conjoint:
    valeur: 0.62
    unite: taux
    statut: SOURCE
    source: "DREES, Les retraités et les retraites (édition 2025) : la pension de droit direct des femmes est inférieure d'environ 38 % à celle des hommes"
    note: "Pension du conjoint rapportée à celle de la personne, pour les couples de retraités du tableau OpenFisca (outils/openfisca_retraites.py, constante RATIO_CONJOINT à garder égale). Part des retraités en couple : anciennes_pensions.couples."

  versants_fonction_publique:
    valeur: {etat_civils: 0.38, etat_militaires: 0.07, territoriale: 0.29, hospitaliere: 0.26}
    unite: sans_unite
    statut: SOURCE
    source: "Insee, rémunération des salariés des administrations publiques 2025 : État 45 %, administrations locales 29 %, sécurité sociale (hôpitaux) 26 % ; part des militaires dans l'État : ≈ 15 % des effectifs (DGAFP), hypothèse"
    note: "Poids des tables OpenFisca de chaque versant pour le contrôle des prélèvements sur les agents publics (statu_quo.prelevements_activite)."

  cvae_rendement_2027:
    valeur: 3.0
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : CVAE ≈ 8 Md€ par an au taux de 0,75 % (Fipeco, « La suppression de la cotisation sur la valeur ajoutée », 29/10/2025) ; taux maximal 0,28 % en 2026 et 2027 (loi de finances pour 2025, art. 62, inchangé par la loi de finances pour 2026)"
    note: "Rendement au taux de 2027, proportionnel au taux : 8 × 0,28 / 0,75."
  cvae_taux_legaux:
    valeur: {"2027": 0.0028, "2028": 0.0019, "2029": 0.0009, "2030": 0.0}
    unite: sans_unite
    statut: SOURCE
    source: "Loi de finances pour 2025, art. 62 (BOI-CVAE-LIQ-10-20251119) : taux maximal 0,28 % en 2026 et 2027, 0,19 % en 2028, 0,09 % en 2029, suppression en 2030 ; trajectoire maintenue par la loi de finances pour 2026"
    note: "Législation en vigueur appliquée par le statu quo : la recette de CVAE du point de départ (2027) baisse avec le taux (statu_quo.recettes_par_impot). La contribution exceptionnelle sur les bénéfices des grandes entreprises (exercices 2025 et 2026, loi de finances pour 2026, art. 12 ; ≈ 6 Md€ attendus pour 2026) est versée surtout en 2026 (acompte de 98 %) : elle pèse peu dans les comptes de 2027 et n'existe plus après."

  recettes_production_hors_apul_part_pib:
    valeur: 0.0267
    unite: taux
    statut: SOURCE
    source: "Insee, Le compte des administrations publiques en 2025 (Insee Première n° 2106) : recettes de production des administrations centrales 53,0 Md€ et de sécurité sociale 26,7 Md€ (ventes, tarifs, hôpitaux), soit 79,7 Md€ pour un PIB d'environ 2 990 Md€"
    note: "Ventes et tarifs de l'État, des opérateurs et des hôpitaux, comptés en brut par le statu quo (recettes non fiscales et dépenses) ; un programme qui chiffre ses dépenses nettes de ces ventes les remet des deux côtés pour être au même périmètre (programmes/<nom>/programme.py)."

  apul_depenses_2026:
    valeur: 336.5
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Insee, comptes des administrations publiques 2025 : dépenses des administrations publiques locales 335,5 Md€ (recettes 319,9, besoin de financement 15,6) ; +0,3 % en 2026 (classeur v235, Contrôle système actuel)"
    note: "Sert à ramener un programme qui sort les collectivités de son budget au périmètre de toutes les administrations (programmes/<nom>/programme.py)."

  # --- Prestations : moteur de chaque bloc ------------------------------------------------------------------
  chomage_indemnisation:
    valeur: 46.6
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Unédic, prévisions financières d'octobre 2026 : dépenses totales 46,6 Md€ en 2026 (allocations et contribution à France Travail), 2,6 millions d'allocataires indemnisés"
    note: "Suit les chômeurs du scénario (population de l'Insee, taux par âge de 2025) et les salaires (allocations proportionnelles au salaire passé)."
  indexation_prestations:
    valeur: salaires
    unite: sans_unite
    statut: DECISION
    note: "DÉCISION d'Adrien du 04/11/2026 : prestations familiales, aides au logement, RSA, prime d'activité (barème compris), AAH et invalidité revalorisées sur les salaires, pour garder leur niveau par rapport aux revenus d'activité (la loi les revalorise sur les prix ; sur 45 ans elles perdraient environ un quart par rapport aux salaires, ce qui n'arriverait pas sans revalorisations exceptionnelles). Variante « prix » : la loi à la lettre (environ 0,9 point de PIB de dépenses en moins en 2060). Les barèmes des prélèvements sur les pensions restent sur les prix (statu_quo.baremes_retraites)."

  prestations_familiales:
    valeur: 34.7
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Rapport d'évaluation des politiques de sécurité sociale, Famille (PLACSS 2024, édition 2025), 1.5.2 : prestations familiales versées par la branche famille 33,0 Md€ en 2023"
    note: "Passées en euros de 2026 par l'inflation 2024 (2,0 %), 2025 (0,9 %, Insee) et 2026 (2,1 %, prévision) : 33,0 × 1,051. Allocations familiales, prestation d'accueil du jeune enfant, complément familial, allocation de rentrée scolaire, allocation de soutien familial. Suivent le nombre d'enfants et les prix (base mensuelle des allocations familiales revalorisée sur l'inflation). Le reste de la politique familiale (action sociale, crèches, congés) est dans le bloc « autres »."
  aides_logement:
    valeur: 16.7
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "SDES, Rapport du compte du logement 2025 : aides personnelles au logement (APL, ALF, ALS) 16,4 Md€ en 2025"
    note: "× 1,021 (inflation 2026). Suivent la population et les prix (barèmes revalorisés sur l'indice de référence des loyers)."
  rsa:
    valeur: 13.5
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : DREES, RSA versé par les départements 11,5 Md€ bruts en 2024 ; RSA recentralisé (État, programme 304) 1,7 Md€ en 2025 (Sénat, rapport sur la mission Solidarité du PLF 2025)"
    note: "11,5 × 1,04 (revalorisations 2025-2026) + 1,7 ≈ 13,5. Suit le nombre de chômeurs du scénario (les entrées au RSA suivent le chômage) et les prix."
  prime_activite:
    valeur: 10.5
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Sénat, rapport sur la mission Solidarité, insertion et égalité des chances du PLF 2025 : prime d'activité 10,3 Md€ en 2025, 4,6 millions de foyers"
    note: "× 1,021 (inflation 2026). Législation constante : barème revalorisé sur les prix, alors que les salaires montent avec la productivité ; la prime suit les personnes en emploi et le barème OpenFisca appliqué aux salaires de chaque année (statu_quo.blocs)."
  aah:
    valeur: 14.6
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "PLF 2026 : 14,6 Md€ pour l'AAH, +1,7 % sur 2025 (Sénat, rapport sur la mission Solidarité, insertion et égalité des chances)"
    note: "Avec les pensions d'invalidité (sante.pensions_invalidite_2024) : suit les adultes et les prix."
  investissement_part_pib:
    valeur: 0.044
    unite: taux
    statut: SOURCE
    source: "Insee, Le compte des administrations publiques en 2025 (Insee Première n° 2106, mai 2026) : investissement 132,2 Md€, 4,4 % du PIB"
    note: "Suit le PIB."
  defense_2026:
    valeur: 57.1
    unite: md_eur
    annee_euros: 2026
    statut: SOURCE
    source: "Classeur v235, Contrôle système actuel : mission Défense 66,7 Md€ en 2026 pensions comprises (loi de programmation) ; contribution au CAS Pensions 9,58 Md€ (missions_etat_2026.csv)"
    note: "Hors pensions (66,7 − 9,6), les pensions des militaires étant dans le bloc retraites. Suit le PIB, comme la contribution à l'UE (budget_etat.contribution_ue_courants)."
  defense_trajectoire:
    valeur: lpm
    unite: sans_unite
    statut: DECISION
    source: "Loi actuelle (règle d'Adrien, 04/11/2026) : actualisation de la loi de programmation militaire 2024-2030 (CMP du 23 juin 2026), 76,3 Md€ hors pensions en 2030 (budget_etat.lpm_2030_courants), soit 2,5 % du PIB"
    note: "lpm : la défense atteint dès 2029 le niveau de 2030 de la loi de programmation (en euros de 2026, comme le programme), puis suit le PIB ; la hausse sur 2026 s'ajoute à la dépense de départ (comme la dérive de la santé). 2026 : reste au niveau de 2026."
  aides_logement_etat:
    valeur: 15.0
    unite: md_eur
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Encadrement : les aides personnelles au logement (16,7 Md€) sont financées par le Fonds national d'aide au logement, alimenté surtout par la mission Cohésion des territoires depuis la fin du financement par la branche famille (2023)"
    note: "Part de la mission Cohésion des territoires déjà comptée dans le bloc logement, retirée des missions de l'État."
  investissement_parts:
    valeur: {etat: 0.20, collectivites: 0.55}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : Insee, comptes des administrations publiques : les administrations locales font un peu plus de la moitié de l'investissement public ; l'État (équipements militaires compris) environ un cinquième"
    note: "Parts de l'investissement public (bloc investissement) déjà comptées dans les crédits de l'État et les dépenses des collectivités, retirées de ces blocs pour ne pas les compter deux fois. Le reste est celui de la Sécurité sociale (hôpitaux) et des opérateurs."
