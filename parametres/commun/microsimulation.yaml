# Phase F de la roadmap : base micro (population synthétique de ménages) et calage d'OpenFisca sur les comptes.
# DÉCISION d'Adrien du 14/11/2026 : population synthétique construite et calée sur des tableaux publics (Insee,
# DGFiP, Cnaf, Drees), remplaçable plus tard par une vraie enquête (ERFS, EFL) si l'accès est obtenu.
# Générateur : outils/population_synthetique.py ; calcul : outils/openfisca_population.py ; docs/microsimulation.md.

microsimulation:
  taille_echantillon:
    valeur: 20000
    unite: sans_unite
    statut: DECISION
    note: "Nombre de ménages tirés (≈ 45 000 personnes). Assez pour des déciles stables (2 000 ménages par décile) ; OpenFisca les calcule en moins d'une minute. Graine fixe : 2027."
  menages_2026:
    valeur: 31.4
    unite: sans_unite
    statut: HYPOTHESE
    source: "Insee, recensement 2021 : 30,6 millions de ménages (résidences principales) au 1er janvier 2021, 66,2 millions de personnes"
    note: "En millions. + 0,5 % par an de 2021 à 2026 (rythme des estimations annuelles du parc de logements), soit 30,6 × 1,026."
  structure_menages:
    valeur: {seul: 0.38, couple_sans_enfant: 0.25, couple_avec_enfants: 0.24, monoparentale: 0.09, complexe: 0.04}
    unite: sans_unite
    statut: SOURCE
    source: "Insee, Ménages, couples et familles (2021) : 38 % de ménages d'une seule personne, 49 % de couples dont 24 % avec enfants, 9 % de familles monoparentales (recensement 2021)"
    note: "Ménages complexes (4 %, par différence) : comptés comme des couples sans enfant avec un adulte de plus (enfant majeur ou parent hébergé), DÉCISION faute de détail. Enfants sans limite d'âge, comme au recensement."
  enfants_par_famille:
    valeur: {"1": 0.43, "2": 0.36, "3": 0.16, "4": 0.05}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Insee Focus n° 249 (2021) : 21 % de familles nombreuses (trois enfants ou plus) ; Insee, France portrait social 2023 : un quart des familles nombreuses ont quatre enfants ou plus"
    note: "Partage entre un et deux enfants estimé (≈ 45 / 38 parmi les familles avec mineurs) ; recalé ensuite par le calage sur la population par âge."
  sortie_menages_ordinaires:
    valeur: {"75-84": 0.04, "85+": 0.15, autres: 0.006}
    unite: taux
    statut: HYPOTHESE
    source: "Insee : 66,2 millions de personnes en ménages ordinaires sur 67,4 millions d'habitants (2021), soit 1,2 million hors ménages (Ehpad, foyers, internats, casernes)"
    note: "Part de chaque âge qui vit hors ménage ordinaire (absente de la population synthétique) : surtout les grands âges (Ehpad, ≈ 600 000 résidents)."
  statut_occupation:
    valeur: {proprietaire: 0.576, locataire_prive: 0.228, locataire_social: 0.176, loge_gratuitement: 0.020}
    unite: sans_unite
    statut: SOURCE
    source: "Insee-SDES, estimations annuelles du parc de logements : au 1er janvier 2025, 22,8 % des résidences principales occupées par des locataires de bailleurs privés et 17,6 % par des locataires de bailleurs publics ; Insee Focus n° 309 : 57,2 % de propriétaires en 2023"
    note: "Logés gratuitement et autres : par différence. Propriétaires plus fréquents avec l'âge, locataires du parc social plus fréquents dans le bas de la distribution des revenus et chez les familles monoparentales (Insee Première n° 2047)."
  loyer_m2:
    valeur: {social: 6.8, prive: 13.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "SDES, RPLS : loyer moyen du parc social conventionné 6,52 €/m² au 1er janvier 2024 (+ 3,8 % sur un an) ; Insee : 60 % des locataires dans le secteur libre, 40 % dans le social"
    note: "€/m² par mois en 2026. Social : 6,52 × 1,04 (deux revalorisations). Privé : hypothèse (moyenne nationale des observatoires des loyers, ≈ 2 fois le social) ; à recaler sur les aides au logement. Surface : 45 m² pour une personne, + 15 m² par personne, plafonnée à 100 m²."
  zones_apl:
    valeur: {zone_1: 0.15, zone_2: 0.45, zone_3: 0.40}
    unite: sans_unite
    statut: DECISION
    note: "Zone 1 : Paris et petite couronne ; zone 2 : grandes agglomérations ; zone 3 : le reste. Parts estimées faute de tableau public par zone ; recalées par le calage des aides au logement."
  pension_brute_moyenne:
    valeur: 1980
    unite: eur_mois
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Drees : pension brute moyenne 1 827 € par mois fin 2023, réversion comprise ; revalorisations des pensions de base de 5,3 % (2024), 2,2 % (2025) et 0,9 % (2026, coefficient 1,009) ; Agirc-Arrco + 1,6 % (novembre 2024) puis gelée"
    note: "1 827 × 1,064 (revalorisations, base et complémentaires pondérées) × 1,02 (renouvellement : les nouveaux retraités ont de plus fortes pensions que les décédés). Les déciles de la Drees (anciennes_pensions.deciles_drees_2020) donnent la forme."
  retraites_residents_2026:
    valeur: 16.9
    unite: sans_unite
    statut: HYPOTHESE
    source: "retraites_actuels.donnees : 16,3 millions de retraités résidant en France en 2023"
    note: "En millions, + 1,2 % par an."
  depart_par_age:
    valeur: {"55-59": 0.04, "60-61": 0.30, "62": 0.60, "63-64": 0.75, "65-66": 0.92, "67+": 0.99}
    unite: taux
    statut: HYPOTHESE
    note: "Part des personnes sans emploi de chaque âge qui sont retraitées (carrières longues, départs à l'âge légal, taux plein à 67 ans) ; le total est recalé sur retraites_residents_2026."
  emploi_2026:
    valeur: {salaries_prives: 21.0, agents_publics: 5.7, independants: 3.7}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Classes de salaires du modèle (parametres/donnees/salaries_prive.csv : 21,0 millions ; fonctionnaires.csv : 5,7 millions) ; Insee, emploi total ≈ 30,4 millions"
    note: "En millions. Indépendants en activité principale : par différence (les micro-entrepreneurs en activité d'appoint sont comptés comme salariés)."
  chomeurs_indemnises:
    valeur: {part: 0.72, allocation_brute_mensuelle: 1310}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Unédic (octobre 2026) : 46,6 Md€ de dépenses en 2026, 2,6 millions d'allocataires indemnisés ; Insee : 2,7 millions de chômeurs au sens du BIT"
    note: "Allocation : (46,6 − 11 % de contribution à France Travail) / 2,6 millions / 12 ≈ 1 330 € ; prise à 1 310 € bruts. Part des chômeurs du BIT indemnisés : 0,72 (une partie des allocataires travaille en activité réduite et n'est pas chômeur au sens du BIT). Allocation proportionnelle au salaire perdu (57 %), recalée sur la moyenne."
  handicap:
    valeur: {adultes: 1.35, taux_incapacite: 0.8}
    unite: sans_unite
    statut: HYPOTHESE
    source: "PLF 2026 : 14,6 Md€ pour l'AAH (statu_quo.aah) ; Drees : 1,3 à 1,4 million d'allocataires"
    note: "En millions d'adultes de 20 à 64 ans, tirés parmi les inactifs et les bas salaires ; taux d'incapacité de 80 % (AAH de droit commun)."
  correlation_conjoints:
    valeur: {salaires: 0.35, pensions: 0.2}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Homogamie : Insee Première n° 1937 (2023), les diplômés vivent plus souvent en couple entre eux ; pensions : anciennes_pensions.couples"
    note: "Corrélation des rangs de revenu des conjoints (copule gaussienne)."
  capital_menages:
    valeur: {dividendes: 53, revenus_fonciers: 30, concentration: 1.3}
    unite: sans_unite
    statut: HYPOTHESE
    source: "dividendes.revenus_capitaux_mobiliers_2023 (53 Md€) ; revenus_capital.loyers (30 Md€)"
    note: "En Md€. Répartis sur les ménages selon le rang de leur revenu avec une loi de Pareto (paramètre 1,3 : le dernier centile reçoit environ la moitié des dividendes, Insee-DGFiP) ; dividendes au prélèvement forfaitaire (12,8 % d'IR), loyers au barème après abattement."
  cibles_2026:
    valeur: {impot_revenu: 104.0, prestations_entretien: 25.2, aides_logement: 16.7, rsa: 13.5, prime_activite: 10.5, aah: 14.6}
    unite: sans_unite
    statut: SOURCE
    source: "PLF 2026, évaluation des voies et moyens : impôt net sur le revenu 104,0 Md€ ; Cnaf, Analyses statistiques n° 7 : prestations d'entretien (allocations familiales, complément familial, allocation de soutien familial, allocation de rentrée scolaire, allocation de base et prime à la naissance de la Paje) 24,5 Md€ en 2024 ; autres prestations : statu_quo.aides_logement, rsa, prime_activite, aah"
    note: "En Md€. Critère de sortie de la phase F : impôt sur le revenu et prestations à 5 % près. Prestations d'entretien : 24,5 × 1,009 × 1,021 (inflation 2025 et 2026, comme statu_quo.prestations_familiales) ≈ 25,2 ; le complément de mode de garde, la PreParE et l'AEEH (≈ 9,5 Md€ des 34,7 de statu_quo.prestations_familiales) dépendent de choix de garde que la population n'a pas : ils restent au moteur agrégé. L'IR net de l'État comprend le prélèvement forfaitaire sur les revenus du capital et la contribution sur les hauts revenus."
  recours:
    valeur: {rsa: 0.65, prime_activite: 0.50}
    unite: taux
    statut: SOURCE
    source: "Drees, Études et Résultats n° 1370 (mai 2026) : non-recours au RSA entre 33 % et 37 % des foyers éligibles fin 2021 (29 à 32 % des montants) ; n° 1379 (juillet 2026) : non-recours à la prime d'activité entre 48 % et 52 % des foyers éligibles, souvent pour de petits montants ou une éligibilité passagère"
    note: "Part des familles éligibles qui perçoivent la prestation. Tirage au hasard (graine fixe), avec une probabilité qui croît comme la racine du montant dû, calée pour donner cette part en nombre de familles : la part en montant est donc plus forte, comme le constate la Drees. Aides au logement, AAH et prestations familiales : recours complet (non-recours faible, non mesuré)."
  mois_travailles:
    valeur: {taux_mensuel_min: 0.5, taux_mensuel_max: 1.0}
    unite: sans_unite
    statut: DECISION
    note: "Un salaire annuel faible vient soit d'un temps partiel, soit de quelques mois de travail dans l'année. Le salaire mensuel des mois travaillés est tiré entre 0,5 et 1 Smic (si le salaire annuel moyen est plus bas) ; le nombre de mois en découle, en un bloc de mois consécutifs placé au hasard dans l'année, le même chaque année. Sans cela, OpenFisca verse la prime d'activité tous les mois au lieu du RSA certains mois (écart constaté au premier calage : prime d'activité + 54 %, RSA − 43 %)."
  couples_maries:
    valeur: 0.75
    unite: taux
    statut: HYPOTHESE
    source: "Insee (Couples et familles) : environ 72 % des personnes en couple sont mariées et 9 % pacsées, le reste en union libre"
    note: "Part des couples qui déclarent leurs revenus ensemble (mariés ou pacsés) ; les autres font deux déclarations mais une seule famille pour les prestations."
  formes_tirage:
    valeur:
      seul_par_age: {"18-24": 0.35, "25-34": 0.25, "35-54": 0.15, "55-64": 0.2, "65-74": 0.28, "75-84": 0.42, "85+": 0.6}
      age_parent: {moyenne: 42, ecart: 9}
      ecart_age_conjoints: {moyenne: -1, ecart: 4}
      ecart_age_mere_enfant: [24, 40]
      proprietaire_par_age: {"<30": 0.15, "30-39": 0.42, "40-49": 0.57, "50-64": 0.66, "65+": 0.75}
      social_parmi_locataires: {bas: 0.65, milieu: 0.4, haut: 0.15, monoparentale: 0.15}
    unite: sans_unite
    statut: DECISION
    note: "Formes de départ du tirage (part de personnes seules par âge, âge des parents, écart d'âge des conjoints, propriétaires par âge, parc social selon le tiers de revenu). Elles ne fixent pas les totaux : le calage (outils/population_synthetique.py) ramène la population par âge, les types de ménages, les statuts d'activité, les classes de salaires et les statuts d'occupation sur leurs marges sourcées. Ordres de grandeur : Insee, France portrait social 2023 (fiches 1.3 et 6.1)."
  emploi_par_configuration:
    valeur: {sans_enfant: 0.958, monoparentale: 0.935, couple_avec_enfants: 1.066, seul: 0.92, chomage_sans_conjoint: 2.0, chomage_en_couple: 0.75}
    unite: sans_unite
    statut: SOURCE
    source: "Insee, Emploi, chômage, revenus du travail, édition 2025, dossier 1 : en 2024, 80,1 % des 15-64 ans hors étudiants et retraités sont en emploi ; écart de − 3,4 points sans enfant, − 5,2 points en famille monoparentale, + 5,3 points en couple avec enfants"
    note: "Coefficients appliqués à la probabilité d'emploi par âge des adultes de moins de 65 ans selon le type de ménage (76,7 / 80,1 ; 74,9 / 80,1 ; 85,4 / 80,1) ; couples sans enfant : « sans enfant ». Personnes seules (0,92) et chômage selon la vie en couple (× 2 sans conjoint, × 0,75 en couple) : HYPOTHÈSES encadrées par Insee, France portrait social 2012 (hommes sans conjoint : taux de chômage de 13 % contre 5 % en couple, activité plus faible), et choisies après le premier calage, où le RSA manquait de 40 % faute de personnes seules sans revenu : à vérifier sur une source récente (enquête Emploi par type de ménage). Le calage remet ensuite les effectifs totaux sur leurs marges."
  etudiants_decohabitants:
    valeur: 0.67
    unite: taux
    statut: SOURCE
    source: "OVE, Conditions de vie des étudiants 2023 : 24,0 % des étudiants vivent chez leurs deux parents, 7,3 % chez leur mère, 1,6 % chez leur père ; 25,6 % louent seuls ; vie-publique.fr : environ 780 000 étudiants perçoivent une aide au logement (2022)"
    note: "Part des étudiants de 18 à 24 ans qui vivent hors du logement de leurs parents : ils forment un ménage d'une personne locataire du privé (surface 20 m², zone 1 ou 2), restent rattachés au foyer fiscal des parents et partagent leur poids de calage."
  allocation_soutien_familial:
    valeur: 0.98
    unite: sans_unite
    statut: HYPOTHESE
    source: "Cnaf, Analyses statistiques n° 7 : 909 000 familles bénéficiaires de l'ASF en 2024 (+ 3,7 % sur un an), 3,1 Md€"
    note: "En millions de familles en 2026 (909 000 × 1,037²). OpenFisca suppose l'ASF due à tout parent isolé (il ne sait pas si l'autre parent verse une pension) : ce nombre de familles éligibles, tirées au hasard, la perçoivent."
  familles_enfants_mineurs:
    valeur: {total: 7.75, "1": 0.448, "2": 0.387, "3": 0.127, "4": 0.038}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Insee, Tableaux de l'économie française 2020 : 8,03 millions de familles avec enfants mineurs en 2016, dont 44,8 % avec un enfant, 38,7 % avec deux, 12,7 % avec trois, 3,8 % avec quatre ou plus ; Insee, France portrait social 2022 : 8,0 millions en 2020"
    note: "Total en millions en 2026 : 8,0 en 2020, en baisse avec les naissances (− 0,5 % par an). Marges du calage : ménages par nombre d'enfants mineurs (les familles des ménages complexes sont comptées avec leur ménage)."
  familles_allocations_familiales:
    valeur: 4.79
    unite: sans_unite
    statut: SOURCE
    source: "Cnaf, Analyses statistiques n° 7 : 4 786 000 familles bénéficiaires des allocations familiales en 2024"
    note: "En millions. Marge du calage : familles avec au moins deux enfants de moins de 20 ans."
  aah_en_emploi:
    valeur: 0.2
    unite: taux
    statut: HYPOTHESE
    note: "Part des adultes handicapés tirés parmi les salariés à bas salaire (temps partiel, établissements et services d'aide par le travail) plutôt que parmi les inactifs : l'AAH y est différentielle. Ordre de grandeur, à sourcer (Drees, minima sociaux)."
