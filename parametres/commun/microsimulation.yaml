    unite: sans_unite
    statut: SOURCE
    source: "Drees, Minima sociaux et prestations de solidarité, édition 2025, fiche 23 : 23 % des allocataires du RSA perçoivent aussi la prime d'activité ; fin 2023, 56 % de personnes seules sans enfant, 33 % de familles monoparentales, 2 % de couples sans enfant, 9 % de couples avec enfants ; Drees, suivi mensuel des prestations de solidarité (février 2026) : fin décembre 2025, 1,84 million de foyers au RSA, 4,76 millions à la prime d'activité, 5,66 millions d'allocataires des aides au logement ; Cnaf, Analyses statistiques n° 7 : 844 000 familles au complément familial en 2024 (régime général)"
    note: "En millions de familles. RSA : 1,84 million, dont 23 % avec la prime d'activité (0,42), réparti selon la configuration familiale de la Drees (1,03 ; 0,61 ; 0,037 ; 0,166). RSA et prime d'activité : bénéficiaires après recours (probabilité attendue du tirage). Aides au logement : y compris les foyers et résidences hors du champ de la population, qui sont donc représentés par des ménages ordinaires semblables (limite). Complément familial : Caf seules (sans la MSA)."
  nationalite:
    valeur: {etrangers: 6.03, part_ue: 0.25, part_paiements_cnaf: 0.13, part_recents_hors_ue: 0.30}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Insee Première n° 2076 (octobre 2025) : 6,03 millions d'étrangers en 2024 (8,8 % de la population) ; ministère de l'Intérieur (recensement 2022) : environ un quart des étrangers originaires de l'Union européenne ; iFRAP d'après la Cnaf : les étrangers reçoivent 13 % des prestations versées par les Caf ; Insee : 313 000 à 347 000 entrées d'immigrés par an (2023-2024)"
    note: "Étrangers en millions de personnes. Nationalité tirée par ménage (tous ses membres), avec une probabilité qui croît quand le niveau de vie baisse, calée pour que les ménages étrangers reçoivent 13 % des prestations des Caf. Ressortissants de l'UE : un quart des ménages étrangers, au hasard (protégés par le droit de l'Union : jamais exclus par les mesures de nationalité). Arrivés depuis moins de cinq ans : 30 % des ménages étrangers hors UE, au hasard. Ordre de grandeur : ≈ 1,5 à 1,7 million de premiers titres de séjour en cinq ans (384 230 en 2025, DGEF, demographie.titres_vers_solde), dont environ un tiers d'étudiants souvent repartis : ≈ 1,2 million d'adultes encore présents, sur ≈ 3,6 millions d'adultes étrangers hors UE (Insee) : 30 à 35 % ; 30 % retenu (bas de la fourchette). DÉCISION faute d'enquête : pas de profil propre par nationalité au-delà du niveau de vie."
