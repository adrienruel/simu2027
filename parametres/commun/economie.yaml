    valeur: true
    unite: sans_unite
    statut: HYPOTHESE
    note: "Interrupteur du canal d'offre (false : seul le multiplicateur de demande, comme avant le 06/11/2026). Écologie de droite n'y passe pas : son moteur a ses propres canaux d'offre (participation des inactifs, coût du travail, cohortes d'entreprises, localisation), plus détaillés."
