    note: "Baisse de l'inflation (points) pour un point de PIB d'écart de production en moins. La courbe de Phillips est plate en zone euro depuis 2010 (Banque de France, billet « Où se situe l'inflation en zone euro dans le cône de Phillips ? ») ; ordre de grandeur des estimations de la BCE : 0,1 à 0,3. Sans source chiffrée vérifiée : plus elle est forte, plus l'inflation baisse en 2029 (défavorable)."
  transmission_carbone:
    valeur: {crise: 0.0, prudent: 0.0, median: 0.5, optimiste: 1.0}
    unite: taux
    statut: HYPOTHESE
    source: "Konradt et Weder di Mauro (2023), « Carbon Taxation and Greenflation: Evidence from Europe and Canada » : les taxes carbone ont changé les prix relatifs (énergie plus chère) sans hausse significative de l'inflation globale"
    note: "Part de la hausse réelle du prix du carbone qui passe dans l'inflation globale. Prudent et crise : 0 (la source) ; médian : la moitié ; optimiste : en entier (l'inflation érode davantage les pensions gelées, ce qui est favorable aux comptes)."
  poids_taxes_carbone_consommation:
    valeur: 0.037
    unite: taux
    statut: HYPOTHESE
    note: "Taxes carbone (55 Md€ en 2029 : accises des ménages et des collectivités 41,6 Md€, des entreprises 13,3 Md€, moteur/carbone.recette_statique) rapportées à la consommation des ménages toutes taxes comprises (environ 1 500 Md€). Baisse avec les émissions (carbone.baisse_tendancielle_emissions)."

