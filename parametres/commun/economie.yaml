  demande_travail:
    valeur: {crise: [0.4, 0.1, 0.02], prudent: [0.6, 0.2, 0.03], median: [0.8, 0.3, 0.05], optimiste: [1.0, 0.4, 0.1]}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : élasticité de l'emploi au coût du travail ≈ 1 à 1,5 au voisinage du SMIC (Kramarz et Philippon, 2001), 0,4 à 1 pour les allègements ciblés (Crépon et Desplatz, 2001 ; L'Horty, 2006) ; faible au-delà de 1,6 SMIC et quasi nulle au-delà de 2,5 SMIC (rapport Bozio-Wasmer, octobre 2024)"
    note: "Valeurs absolues par tranche de salaire brut (jusqu'à 1,3 SMIC ; 1,3 à 2,5 ; au-delà), appliquées au coût du travail calculé par OpenFisca, cellule par cellule. Emplois pris sur le chômage."
  travail_part_pib:
    valeur: {crise: 0.65, prudent: 0.65, median: 0.75, optimiste: 0.85}
    unite: taux
    statut: HYPOTHESE
    source: "Part du travail dans la valeur ajoutée ≈ 0,65 (Insee) : effet du travail en plus sur le PIB à capital inchangé (prudent) ; à long terme, le capital suit le travail et l'effet est entier (optimiste ; Bassanini et Scarpetta, OCDE, 2001, effet avec l'investissement)"
  elasticite_cout_travail:
    valeur: {crise: 0.8, prudent: 1.0, median: 1.5, optimiste: 2.1}
    unite: sans_unite
    statut: HYPOTHESE
    source: "DG Trésor, Le modèle Mésange : réestimation et nouveautés (séminaire Fourgeaud, 15 mars 2017) : baisse uniforme des cotisations employeurs de 1 point de PIB, +2,12 % de PIB et +504 000 emplois à long terme (borne optimiste) ; Kramarz et Philippon, Crépon et Desplatz : effets concentrés sur les bas salaires, plus faibles au-dessus de 1,6 SMIC (prudent)"
    note: "Cotisations employeurs et allègements sur les bas et moyens salaires. Emplois pris sur le chômage (demande de travail). Les allègements au-dessus de 1,6 SMIC passent par l'élasticité du travail : leurs effets sur l'emploi sont faibles (rapport Bozio-Wasmer, octobre 2024), le coût étant surtout reporté sur les salaires."
  part_capital:
    valeur: 0.35
    unite: taux
    statut: HYPOTHESE
    source: "Part du capital dans la valeur ajoutée ≈ 0,33 à 0,35 (Insee, partage de la valeur ajoutée des sociétés non financières)"
    note: "Fiscalité des entreprises : même élasticité de l'investissement au coût du capital que les cohortes d'entreprises d'Écologie de droite (macro.elasticite_invest, Mésange et OFCE) ; coût du capital (1 − τz)/(1 − τ) au taux d'IS de 25 %, valeur actuelle des amortissements is_investissement.valeur_actuelle_amortissements ; 1 point de PIB d'IS ≈ taux × IS / PIB du statu quo ; capital à long terme en proportion de l'investissement ; effet sur le PIB = part du capital × capital en plus (moteur/offre.py). Emplois : 30 % de l'effet, pris sur le chômage."
  elasticite_capital_menages:
    valeur: {crise: 0.0, prudent: 0.1, median: 0.3, optimiste: 0.6}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : évaluations du prélèvement forfaitaire unique et de la fin de l'ISF (France Stratégie, comité d'évaluation des réformes de la fiscalité du capital, 2019-2023) : hausse des dividendes versés, pas d'effet décelable sur l'investissement ; Arnold (2008) : les impôts sur le patrimoine (hors immobilier) n'ont pas d'effet significatif"
    note: "Dividendes, intérêts, ISF, IFI, taxe Zucman, taxe sur les transactions financières. Pas d'effet sur l'emploi."
  elasticite_successions:
    valeur: {crise: 0.0, prudent: 0.0, median: 0.1, optimiste: 0.3}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : peu d'effet mesuré des droits de succession sur l'investissement (Conseil d'analyse économique, Note n° 69, 2021) ; un héritage reçu baisse l'offre de travail des héritiers (effet Carnegie : Holtz-Eakin, Joulfaian et Rosen, 1993 ; Elinder, Erixson et Ohlsson, 2012), qui compense une partie de l'effet sur les entreprises familiales (borne optimiste)"
  elasticite_consommation:
    valeur: {crise: 0.05, prudent: 0.1, median: 0.2, optimiste: 0.3}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : Arnold (2008) : les impôts sur la consommation sont parmi les moins nuisibles à la croissance (coefficient ≈ +0,7 contre les impôts sur le revenu) ; ils pèsent sur le salaire réel, donc un peu sur l'offre de travail"
    note: "TVA, accises. Emplois : 50 % de l'effet, pris sur le chômage."
  elasticite_transferts_actifs:
    valeur: {crise: 0.05, prudent: 0.1, median: 0.2, optimiste: 0.4}
    unite: sans_unite
    statut: HYPOTHESE
