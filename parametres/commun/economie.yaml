    statut: HYPOTHESE
    source: "Encadrement : coût du travail moyen d'un salarié de 60 à 64 ans ≈ 60 000 € (Insee, profil des salaires par âge) ; prélèvements ≈ 45 % du coût (OpenFisca 2026, statu_quo.prelevements_activite)"
