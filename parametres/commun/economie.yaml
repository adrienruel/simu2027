    note: "Prudent : 1,8 % (DÉCISION d'Adrien du 29/10/2026, entre la Banque de France et la cible). Une inflation plus basse est défavorable aux comptes (moins d'érosion des pensions gelées et de la dette) : crise 1,4 % (inflation durablement sous la cible, comme en 2013-2020), médian 1,9 %, optimiste 2 %."
