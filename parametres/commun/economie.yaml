# --- Énergie des entreprises (06/11/2026) ----------------------------------------------------------------------
# Remarque d'Adrien : une énergie moins chère pour les entreprises fait plus de marges, donc plus d'impôt sur les
# bénéfices, plus d'activité et plus d'embauches. Canal commun : moteur/carbone.couts_energie_entreprises, utilisé par
# tout programme qui change les taxes sur l'énergie des entreprises.
# Canal d'offre commun (6 novembre 2026) : effet de long terme d'un changement de prélèvement ou de transfert sur le
# PIB, par instrument, appliqué à tous les programmes chiffrés sur le noyau (moteur/offre.py). Valeurs en % de PIB à
# long terme pour 1 point de PIB de prélèvement en moins (ou de transfert aux actifs en moins). Le scénario donne
# l'élasticité quand la mesure joue pour le programme (baisse d'impôt) ; quand elle joue contre lui (hausse), on prend
# le scénario miroir (crise ↔ optimiste, prudent ↔ médian), pour que le prudent reste prudent dans les deux sens.
offre:
  actif:
    valeur: true
    unite: sans_unite
    statut: HYPOTHESE
    note: "Interrupteur du canal d'offre (false : seul le multiplicateur de demande, comme avant le 06/11/2026). Écologie de droite n'y passe pas : son moteur a ses propres canaux d'offre (participation des inactifs, coût du travail, cohortes d'entreprises, localisation), plus détaillés."
  travail_participation:
    valeur: {crise: [0.08, 0.04, 0.02], prudent: [0.12, 0.06, 0.03], median: [0.15, 0.075, 0.035], optimiste: [0.19, 0.095, 0.04]}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : élasticités de participation au revenu net plus fortes en bas de l'échelle des salaires (Immervoll, Kleven, Kreiner et Saez, Economic Journal, 2007 : 0,1 à 0,4 en Europe ; Bargain, Orsini et Peichl, Journal of Human Resources, 2014, pour la France) ; Chetty, Guren, Manoli et Weber (2011) : ≈ 0,25 en moyenne macroéconomique (borne optimiste)"
    note: "Élasticités au gain à travailler (revenu disponible en emploi moins sans emploi), comme Immervoll et al. Calées pour que la suppression de la CSG sur le travail (calculée par OpenFisca) donne, pour 1 point de PIB, un effet sur le PIB dans la fourchette de la littérature macroéconomique : ≈ 0,3 % en crise, 0,4 % en prudent, jusqu'à ≈ 1 % en optimiste (Bassanini et Scarpetta, OCDE, 2001 : 0,3 effet direct, 0,6 à 0,7 avec l'investissement). Trois tranches de salaire brut (en multiples du SMIC de 2026) : jusqu'à 1,3 ; de 1,3 à 2,5 ; au-delà. Appliquées cellule par cellule aux distributions de salaires de 2026 (privé : Insee ; public : DGAFP), au revenu net calculé par OpenFisca (moteur/offre.py). Emplois venus de l'inactivité."
  micro_emploi:
    valeur: true
    v_avant_f4: false
    unite: sans_unite
    statut: DECISION
    note: "Phase F4, DÉCISION d'Adrien du 14/11/2026 : les transferts aux actifs codés dans OpenFisca (programmes/micro_mesures.yaml) passent leur effet sur l'emploi par le gain à travailler calculé sur la population (parametres/donnees/micro_emploi_2026.csv), au lieu de offre.elasticite_transferts_actifs. Faux : ancien canal agrégé pour toutes les mesures."
  participation_transferts:
    valeur: {crise: 0.33, prudent: 0.33, median: 0.67, optimiste: 1.0}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : effets faibles du RSA sur la reprise d'emploi en France (Dares, évaluations du RSA, 2011 : borne basse) ; Bargain et Doorley (Journal of Public Economics, 2011) : le RMI à 25 ans baisse de 7 à 10 % la participation des hommes seuls peu diplômés (niveau central) ; Immervoll, Kleven, Kreiner et Saez (2007), Chetty et al. (2011) : élasticités de participation de offre.travail_participation (borne haute)"
    note: "DÉCISION d'Adrien du 14/11/2026 : trois niveaux pour l'effet du gain à travailler quand il change par les aides sociales (microsimulation, outils/openfisca_mesures.py) : bas (crise, prudent), central (médian), haut (optimiste), en fraction des élasticités de participation du canal travail. Une baisse d'emploi prend le scénario miroir (prudent : le niveau central), choisi sur le sens net de la mesure depuis le chantier 2.1 (21/11/2026), plus personne par personne."
  travail_heures:
