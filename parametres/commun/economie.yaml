# --- Démographie (module de population annuel, 29 octobre 2026) -------------------------
# Projections de population de l'Insee (juin 2026), par âge et par année ; taux d'emploi par âge ; effet du
# programme sur la natalité. Voir moteur/demographie.py et docs/demographie.md.
demographie:
  scenario_fecondite:
    valeur: {crise: fec_basse, prudent: central, median: central, optimiste: fec_haute}
    unite: sans_unite
    statut: DECISION
    source: "Insee, projections de population 2026-2070 (Insee Résultats et Insee Première n° 2108, 8 juin 2026) : central 1,45 enfant par femme dès 2028, solde migratoire +150 000 par an ; fécondité basse 1,20 ; haute 1,70"
    note: "Correspondance proposée le 29/10/2026 et validée par Adrien (« Go »)."
  migrations:
    valeur: {profil: {"0-17": 0.369, "18-29": 0.359, "30-44": 0.263, "45-64": 0.030}, emploi_relatif: 0.87, salaire_relatif: 0.91, fecondite_relative: 1.26, calendrier_fecondite: {"15-19": 0.02, "20-24": 0.10, "25-29": 0.27, "30-34": 0.33, "35-39": 0.20, "40-44": 0.07, "45-49": 0.01}, solde_central: 150000, solde_bas: 70000, solde_haut: 230000}
    unite: sans_unite
    statut: SOURCE
    source: "Profil par âge : solde migratoire des immigrés en 2017 (+73 000 de moins de 18 ans, +71 000 de 18 à 29 ans, +52 000 de 30 à 44 ans, +6 000 de 45 à 64 ans, −3 000 de 65 ans ou plus, sur +198 000 ; Insee Première n° 1849, avril 2021, figure 3a). Emploi relatif : taux d'emploi des 15-64 ans de 62,4 % pour les immigrés contre 71,4 % pour les personnes sans ascendance migratoire directe en 2024 (Insee, enquête Emploi 2024), soit 0,87. Salaire relatif : salaire net médian à temps complet des immigrés de 25 à 49 ans inférieur de 9 % à celui des personnes sans ascendance migratoire (Insee Références, Immigrés et descendants d'immigrés, édition 2023, fiche 4.4, enquête Emploi 2021). Fécondité relative : ICF des femmes nées à l'étranger de 2,3 en 2021 contre 1,83 pour l'ensemble (Insee Références, édition 2023, fiche 1.8), soit 1,26, appliqué à l'ICF du scénario (demographie.fecondite_variantes). Calendrier : répartition des naissances par âge de la mère, ordre de grandeur des taux de fécondité par âge de l'Insee (âge moyen à la maternité ≈ 31 ans). Soldes : central +150 000, bas +70 000, haut +230 000 par an (Insee Première n° 2108, juin 2026)"
    note: "Variante migratoire commune (phase B2, DÉCISION d'Adrien du 12/11/2026, soir : canal emploi pour tous les programmes qui changent le solde migratoire), moteur/migrations.py. Le profil des immigrés (et non celui du solde total, où les départs de jeunes non-immigrés pèsent) parce que les programmes agissent sur l'immigration. Le solde des 65 ans ou plus (−3 000, des retours) n'est pas repris : une baisse des entrées ne le change pas ; les quatre tranches sont renormalisées."
  titres_vers_solde:
    valeur: {titres_2025: {total: 384230, etudiants: 117970, familial: 91100, humanitaire: 92600, economique: 51190, divers: 31370},
             part_au_solde: {crise: 0.8, prudent: 0.7, median: 0.6, optimiste: 0.5},
             realisation: {crise: 1.0, prudent: 0.8, median: 0.6, optimiste: 0.4}}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Premiers titres de séjour de 2025 : 384 230, dont 117 970 étudiants, 91 100 familiaux, ≈ 92 600 humanitaires, 51 190 économiques (DGEF, chiffres du 27/01/2026, repris par vie-publique.fr et l'AFP). Part au solde : le solde migratoire des immigrés (+198 000 en 2017, Insee Première n° 1849) rapporté aux premiers titres de la même année (≈ 260 000, DGEF) vaut ≈ 0,75, mais il compte les immigrés de l'Union, sans titre ; une partie des étudiants repart"
    note: "Phase B2 (12/11/2026, soir). Un programme déclare des titres en moins par an (<nom>_canaux.solde_migratoire.titres_en_moins, sa lecture des mesures) ; variation du solde = − titres × part au solde × réalisation. Une baisse de l'immigration dégrade le solde public dans le modèle (moins d'actifs, dépenses en partie seulement en baisse) : le prudent prend la baisse la plus forte (part et réalisation hautes), l'optimiste la plus faible ; une hausse prend le scénario miroir. Réalisation : obstacles juridiques (Constitution, droit européen, CEDH) pour les mesures qui passent par un référendum ou une renégociation."
  sante_relative_age:
    valeur: {"0-4": 0.6, "5-19": 0.35, "20-29": 0.49, "30-39": 0.65, "40-49": 0.85, "50-59": 1.15, "60-69": 1.65, "70-79": 2.4, "80+": 2.94}
    unite: sans_unite
    statut: SOURCE
    source: "Points d'appui sourcés : dépense moyenne 2 903 € par an, 1 420 € entre 21 et 30 ans (0,49), 8 529 € au-delà de 80 ans (2,94) (DREES, application dépenses de santé et restes à charge, données 2021, reprise par MoneyVox) ; forme du profil entre les deux : DREES, Études et Résultats n° 1025, graphique 1 (minimum vers 10-20 ans, hausse rapide après 50 ans, dépense d'un homme de 70-74 ans ≈ 8 fois celle d'un homme de 20-24 ans)"
    note: "Sert seulement à la variante migratoire (moteur/migrations.py) : la santé du statu quo suit les salaires et les pentes communes, sans la population (décision d'Adrien) ; l'écart de population d'un programme change la dépense de santé dans le rapport des populations pondérées par ce profil."
  fecondite_variantes: {valeur: {fec_basse: 1.20, central: 1.45, fec_haute: 1.70}, unite: sans_unite, statut: SOURCE, source: "Insee, projections de population 2026 (Insee Première n° 2108)"}
  taux_emploi_age:
    valeur: {"15-24": 0.345, "25-49": 0.828, "50-54": 0.844, "55-59": 0.788, "60-64": 0.444, "65-69": 0.11, "70+": 0.0}
    unite: sans_unite
    statut: SOURCE
    source: "Insee, Emploi selon le sexe et l'âge, 2025 (15-24 : 34,5 % ; 25-49 : 82,8 % ; 50-64 : 69,2 %) ; Dares et COR (rapport annuel juin 2026, partie 4, chapitre 1) : 55-59 : 78,8 % ; 60-64 : 44,4 % ; 65-69 : environ 11 %"
    note: "50-54 ans calculé : 3 × 69,2 − 78,8 − 44,4 = 84,4 % (tranches de tailles voisines) ; recoupé : 84 % des personnes de 50 ans sont en emploi (COR). 70 ans ou plus : 0 (prudent, moins de 3 %). Taux figés à leur niveau de 2025 : la démographie seule fait varier l'emploi ; les hausses de l'emploi des seniors dues au programme sont comptées dans leurs mesures. La fin de la montée à 64 ans de la réforme de 2023 n'est pas comptée (prudent)."
  natalite_semi_elasticite:
    valeur: {crise: 0.02, prudent: 0.01, median: 0.01, optimiste: 0.005}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : allocation de naissance de 2 500 € en Espagne (2007-2010) : +3 % de naissances (González et Trommlerová, 2023), soit ≈ 2 % par 100 € par an d'enfance ; Israël, baisse de l'allocation de 150 shekels par mois (≈ 400 € par an) en 2003 : −7,5 % de fécondité (Cohen, Dehejia et Romanov, 2013) ; une grande part de ces effets est de calendrier (revue CFFP, Université de Sherbrooke, 2026)."
    note: "Variation relative des naissances pour 100 € par an de soutien en plus par enfant. Crise : borne haute (l'effet le plus défavorable si le soutien baisse) ; prudent et médian : la moitié, effets de calendrier retirés ; optimiste : le quart."
  natalite_montee: {valeur: 3, unite: sans_unite, statut: HYPOTHESE, note: "Années pour que l'effet sur les naissances soit plein, à partir de 2030 (premières naissances conçues sous le nouveau système)."}
  creches_effet:
    valeur: {crise: 0.0, prudent: 0.014, median: 0.028, optimiste: 0.028}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Bauernschuster, Hener et Rainer (Journal of the European Economic Association, 2016) : +10 points de couverture des moins de 3 ans en accueil public → +1,2 naissance pour 1 000 femmes, soit +2,8 % ; pas un simple effet de calendrier"
    note: "Hausse relative des naissances pour +10 points de couverture (mise à l'échelle des places créées : famille.creches_nouvelles). Médian et optimiste : l'estimation allemande ; prudent : la moitié (transposition à la France, où la couverture est déjà plus haute) ; crise : aucun effet. v235 : pas de places créées."

