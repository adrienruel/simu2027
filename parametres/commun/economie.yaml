    statut: HYPOTHESE
    source: "Même valeur que tondelier_smic.valeur_emploi_chomeur : allocation moyenne d'un chômeur indemnisé ≈ 1 050 € par mois (Unédic), un sur deux indemnisé ; garantie d'autonomie pour une partie des autres"
    note: "Dépense publique évitée quand un chômeur prend un emploi (ou en plus quand un salarié perd le sien), commune à tous les programmes depuis la phase A2 (12/11/2026, ProgrammeSimple.valeur_emploi_cellule). Suit le salaire moyen par emploi."
