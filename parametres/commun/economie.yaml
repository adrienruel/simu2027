# Hypothèses et données communes à tous les programmes (économie, démographie, système actuel,
# comportements). Un programme ne peut pas les redéfinir (moteur/parametres.py).
#
# Chaque paramètre porte : valeur (nombre ou dictionnaire par scénario), unite, annee_euros
# (montants), statut (SOURCE, HYPOTHESE, DECISION), source (obligatoire si SOURCE), note.
# Règle : une valeur sans source est prise prudente. Le scénario prudent est publié.

scenarios: [crise, prudent, median, optimiste]


