    unite: sans_unite
    statut: HYPOTHESE
    source: "Greenaway-McGrevy (2025), Auckland : la libéralisation du zonage de 2016 a presque doublé les permis de construire en sept ans (+87 %) ; SDES, Sit@del (janvier 2026) : 274 600 mises en chantier en 2025. Mêmes valeurs que les logements en croisière d'Écologie de droite (macro.logements_croisiere, décisions d'Adrien du 9 et du 21 octobre)"
    note: "Relecture neutre n° 2, point 5 : le canal logement était propre à Écologie de droite. Un programme déclare une intensité (<nom>_canaux.logement : 1 pour une réforme d'ensemble du foncier ou de l'urbanisme, 0,5 pour une mesure ciblée, négatif pour un encadrement des loyers ou un gel, qui freine l'offre) ; logements en plus par an = intensité × barème, en montée sur cinq ans ; PIB = logements × prix moyen hors taxe × part additionnelle (la moitié des chantiers se seraient faits ailleurs ou plus tard) ; recettes au taux de prélèvement du statu quo. Une baisse de l'offre prend le scénario miroir. Pas d'emplois propres : ils sont dans le PIB."

# --- Adoption de l'IA : effet proportionnel au budget engagé (phase B6, 12/11/2026, nuit) ------------------------
adoption_ia:
  budget:
    valeur: {reference_md: 1.0, non_chiffre_md: 0.25}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Stratégie nationale pour l'IA, deuxième phase : ≈ 1,5 Md€ de crédits publics sur 2021-2025, soit ≈ 0,3 Md€ par an, déjà dans le statu quo (dossier de presse du gouvernement, novembre 2021)"
    note: "Relecture neutre n° 2, point 12 : le rattrapage de l'adoption (<nom>_canaux.adoption_ia.part, Écologie de droite macro.adoption_ia) valait la même chose pour un plan de 200 Md€ et pour un objectif sans montant. Depuis la phase B6 : part × min(1, budget annuel en plus / 1 Md€). 1 Md€ par an en plus (environ trois fois l'effort public de la stratégie nationale) obtient le barème entier ; au-delà, rien de plus (l'adoption bute sur les entreprises, pas sur le budget). Une mesure qui nomme l'IA sans montant compte pour 0,25 Md€ (une économie nommée n'est jamais mise à zéro ; ici, un objectif nommé non plus)."

