    valeur: {offre: 1.0, appariement: 1.0, cout_travail: 1.0, localisation: moyen, population_active: median, perdus: 1.0, inactifs: 0.75}
    unite: sans_unite
    statut: HYPOTHESE
    note: "Coût employeur d'un emploi de chaque canal, en multiple du SMIC (ou « moyen » : coût moyen des salariés du privé ; « median » : salaire médian). Faute de source sur le salaire des emplois créés, le bas (SMIC) pour les emplois gagnés par l'offre, l'appariement et le coût du travail (prudent : ils rapportent moins) ; le coût moyen pour les emplois perdus par localisation (activités mobiles et rentables) ; le salaire médian pour les seniors. Règles : docs/bloc_emploi.md."
  allocation_chomeur_evitee:
