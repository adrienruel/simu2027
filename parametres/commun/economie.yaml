    note: "RSA, prime d'activité, aides au logement, allocations familiales : moins de transferts aux actifs = un peu plus de travail. Emplois venus de l'inactivité. L'assurance chômage n'y passe pas quand le programme a déjà son propre canal (Tondelier, PRE-15). Depuis le chantier 2.1 (21/11/2026) : seulement pour les transferts non codés dans OpenFisca ; un transfert codé passe par la micro (gain à travailler), qui distingue les aides liées à l'activité (prime d'activité : effet de signe contraire) des aides aux inactifs (docs/recoupements.md, Roadmap 2.1)."
  elasticite_investissement_public:
