# --- Emploi : quatorze réformes (feuille Emploi) -------------------------------------
# Colonnes de la v235 : crise (« ancien prudent »), médian, optimiste. Le prudent des effets macro
# prend le milieu de la crise et du médian pour les emplois créés (Effets macro!B8), mais la valeur
# de crise pour les emplois perdus (fin des subventions, prime d'embauche).
emploi:
  chomage_incompressible: {valeur: 0.035, unite: taux, statut: SOURCE, source: "Taux les plus bas tenus durablement en Europe de l'Ouest (Allemagne, Pays-Bas)"}
  marge_plancher: {valeur: 0.01, unite: taux, statut: HYPOTHESE, note: "13/11/2026 : à moins de cette marge au-dessus du chômage incompressible, les emplois en plus des programmes ont des rendements décroissants (moteur/emploi_canaux.plancher_chomage) : le chômage tend vers le plancher sans le franchir, raccord sans cassure au-dessus. Un point : l'écart entre le plus bas allemand récent (≈ 3 %) et les 4 % souvent cités comme plein emploi."}
  participation_inactifs:
    valeur: {crise: 0.0, prudent: 0.1, median: 0.2, optimiste: 0.3, base: 1926000}
    v235: {crise: 0.0, prudent: 0.0, median: 0.0, optimiste: 0.0, base: 1926000}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Élasticité de participation : ≈ 0,25 en moyenne dans la littérature (Chetty, Guren, Manoli et Weber, 2013), 0,1 à 0,3 pour les bas revenus en Europe (Bargain, Orsini et Peichl, 2014) ; prime d'activité 2019 : pas d'effet causal établi (Bozio et al., IPP, 2023), d'où la crise à zéro. Base : 1 926 000 personnes dans le halo autour du chômage en 2025 (Insee)"
    note: "Canal ajouté le 29/10/2026 : des inactifs (halo du chômage) prennent un emploi parce que travailler rapporte plus. Emplois = élasticité × variation du log de la part gardée en travaillant (1 − taux de prélèvement à la participation, moyenne du mi-temps et du temps plein au SMIC, système actuel par OpenFisca contre nouveau système) × base. Ils s'ajoutent à l'emploi sans réduire le taux de chômage (ces personnes n'y sont pas comptées) ; coût employeur 0,75 SMIC (mi-temps et temps plein). Distinct du canal « bas salaires » (chômeurs)."
