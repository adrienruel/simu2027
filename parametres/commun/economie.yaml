    unite: sans_unite
    statut: HYPOTHESE
    source: "Kilponen, Pisani, Schmidt et al., Comparing fiscal multipliers across models and countries in Europe (Banque nationale de Belgique, WP n° 278, 2015), multiplicateurs de première année dans les modèles de la zone euro : consommation publique 0,5 à 0,98 ; impôt sur le travail 0,04 à 0,51 ; impôt sur le capital 0,02 à 0,65 ; impôt sur la consommation 0,14 à 0,72. Coenen et al., Effects of Fiscal Stimulus in Structural Models (AEJ Macroeconomics, 2012) : transferts ciblés sur les ménages contraints proches de la dépense, transferts généraux plus faibles. Gechert (2015, méta-analyse) : multiplicateurs de dépense supérieurs à ceux des impôts"
    v_avant_e: {cout_travail: 0.4}
