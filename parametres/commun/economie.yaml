# Canal d'offre commun (6 novembre 2026) : effet de long terme d'un changement de prélèvement ou de transfert sur le
# PIB, par instrument, appliqué à tous les programmes chiffrés sur le noyau (moteur/offre.py). Valeurs en % de PIB à
# long terme pour 1 point de PIB de prélèvement en moins (ou de transfert aux actifs en moins). Le scénario donne
# l'élasticité quand la mesure joue pour le programme (baisse d'impôt) ; quand elle joue contre lui (hausse), on prend
# le scénario miroir (crise ↔ optimiste, prudent ↔ médian), pour que le prudent reste prudent dans les deux sens.
