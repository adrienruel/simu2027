    source: "Part des salariés qui vivent en couple ≈ 60 % (Insee, enquête Emploi) ; les seconds apporteurs (surtout des femmes) réagissent davantage au gain à travailler du ménage : élasticités de participation des femmes en couple ≈ 1,5 à 2 fois celles des personnes seules (Bargain, Orsini et Peichl, Journal of Human Resources, 2014)"
