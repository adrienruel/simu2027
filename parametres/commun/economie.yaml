# --- Effets macroéconomiques (feuille Effets macro), un jeu par scénario ----------------
# Crise : valeurs de la feuille « Scénario de crise » de la v235 (anciennes valeurs « prudent ») ; à défaut, celles du prudent.
macro:
  convergence_scenarios_annees: {valeur: 3, unite: sans_unite, statut: HYPOTHESE, note: "Années pour que chaque scénario atteigne ses propres hypothèses à partir de la valeur prudente de 2029 (poids 0 en 2029, 1/3 en 2030, 2/3 en 2031, 1 en 2032). Sans montée, le passage brutal de 2029 à 2030 ferait baisser le chômage de l'optimiste de près de 2 points en un an. Hypothèse : l'information sur les comportements arrive en deux à trois ans."}
  annees_montee_emploi:
    source: "Encadrement : Duval (FMI, 2012) sur les réformes Hartz ; Banque de France, Bulletin n° 264 (2026)"
    valeur: {crise: 8, prudent: 7, median: 6, optimiste: 5}
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "v215 (22 octobre 2026) — ÉTAYÉ : une réforme de l'assurance chômage produit l'essentiel de son effet en 3 ans et tout en 5 (Duval, FMI, 2012, sur les réformes Hartz) ; l'apprentissage agit plus tard (Banque de France, Bulletin n° 264, 2026), le logement plus lentement encore. Prudent 7 ans, médian 6, optimiste 5 : la source est la borne optimiste. | Avant : v198, DÉCISION d'Adrien du 21 octobre : optimiste = « tout le monde joue le jeu ». Optimiste : montée en charge plus rapide de l'emploi, ancien optimiste (avant : 5.5)."
  multiplicateur:
    source: "Encadrement : Auclert, Philippon et Ragot (CAE, Focus n° 108, 2024) : 1 ; FMI (2012) : 0,5 avant crise, 0,9 à 1,7 en crise"
    valeur: {crise: 1.3, prudent: 1.0, median: 1.0, optimiste: 0.5}
    v235: {crise: 1, prudent: 0.75, median: 0.5, optimiste: 0.3}
    note: "DÉCISION d'Adrien du 29/10/2026 : se caler sur les experts. Prudent et médian : 1, valeur du CAE (Auclert, Philippon et Ragot, Focus n° 108, 2024) ; crise : 1,3, milieu de la fourchette du FMI en période de crise (0,9 à 1,7, Perspectives de l'économie mondiale, octobre 2012) ; optimiste : 0,5, valeur des prévisionnistes avant 2008 (FMI). La v235 retenait 0,3 en optimiste, sans source transposable."
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "Prudent : multiplicateur de 1, valeur retenue par Auclert, Philippon et Ragot (CAE, Focus n° 108, juillet 2024). Médian : 0,5, valeur que les prévisionnistes retenaient avant la crise de 2008 (FMI, Perspectives de l’économie mondiale, octobre 2012, qui trouve ensuite 0,9 à 1,7 dans les années de crise ; revue d’É. Heyer, OFCE). Optimiste : 0,3, HYPOTHÈSE, pour un ajustement portant surtout sur la dépense (Alesina et Ardagna, 2009, sans valeur transposable). En temps normal, la dépense a un effet plus fort que l’impôt (Gechert, Hughes Hallett et Rannenberg, 2015). | v198, DÉCISION d'Adrien du 21 octobre : optimiste = « tout le monde joue le jeu ». Optimiste : multiplicateur de 0,3, valeur optimiste de la note : la confiance compense l'ajustement (avant : 0.4)."
  annees_effet_ajustement:
    valeur: {crise: 5, prudent: 4.5, median: 4, optimiste: 3}
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "L’effet décroît linéairement. | v198, DÉCISION d'Adrien du 21 octobre : optimiste = « tout le monde joue le jeu ». Optimiste : effet récessif dissipé en trois ans, ancien optimiste (avant : 3.5)."
  eviction:
    valeur: {crise: 0.2, prudent: 0.175, median: 0.15, optimiste: 0.1}
    unite: sans_unite
    statut: SOURCE
    source: "Chetty et al. (2014), Danemark"
    note: "Chetty et al. (2014). Doublon de consommation.eviction_epargne_volontaire, à fusionner."
