    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : élasticités de participation au revenu net plus fortes en bas de l'échelle des salaires (Immervoll, Kleven, Kreiner et Saez, Economic Journal, 2007 : 0,1 à 0,4 en Europe ; Bargain, Orsini et Peichl, Journal of Human Resources, 2014, pour la France) ; Chetty, Guren, Manoli et Weber (2011) : ≈ 0,25 en moyenne macroéconomique (borne optimiste)"
    note: "Élasticités au gain à travailler (revenu disponible en emploi moins sans emploi), comme Immervoll et al. Calées pour que la suppression de la CSG sur le travail (calculée par OpenFisca) donne, pour 1 point de PIB, un effet sur le PIB dans la fourchette de la littérature macroéconomique : ≈ 0,3 % en crise, 0,4 % en prudent, jusqu'à ≈ 1 % en optimiste (Bassanini et Scarpetta, OCDE, 2001 : 0,3 effet direct, 0,6 à 0,7 avec l'investissement). Trois tranches de salaire brut (en multiples du SMIC de 2026) : jusqu'à 1,3 ; de 1,3 à 2,5 ; au-delà. Appliquées cellule par cellule aux distributions de salaires de 2026 (privé : Insee ; public : DGAFP), au revenu net calculé par OpenFisca (moteur/offre.py). Emplois venus de l'inactivité."
