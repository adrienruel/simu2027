  reformes_structurelles:
    valeur:
      pmr: {cinq_ans: 0.0072, dix_ans: 0.0102, long_terme: 0.0209}
      epl: {cinq_ans: 0.0022, dix_ans: 0.0057, long_terme: 0.0183}
      part_hors_emploi_epl: 0.75
      annee_long_terme: 25
      plafond: 2
      poids: {crise: 0, prudent: 0.5, median: 1, optimiste: 1}
      part_long_terme: {crise: 0, prudent: 0, median: 0.5, optimiste: 1}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Égert et Gal (2017), « The quantification of structural reforms in OECD countries: a new framework », OCDE, document de travail n° 1354, tableaux 3 et 4 : effet d'une réforme typique observée sur le PIB par habitant à 5 ans, 10 ans et long terme. Réglementation des marchés de produits (indicateur ETCR, −0,31 point) : +0,72 %, +1,02 %, +2,09 %. Protection de l'emploi des contrats réguliers (EPL, −0,30 point) : +0,22 %, +0,57 %, +1,83 %. Vérifié le 13/11/2026 sur la version de travail ECO/WKP(2016)78, tableau 4 (phase C2, docs/reformes_structurelles.md) ; la part hors emploi de l'EPL (0,75) reste une décision, le texte suggérant une part proche de 1 (effet par le capital)."
    note: "Barème commun des réformes de structure (12/11/2026, demande d'Adrien : évaluer les gains de productivité de façon équitable entre programmes). Chaque programme déclare, dans <nom>_canaux.reformes_structurelles, un nombre de réformes typiques par domaine, positif s'il libéralise, négatif s'il réglemente ou nationalise. Champ restreint à celui des deux indicateurs (relecture neutre n° 2, DÉCISION d'Adrien du 12/11/2026, docs/reformes_structurelles.md) : pmr = réglementation de l'électricité, du gaz, des télécommunications, de la poste, du rail, de l'aérien et du fret routier (ETCR : entrée, propriété publique, structure du marché, prix réglementés) ; epl = règles du licenciement des contrats réguliers. Hors champ pour tous : normes générales, simplification, commande publique, banques, autoroutes, aéroports, audiovisuel, santé, logement, commerce. Grille : 1 = un secteur entier du champ (nationalisation, refonte, contrat unique, interdiction des licenciements), 0,5 = mesure ciblée dans un secteur du champ (une grande entreprise, prix réglementés, entrée interdite ou facilitée sur un segment). Plafond ±2 par domaine : au-delà, les élasticités moyennes de l'OCDE sortent de leur domaine d'estimation. Trajectoire : linéaire jusqu'à l'effet à 5 ans, puis à 10 ans, puis vers le long terme (atteint après 25 ans). Scénarios d'une libéralisation : crise 0 ; prudent la moitié de l'effet à 10 ans, sans long terme (mesures annoncées, mise en œuvre incertaine) ; médian l'effet à 10 ans puis la moitié du chemin vers le long terme ; optimiste l'effet complet. Une réglementation prend le scénario miroir (crise ↔ optimiste, prudent ↔ médian), comme le canal d'offre commun. Protection de l'emploi : trois quarts de l'effet seulement (part hors emploi, l'effet sur l'emploi passant déjà par les mesures chiffrées ; décote prudente, non tirée de l'article : à sourcer). Le PIB en plus rapporte au solde le dividende de productivité du statu quo (statu_quo.dividende_productivite). Non comptés : ouverture commerciale (compétence européenne), logement (absent du cadre de l'OCDE)."
  ia_productivite:
    source: "Encadrement : Acemoglu (2024) : 0,07 point par an ; Aghion et Bunel (2024) : 0,27 à 0,4 (fourchette 0,07 à 1,24)"
    valeur: {crise: 0.0007, prudent: 0.0007, median: 0.0027, optimiste: 0.00475}
    v235: {crise: 0.001, prudent: 0.00185, median: 0.0027, optimiste: 0.00475}
    note: "DÉCISION d'Adrien du 29/10/2026 : crise et prudent prennent la source la plus prudente, Acemoglu (2024), 0,07 point par an pendant dix ans ; médian 0,27 (Aghion et Bunel, bas de leur fourchette) ; optimiste 0,475. v235 : 0,10 en crise et 0,185 en prudent (milieu crise-médian)."
    unite: sans_unite
    statut: HYPOTHESE
    note_v235: "SOURCÉ : Acemoglu (2024) ≈ 0,07 point par an sur dix ans (prudent) ; Aghion et Bunel (2024) : 0,27 à 0,4 point selon les gains mesurés tâche par tâche (médian : 0,27), médiane de leur fourchette 0,68 point (optimiste), fourchette 0,07 à 1,24. Repères de la Commission de l’IA (2024) : électricité en Europe +1,3 point pendant dix ans, numérique aux États-Unis +0,8 point de 1995 à 2006. Le COR (0,7 %) ne compte pas cet effet à part. | v209 (22 octobre 2026), DEMANDE d’Adrien : compter la hausse de la demande d’IA due à la baisse des coûts. SOURCÉ : le coût d’une requête de niveau GPT-3.5 a été divisé par 280 entre novembre 2022 et octobre 2024 (Stanford, AI Index 2025) ; l’usage de l’IA par les entreprises françaises a triplé de 2023 à 2025 (Insee). L’estimation basse d’Acemoglu (0,07 point) suppose que seuls 23 % des tâches exposées sont rentables à automatiser au coût actuel (Svanberg et al., MIT, 2024). Ces auteurs montrent que si le coût des systèmes baisse de 50 % par an, la moitié des tâches devient rentable en trois ans ; s’il baisse de 10 % par an, moins de la moitié en 2042. Crise : baisse de 10 % par an, part rentable portée à ≈ un tiers en moyenne sur la décennie, soit 0,07 × 33 / 23 ≈ 0,10 point. Prudent : milieu entre crise et médian, 0,185 point (avant : 0,17). Médian et optimiste inchangés : Aghion et Bunel comptent déjà une diffusion large."
