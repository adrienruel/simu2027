    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : élasticité des heures au salaire net faible en France, 0 à 0,2 (Bargain, Orsini et Peichl, 2014 ; Chetty, 2012 : ≈ 0,3 au plus pour l'élasticité hicksienne)"
  travail_couples:
    valeur: {crise: [0.6, 1.0], prudent: [0.6, 1.2], median: [0.6, 1.3], optimiste: [0.6, 1.5]}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Part des salariés qui vivent en couple ≈ 60 % (Insee, enquête Emploi) ; les seconds apporteurs (surtout des femmes) réagissent davantage au gain à travailler du ménage : élasticités de participation des femmes en couple ≈ 1,5 à 2 fois celles des personnes seules (Bargain, Orsini et Peichl, Journal of Human Resources, 2014)"
    note: "[part des salariés en couple, élasticité relative des couples]. Pour les réformes calculées par OpenFisca (incidence openfisca:<réforme>), le gain à travailler d'une part des salariés est celui d'un second apporteur en couple (outils/openfisca_offre.py), avec cette élasticité relative ; le reste, celui d'une personne seule."
