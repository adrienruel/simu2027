# --- Emploi : quatorze réformes (feuille Emploi) -------------------------------------
# Colonnes de la v235 : crise (« ancien prudent »), médian, optimiste. Le prudent des effets macro
# prend le milieu de la crise et du médian pour les emplois créés (Effets macro!B8), mais la valeur
# de crise pour les emplois perdus (fin des subventions, prime d'embauche).
emploi:
  chomage_incompressible: {valeur: 0.035, unite: taux, statut: SOURCE, source: "Taux les plus bas tenus durablement en Europe de l'Ouest (Allemagne, Pays-Bas)"}
  marge_plancher: {valeur: 0.01, unite: taux, statut: HYPOTHESE, note: "13/11/2026 : à moins de cette marge au-dessus du chômage incompressible, les emplois en plus des programmes ont des rendements décroissants (moteur/emploi_canaux.plancher_chomage) : le chômage tend vers le plancher sans le franchir, raccord sans cassure au-dessus. Un point : l'écart entre le plus bas allemand récent (≈ 3 %) et les 4 % souvent cités comme plein emploi."}
  allocation_chomeur_evitee:
    valeur: 13850
    unite: eur_an
    annee_euros: 2026
    statut: HYPOTHESE
    source: "Microsimulation (outils/ppa_emplois.py, OpenFisca-France 177, population de 2026) : chaque chômeur de 18 à 64 ans prend un emploi à 1,3 SMIC ; allocation de chômage arrêtée 11 491 € (72 % indemnisés, 1 310 € bruts par mois : microsimulation.chomeurs_indemnises), RSA de sa famille −1 694 €, aides au logement −665 €, moyenne par chômeur ; population recalée le 22/11 (roadmaps 3.6 et 4.4), le 25/11 (taux de pauvreté de l'ERFS, non-recours) puis le 26/11 (bornes des poids, capital au point fixe : 13 950 € avant)"
    note: "Roadmap 2.4 (22/11/2026) : avant, 9 000 € encadrés (≈ 1 050 € par mois, un sur deux indemnisé, plus une part de RSA ; aides au logement non comptées) ; 10 660 € sur la population d'avant le recalage de la roadmap 3.6 (52 % de chômeurs indemnisés au lieu de 72 %). Répartie entre assurance chômage (part_allocation_assurance_chomage), aides au logement (part_allocation_logement) et RSA (le reste). Dépense publique évitée quand un chômeur prend un emploi (ou en plus quand un salarié perd le sien), commune à tous les programmes depuis la phase A2 (12/11/2026, ProgrammeSimple.valeur_emploi_cellule). Suit le salaire moyen par emploi. Phase L (4.1, 18/11/2026) : avec emploi.depenses_chomage_programme, elle n'est plus dans la valeur d'un emploi (recettes) mais dans les blocs chômage et pauvreté, pour les chômeurs du programme (moteur/noyau.py)."
  depenses_chomage_programme:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Roadmap du comparateur, phase 4.1 (18/11/2026) : les dépenses sensibles au chômage (assurance chômage, RSA) suivent les chômeurs du programme, et non ceux du statu quo. Chaque chômeur en plus ou en moins par rapport au statu quo change les blocs chômage et pauvreté de emploi.allocation_chomeur_evitee (au salaire de l'année) ; cette allocation sort alors de la valeur d'un emploi des canaux. Restent comptés par leur propre mesure : les canaux dont la mesure compte déjà le budget (nom en « * » : SMIC, emplois aidés, partage du travail…), les seniors (seniors.allocation_chomage) et la démographie (règle du statu quo sur la population du programme). false : comportement d'avant la phase L."
  generosite_programme:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Décision d'Adrien du 18/11/2026 (roadmap 5.4) : le coût d'un chômeur en plus ou en moins dépend du programme. Si le programme relève les allocations, chaque chômeur coûte plus cher. Facteur de chaque année = (bloc du statu quo + mesures du programme sur ce bloc) / bloc du statu quo, pour le bloc chômage (assurance chômage) et le bloc pauvreté (RSA, prime d'activité) ; seules les mesures de législation comptent (nature « mesure », hors mesures marquées volume : true, qui comptent des allocataires en moins et non une allocation plus basse). S'applique à tout ce qui suit le nombre de chômeurs : dépenses de chômage du programme (4.1), allocations des seniors, variante démographique. false : 9 000 € quel que soit le programme."
  prime_activite_emplois:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Décision d'Adrien du 18/11/2026 (roadmap 5.5) : un emploi en plus ouvre la prime d'activité. Montant lu sur la table OpenFisca de 2026 (personne seule) au coût d'un emploi créé (emploi.cout_emploi_cree_smic × SMIC, ≈ 2 140 € par an), indexé comme la prime du statu quo et multiplié par le facteur de générosité du bloc pauvreté ; ajouté au bloc pauvreté pour les mêmes emplois que les dépenses de chômage du programme (4.1). Roadmap 2.4 (22/11/2026) : multipliée par emploi.prime_activite_familles (famille des chômeurs, micro)."
