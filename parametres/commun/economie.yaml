    note: "RSA, prime d'activité, aides au logement, allocations familiales : moins de transferts aux actifs = un peu plus de travail. Emplois venus de l'inactivité. L'assurance chômage n'y passe pas quand le programme a déjà son propre canal (Tondelier, PRE-15)."
  elasticite_investissement_public:
    valeur: {crise: 0.1, prudent: 0.2, median: 0.33, optimiste: 0.5}
    unite: sans_unite
    statut: HYPOTHESE
    source: "DG Trésor, Mésange (2017) : hausse permanente de l'investissement public de 1 point de PIB, +0,33 % de PIB à long terme (médian) ; Bom et Ligthart (Journal of Economic Surveys, 2014, méta-analyse) : élasticité de la production au capital public ≈ 0,08 à 0,12, plus forte pour les infrastructures de base (optimiste)"
    note: "Dépense des mesures au poste investissement (sans autre instrument) : effet durable en plus du multiplicateur ; une baisse prend le scénario miroir. Emplois : 50 % de l'effet, pris sur le chômage. L'éducation n'a pas d'effet d'offre compté (effets trop lointains pour l'horizon des chiffrages)."
  education:
    valeur: {base_md: 155, age_scolaire: [6, 18], age_actif: [20, 64], part_travail: 0.6,
             gain_par_10pct: {crise: 0.25, prudent: 0.5, median: 1.0, optimiste: 2.0}}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Jackson et Mackevicius (méta-analyse, AEJ Applied, 2024) : 1 000 $ par élève et par an pendant quatre ans (≈ +8 % de dépense) : +0,035 écart-type aux tests et +2,8 points d'accès au supérieur ; Jackson, Johnson et Persico (QJE, 2016) : +10 % de dépense par élève sur toute la scolarité : +7 % de salaire adulte pour les enfants pauvres, effet plus faible pour les autres ; Chetty, Friedman et Rockoff (AER, 2014) : un écart-type de résultats ≈ 10 à 13 % de salaire ; DEPP, Repères et références statistiques : dépense intérieure d'éducation ≈ 194 Md€, dont ≈ 155 Md€ financés par l'État et les collectivités"
    note: "Phase 2 de la roadmap (11/11/2026) : effet d'offre de l'éducation, absent jusqu'ici. Salaire en plus pour 10 % de dépense par élève en plus sur toute la scolarité (6 à 18 ans) : 0,25 % (crise), 0,5 % (prudent), 1 % (médian), 2 % (optimiste), sous les 7 % de Jackson, Johnson et Persico, qui valent pour les enfants pauvres. Les générations entrent dans l'emploi à 20 ans : l'effet commence vers 2030 et n'atteint son plein qu'après 2070. Mesures concernées : instrument « education » (salaires et postes d'enseignants, classes, AESH, universités) ; pas les bâtiments, la cantine, les bourses ni le périscolaire. La revalorisation des enseignants compte comme une dépense par élève, comme dans ces études ; son effet propre est moins établi."
  recherche:
    valeur: {depreciation: 0.15, delai: 4, rendement: {crise: 0.05, prudent: 0.1, median: 0.25, optimiste: 0.5}}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Hall, Mairesse et Mohnen (Handbook of the Economics of Innovation, 2010) : rendements privés de la R&D ≈ 20 à 30 %, rendements sociaux plus élevés, preuves plus fragiles pour la recherche publique ; Fieldhouse et Mertens (Fed de Boston, 2023) : R&D publique non militaire aux États-Unis, rendement de 140 à 210 %, effet au bout de cinq ans environ ; Griliches (1979) : amortissement du stock de connaissances ≈ 15 % par an"
    note: "Phase 2 de la roadmap (11/11/2026). Dépense de recherche publique en plus (instrument « recherche ») accumulée en stock, amorti de 15 % par an ; ce stock rapporte du PIB après quatre ans : 5 % (crise), 10 % (prudent), 25 % (médian), 50 % (optimiste) par an, bien sous les 140 à 210 % de Fieldhouse et Mertens, pour tenir compte de la fragilité des preuves. Le crédit d'impôt recherche reste dans la fiscalité des entreprises (capital_entreprises)."
  vitesse:
    valeur: {crise: 0.08, prudent: 0.1, median: 0.1, optimiste: 0.12}
    unite: taux
    statut: HYPOTHESE
    source: "DG Trésor, Mésange (2017) : baisse des cotisations employeurs, 11 % de l'effet de long terme au bout d'un an, 40 % au bout de cinq ans, 60 % au bout de dix ans, soit un ajustement d'environ 10 % par an"
    note: "Part de l'écart à l'effet de long terme comblée chaque année (ajustement partiel), à partir de 2027."

# Macro bouclée (phase E de la roadmap, 14/11/2026) : moteur/bouclage.py
bouclage:
  forme:
    valeur: {a: 0.8599, b: 0.2908, c: 0.2735, kappa: 0.3516, phi: 0.1876, sigma: 0.2689, mu: 0.8434}
    unite: sans_unite
    statut: SOURCE
    source: "Calage par moindres carrés (outils/calibrer_bouclage.py) sur les variantes de Mésange 2017 (Bardaji et al., Insee, document de travail G2017/04), à taux réels et change nominal constants. Dépense publique générique de 1 point de PIB (p. 105) : PIB 0,78 / 1,06 / 1,03 / 0,86 / 0,53 / 0,16 à 1, 2, 3, 5, 10 ans et long terme ; prix de consommation 0,20 / 0,58 / 0,94 / 1,42 / 1,88 / 2,69. Hausse de 100 points de base des taux réels (p. 134) : PIB −0,17 / −0,60 / −0,78 / −1,00 à 1, 2, 3, 5 ans."
    note: "Forme retrouvée : PIB 0,86 / 1,05 / 1,02 / 0,83 / 0,48 / 0,19 (écart ≤ 10 % jusqu'à 10 ans, 19 % à long terme) ; prix 0,24 / 0,54 / 0,83 / 1,32 / 2,05 / 2,65 ; taux −0,27 / −0,55 / −0,77 / −1,01. a : effet d'impact ; b : persistance de la demande (accélérateur, consommation retardée) ; c : effet de la compétitivité-prix sur le PIB ; kappa : pente de la courbe de Phillips ; phi : part de l'impulsion gardée à long terme ; sigma et mu : effet retardé du taux réel. Le multiplicateur du scénario (macro.multiplicateur) met cette forme à l'échelle de son effet maximal."
  bce:
    valeur: {active: true, poids_france: 0.194, phi_pi: 1.5, phi_y: 0.5}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Poids de la France : PIB de 2024, 2 918 Md€ sur 15 044 Md€ pour la zone euro (Insee, Eurostat, repris par BNP Paribas, Petit atlas de l'économie française, mars 2025). Coefficients de la règle de Taylor (1993) : 1,5 sur l'inflation, 0,5 sur l'écart de production. Mésange ne modélise pas de réaction de la politique monétaire (Bardaji et al., 2017, conclusion)."
    note: "La BCE réagit à l'inflation et à l'écart de production de la zone, où la France pèse w. Taux réel de la zone en plus : w × ((1,5 − 1) × inflation + 0,5 × écart) ; l'effet qu'aurait une inflation propre à la France sur son taux réel (critique de Walters) n'est pas compté. Taux de marché : la France suit l'inflation de la zone (w × inflation française), pas la sienne."
  prix_offre:
    valeur: {cout_travail: {long_terme: -1.4, vitesse: 0.25}}
    unite: sans_unite
    statut: SOURCE
    source: "Mésange 2017 (Bardaji et al., Insee G2017/04, p. 107), baisse des cotisations employeurs de 1 point de PIB : prix de consommation −0,36 / −0,70 / −0,87 / −1,09 / −1,32 / −2,27 à 1, 2, 3, 5, 10 ans et long terme"
    note: "Effet d'un instrument sur les prix par les coûts (en % pour un point de PIB de baisse ; une hausse donne l'inverse) : niveau long_terme × (1 − (1 − vitesse)^(années + 1)), soit −0,35 / −0,61 / −0,81 / −1,07 / −1,33. Il change l'inflation (donc la dette réelle et les taux), pas le PIB : l'effet de la compétitivité sur le PIB est déjà dans le canal d'offre (offre.elasticite_cout_travail, calé sur Mésange)."

# Demande par instrument (6 novembre 2026) : le multiplicateur commun (macro.multiplicateur) vaut pour la dépense
# publique ; chaque mesure y entre avec un poids selon ce qu'elle est (moteur/offre.poids_demande).
demande:
  poids:
