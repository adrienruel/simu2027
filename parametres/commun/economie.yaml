entreprises:
  taux_effectifs: {valeur: {rentabilite: 0.20, taux_reel: 0.03, depreciation: 0.10}, unite: sans_unite, statut: SOURCE, source: "Projet type de l'OCDE pour les taux effectifs (Corporate Tax Statistics ; Hanappi, OECD Taxation Working Paper n° 38, 2018) : rentabilité 20 %, taux réel 3 % ; dépréciation moyenne ≈ 10 % (Banque de France, Bloc-notes Éco n° 64)", note: "Méthode Devereux et Griffith (1998, 2003)."}
  is_actuel: {valeur: {taux_reduit: 0.15, seuil_reduit: 42500, taux_normal: 0.25}, unite: sans_unite, statut: SOURCE, source: "CGI, art. 219"}
  incidence_menages:
    valeur: {salaires: 0.5, prix: 0.31}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Salaires : Fuest, Peichl et Siegloch, « Do Higher Corporate Taxes Reduce Wages? », American Economic Review, 2018 : environ la moitié de l'impôt local sur les bénéfices des entreprises (Gewerbesteuer) retombe sur les salaires. Prix : Baker, Sun et Yannelis, « Corporate Taxes and Retail Prices », NBER WP 27058 (2020, révisé en 2023) : 31 % de l'impôt sur les sociétés des États américains retombe sur les consommateurs (version de 2020 ; plus de 40 % dans la révision de 2023). Le reste (19 %) aux actionnaires"
    note: "Roadmap du comparateur, phase 4.3 (18/11/2026), architecture visée : ce que les mesures sur les entreprises (instrument capital_entreprises : IS, impôts de production, avec leur retour d'IS) laissent ou prennent aux entreprises arrive aux ménages en salaires (part salaires), en prix (part prix) et en revenus des actionnaires (le reste : dividendes et plus-values). Répartition publiée par décile de revenu initial par unité de consommation (moteur/incidence_entreprises.py, sorties/comparaison_incidence_entreprises.csv) ; prélèvements des ménages sur ces revenus : entreprises.incidence_retour_budget. Prix : roadmap 4.2 (22/11/2026), 0,31, borne basse de Baker, Sun et Yannelis (pas de source française ; les auteurs allemands ne mesurent pas les prix) ; avant, 0. Deux études, deux pays : la somme (81 % hors actionnaires) est une DÉCISION à valider par Adrien (Baker et al. seuls : salaires 38 %, prix 31 %, actionnaires 31 %). Hypothèse : salaires répartis au prorata des salaires du privé, actionnaires au prorata des dividendes et plus-values ; même calendrier que la mesure (l'effet sur les salaires met plusieurs années à venir dans la source)."
  incidence_retour_budget:
    valeur: true
    unite: sans_unite
    statut: DECISION
    note: "Décision d'Adrien du 18/11/2026 (roadmap 5.6) : les prélèvements des ménages sur les salaires et les dividendes que l'incidence leur apporte (ou leur retire) comptent au solde, sans double compte avec l'effet d'offre. Salaires : prélèvements au taux marginal du salaire moyen du privé (table OpenFisca 2026, ≈ 62 % du coût du travail), moins les recettes que l'effet d'offre du même instrument (capital_entreprises) compte déjà sur le PIB en plus, et jamais au-delà (même signe, même ordre de grandeur au plus). Actionnaires : entreprises.retour_dividendes. Mesure publiée : « Incidence : prélèvements des ménages ». false : répartition publiée sans effet sur le solde."
  retour_dividendes:
    valeur: {taux: 0.30, part_distribuee: 0.5, part_menages_residents: 0.5}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Taux : prélèvement forfaitaire unique, 12,8 % d'impôt sur le revenu (CGI, art. 200 A) et 17,2 % de prélèvements sociaux. Parts : hypothèses d'encadrement, sans source chiffrée retenue"
    note: "Phase 5.6 (18/11/2026). Sur la part des actionnaires : part versée en dividendes (le reste est gardé dans l'entreprise, sans impôt des ménages tout de suite) × part détenue par des ménages résidents (le reste va à des non-résidents ou à des institutions) × taux du PFU. Effet : 7,5 % de la part des actionnaires. À sourcer en priorité (comptes de la Nation, détention des actions cotées par la Banque de France)."
  ei_vers_is:
    valeur: {is_md: 70.5, taux_is: 0.25, benefices_pme_is_md: 111.5}
    unite: md_eur
    annee_euros: 2025
    statut: HYPOTHESE
    source: "Calcul sur DGFiP Statistiques n° 51 (septembre 2026), tableau 1 : IS brut 2025 70,5 Md€, taux normal 25 % ; bénéfices des TPE et PME à l'IS 65,9 + 78,5 Md€ (parametres/donnees/entreprises_tailles.csv) × 0,772 (champ hors finance et agriculture, microsimulation.entreprises_champ_esane)"
    note: "Roadmap 4.4 (22/11/2026) : IS par point de taux = 70,5 / 25 = 2,8 Md€ ; bénéfices des petites sociétés, base de la semi-élasticité de l'incorporation."
  semi_elasticite_incorporation:
    valeur: {crise: 0.5, prudent: 0.75, median: 1.0, optimiste: 1.25}
    unite: sans_unite
    statut: SOURCE
    url: "https://www.cpb.nl/sites/default/files/publicaties/download/corporate-tax-policy-and-incorporation-eu.pdf"
    page: "de Mooij et Nicodème, « Corporate tax policy and incorporation in the EU », CPB Discussion Paper n° 97 (2008), publié dans International Tax and Public Finance 15(4)"
    source: "Semi-élasticité de 1,0 : un point d'écart en plus entre le taux de l'impôt des personnes et celui de l'IS augmente de 1 % la part des entreprises en société ; 12 à 21 % des recettes d'IS européennes viendraient de ce déplacement"
    note: "Roadmap 4.4 (22/11/2026) : fourchette autour de l'estimation centrale (DÉCISION) ; ordonnée pour une hausse de l'IS (la crise regagne le moins de base) ; une baisse prend le scénario miroir."
  ecart_prelevement_ei_is:
    valeur: {crise: 0.15, prudent: 0.2, median: 0.2, optimiste: 0.25}
    unite: taux
    statut: DECISION
    source: "Encadrement : bénéfice d'un entrepreneur individuel au barème de l'impôt sur le revenu et aux cotisations des indépendants (≈ 45 % de prélèvements au total au revenu moyen) ; en société : IS (15 à 25 %), puis PFU sur la part distribuée ou cotisations sur la rémunération du dirigeant"
    note: "Roadmap 4.4 (22/11/2026) : prélèvement en moins par euro de bénéfice qui passe de l'entreprise individuelle à la société."
  retour_is_charges: {valeur: {taux_is_effectif: 0.20, part_marge: 0.5, part_employeurs_is: 0.9}, unite: sans_unite, statut: HYPOTHESE, source: "Taux effectif : population synthétique d'entreprises (outils/entreprises_mesures.py, 15/11/2026), IS retrouvé quand un impôt de production baisse, rapporté à la baisse, pertes de l'année calées sur la DGFiP 2025 (111,3 Md€, DGFiP Statistiques n° 51) : C3S et CFE 0,20 ; C3S et CFE industrielle 0,21 ; C3S, CFE et taxe foncière 0,20 ; CVAE 0,22 (0,25 avant le calage des pertes). Part prise sur les marges : 0,5, la valeur des programmes qui relèvent le SMIC (part_marge_absorbee)", note: "Impôts de production et cotisations patronales sont des charges déductibles : quand ils changent, la part prise sur les marges (le reste passe dans les prix) change le bénéfice imposable, donc l'IS, en sens inverse. Retour sur le solde = taux effectif × part des marges = 10 % de la variation. Même règle pour tous les programmes : mesures marquées deductible_is (true ou part de la mesure qui porte sur des charges des entreprises à l'IS), et hausses du SMIC (bibliotheque.smic). Cotisations patronales : 0,9 (0,45 si la mesure mêle cotisations salariales et patronales ou des particuliers employeurs), les associations (9,0 % de l'emploi privé) ne payant pas d'IS ; la micro compte déjà les entreprises individuelles à l'impôt sur le revenu. Impôts assis sur les salaires (taxe sur les salaires 15 Md€, versement mobilité 11 Md€, part des employeurs publics déjà retirée par les programmes) : part payée par des entreprises à l'IS 0,67 = (15 × 0,5 + 11 × 0,9) / 26 (DÉCISION) ; versement mobilité : associations 9,0 % de l'emploi privé (Recherches & Solidarités d'après l'Urssaf, 2022), d'où 0,9 ; taxe sur les salaires : produit venant largement des banques et assurances (réponses ministérielles), environ la moitié après retrait des employeurs publics d'après les impôts de production par secteur (DGFiP Statistiques n° 35 : finance 10,0 Md€, administrations, enseignement, santé et action sociale 17,4 Md€), le reste par des associations, cliniques et professions libérales hors IS. Constat du 15/11/2026 : le moteur ne comptait ce retour que pour le SMIC. À long terme, une partie des cotisations passe dans les salaires : non modélisé ici (le retour reste celui de court terme)."}
  impots_production_2023: {valeur: 92.7, unite: md_eur, annee_euros: 2023, note: "Traité comme euros de 2024 par la v235 (ligne 2 de Total × facteur 2024)", statut: SOURCE, source: "DGFiP Statistiques n° 35 (2025)"}
  impots_production_hors_marchand: {valeur: 17.4, unite: md_eur, annee_euros: 2023, statut: SOURCE, source: "DGFiP Statistiques n° 35 (2025)"}

