# --- Démographie (module de population annuel, 29 octobre 2026) -------------------------
# Projections de population de l'Insee (juin 2026), par âge et par année ; taux d'emploi par âge ; effet du
# programme sur la natalité. Voir moteur/demographie.py et docs/demographie.md.
demographie:
  scenario_fecondite:
    valeur: {crise: fec_basse, prudent: central, median: central, optimiste: fec_haute}
    unite: sans_unite
    statut: DECISION
    source: "Insee, projections de population 2026-2070 (Insee Résultats et Insee Première n° 2108, 8 juin 2026) : central 1,45 enfant par femme dès 2028, solde migratoire +150 000 par an ; fécondité basse 1,20 ; haute 1,70"
    note: "Correspondance proposée le 29/10/2026 et validée par Adrien (« Go »)."
  fecondite_variantes: {valeur: {fec_basse: 1.20, central: 1.45, fec_haute: 1.70}, unite: sans_unite, statut: SOURCE, source: "Insee, projections de population 2026 (Insee Première n° 2108)"}
  taux_emploi_age:
    valeur: {"15-24": 0.345, "25-49": 0.828, "50-54": 0.844, "55-59": 0.788, "60-64": 0.444, "65-69": 0.11, "70+": 0.0}
    unite: sans_unite
    statut: SOURCE
    source: "Insee, Emploi selon le sexe et l'âge, 2025 (15-24 : 34,5 % ; 25-49 : 82,8 % ; 50-64 : 69,2 %) ; Dares et COR (rapport annuel juin 2026, partie 4, chapitre 1) : 55-59 : 78,8 % ; 60-64 : 44,4 % ; 65-69 : environ 11 %"
    note: "50-54 ans calculé : 3 × 69,2 − 78,8 − 44,4 = 84,4 % (tranches de tailles voisines) ; recoupé : 84 % des personnes de 50 ans sont en emploi (COR). 70 ans ou plus : 0 (prudent, moins de 3 %). Taux figés à leur niveau de 2025 : la démographie seule fait varier l'emploi ; les hausses de l'emploi des seniors dues au programme sont comptées dans leurs mesures. La fin de la montée à 64 ans de la réforme de 2023 n'est pas comptée (prudent)."
  natalite_semi_elasticite:
    valeur: {crise: 0.02, prudent: 0.01, median: 0.01, optimiste: 0.005}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrement : allocation de naissance de 2 500 € en Espagne (2007-2010) : +3 % de naissances (González et Trommlerová, 2023), soit ≈ 2 % par 100 € par an d'enfance ; Israël, baisse de l'allocation de 150 shekels par mois (≈ 400 € par an) en 2003 : −7,5 % de fécondité (Cohen, Dehejia et Romanov, 2013) ; une grande part de ces effets est de calendrier (revue CFFP, Université de Sherbrooke, 2026)."
    note: "Variation relative des naissances pour 100 € par an de soutien en plus par enfant. Crise : borne haute (l'effet le plus défavorable si le soutien baisse) ; prudent et médian : la moitié, effets de calendrier retirés ; optimiste : le quart."
  natalite_montee: {valeur: 3, unite: sans_unite, statut: HYPOTHESE, note: "Années pour que l'effet sur les naissances soit plein, à partir de 2030 (premières naissances conçues sous le nouveau système)."}
  creches_effet:
    valeur: {crise: 0.0, prudent: 0.014, median: 0.028, optimiste: 0.028}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Bauernschuster, Hener et Rainer (Journal of the European Economic Association, 2016) : +10 points de couverture des moins de 3 ans en accueil public → +1,2 naissance pour 1 000 femmes, soit +2,8 % ; pas un simple effet de calendrier"
    note: "Hausse relative des naissances pour +10 points de couverture (mise à l'échelle des places créées : famille.creches_nouvelles). Médian et optimiste : l'estimation allemande ; prudent : la moitié (transposition à la France, où la couverture est déjà plus haute) ; crise : aucun effet. v235 : pas de places créées."

