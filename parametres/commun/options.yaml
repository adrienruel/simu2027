# Options du modèle, communes à tous les programmes : unités, modules activés, corrections de méthode.
# Un programme ne peut pas les redéfinir (moteur/parametres.py).


# --- Unités -----------------------------------------------------------------
unites:
  annee_modele:
    valeur: 2026
    unite: annee
    statut: DECISION
    note: Modèle en euros constants de 2026 ; l'économie de 2026 est placée en 2029.

# --- Système actuel (approximation par classe, remplacée par OpenFisca à l'étape 3) ---
# --- Entreprises ----------------------------------------------------------------
# --- Effets macroéconomiques (feuille Effets macro), un jeu par scénario ----------------
# Crise : valeurs de la feuille « Scénario de crise » de la v235 (anciennes valeurs « prudent ») ; à défaut, celles du prudent.
macro:
  bouclage:
    valeur: true
    v_avant_e: false
    unite: sans_unite
    statut: DECISION
    note: "Phase E de la roadmap, DÉCISION d'Adrien du 14/11/2026 : multiplicateur, prix et taux bouclés par une forme réduite calée sur Mésange 2017 (moteur/bouclage.py) au lieu d'un effet entier l'année de l'impulsion éteint en macro.annees_effet_ajustement ans. Faux : ancien calcul, à l'identique."
  bouclage_prime_demande: {valeur: true, unite: sans_unite, statut: DECISION, note: "Phase E1 (14/11/2026) : l'écart de taux de marché au statu quo pèse sur le PIB (bouclage.prime_demande). Faux : seulement sur les intérêts, comme avant."}
  bouclage_profils: {valeur: true, unite: sans_unite, statut: DECISION, note: "Phase E (14/11/2026) : TVA et accises, impôts sur le travail et cotisations employeurs suivent leur profil de Mésange (bouclage.profils_mesange) au lieu du poids de demande fixe et de la forme générique. Faux : forme générique."}
  capital_commun: {valeur: true, v_avant_e5: false, unite: sans_unite, statut: DECISION, note: "Phase E5 (14/11/2026, demande d'Adrien) : la fiscalité des entreprises passe par le stock de capital commun (moteur/capital.py), avec l'usure et la valeur d'un euro de capital des cohortes d'Écologie de droite (rendement net + usure ≈ 0,13 en prudent), au lieu de PIB × part du capital (0,35) × capital en plus, qui comptait environ deux fois plus. Faux : ancien calcul."}

# --- Santé année par année (feuille Santé) ------------------------------------------
sante_trajectoire:
  derive_prise_en_compte: {valeur: true, unite: sans_unite, statut: DECISION}

# --- Emploi : quatorze réformes (feuille Emploi) -------------------------------------
# Colonnes de la v235 : crise (« ancien prudent »), médian, optimiste. Le prudent des effets macro
# prend le milieu de la crise et du médian pour les emplois créés (Effets macro!B8), mais la valeur
# de crise pour les emplois perdus (fin des subventions, prime d'embauche).
# --- Déduction intégrale de l'investissement (feuille IS investissement, v210-v221) -------
# --- Démographie (module de population annuel, 29 octobre 2026) -------------------------
# Projections de population de l'Insee (juin 2026), par âge et par année ; taux d'emploi par âge ; effet du
# programme sur la natalité. Voir moteur/demographie.py et docs/demographie.md.
demographie:
  active: {valeur: true, v235: false, unite: sans_unite, statut: DECISION, note: "Population mise à jour chaque année (Adrien, 29/10/2026). v235 : population figée en 2026, tout suit la tendance de 0,7 %."}
  naissances_communes:
    valeur: true
    v_avant: false
    unite: sans_unite
    statut: DECISION
    note: "DÉCISION d'Adrien du 14/11/2026 : l'effet des mesures de soutien aux enfants sur les naissances s'applique à tous les programmes (moteur/naissances.py), avec la semi-élasticité commune demographie.natalite_semi_elasticite ; avant, seul Écologie de droite l'avait (ses ménages types et ses crèches, inchangés). Faux : ancien calcul."

# --- Ancien système : pensions génération par génération (29 octobre 2026) ---------------
# --- Cellules de ménages (moteur/cohortes.py, 29 octobre 2026) -----------------------------
# --- Carrières : effets des réformes de l'enseignement supérieur (moteur/carrieres.py, 29/10/2026) ---------
# --- Entreprises par taille (moteur/entreprises_cellules.py, 30/10/2026) ---------------------------------
# --- Inflation (moteur/inflation.py, 30/10/2026) -----------------------------------------------------------
inflation:
  active: {valeur: true, v235: false, unite: sans_unite, statut: DECISION, note: "Demande d'Adrien du 30/10/2026 : modéliser l'inflation année par année (scénarios publiés, plus l'inflation due au programme). v235 : 1,8 % chaque année (calendrier.inflation)."}

# --- Dépenses des ministères année par année (moteur/depenses/ministeres.py, 04/11/2026) -------------------
# --- Méthode de chiffrage (relecture et décisions du 05/11/2026) ---------------------------------

# --- Écologie (moteur/ecologie/) ------------------------------------------------------
# --- Publication du comparateur (roadmap du comparateur, phase 1, 16/11/2026) ---------------------------------
publication:
  seuil_couverture_deciles:
    valeur: 0.8
    unite: taux
    statut: DECISION
    note: "Roadmap du comparateur, phase 4.2 (18/11/2026) : les déciles de niveau de vie d'un programme ne sont publiés que si les mesures codées dans la microsimulation couvrent au moins cette part du budget « ménages » du programme (outils/couverture_micro.py : impôts et cotisations des ménages, transferts aux ménages, en valeur absolue, scénario prudent, 2032). En dessous, la pauvreté et le Gini restent publiés avec leur couverture, les déciles non."
  annee_couverture_deciles: {valeur: 2032, unite: annee, statut: DECISION, note: "Année où se mesure la couverture du budget « ménages » (phase 4.2), la même que la synthèse du comparateur."}
  seuil_dette_plausible:
    valeur: 200
    unite: pourcent
    statut: HYPOTHESE
    note: "Ratio de dette (% du PIB) au-delà duquel une trajectoire n'a plus valeur de prévision : un ajustement serait forcé avant (marchés, règles européennes). Le comparateur marque ces années (colonne hors_plausibilite de comparaison_trajectoire.csv) et les grise. 200 % reprend la colonne « Dette > 200 % » du comparateur ; décision D2 de la roadmap ouverte (horizon publié)."
