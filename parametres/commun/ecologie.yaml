# Écologie : statu quo physique et hypothèses communes à tous les programmes (moteur/ecologie/).
# Décision d'Adrien du 05/11/2026 : la baisse des émissions dépend de l'activité économique (population, revenu par
# habitant), du progrès technique et de la part de l'économie importée, au lieu d'un taux fixe.

ecologie:
  emissions_2025:
    valeur: {transports: 123.0, batiments: 54.6, industrie: 58.0, energie: 31.4, agriculture: 76.6, dechets: 15.4}
    unite: mt_co2e
    statut: SOURCE
    source: "Citepa, Secten 2026 (synthèse et messages clés, juin 2026) : 359 Mt CO2e hors UTCATF en 2025 (estimation) ; transports 123, usage des bâtiments 54,6 (climat réel), industrie manufacturière et construction 58, industrie de l'énergie 31,4, agriculture 76,6"
    note: "Déchets et divers obtenus par différence avec le total de 359 Mt (le Citepa donne les déchets vers 14 Mt ; l'écart tient aux arrondis et aux autres sources). Valeurs provisoires : à remplacer par l'inventaire définitif."
  emissions_2024_total:
    valeur: 367
    unite: mt_co2e
    statut: SOURCE
    source: "Citepa, Secten 2026 : 367 Mt CO2e hors UTCATF en 2024"
  elasticite_revenu:
    valeur: {transports: 0.5, batiments: 0.2, industrie: 1.0, energie: 0.7, agriculture: 0.0, dechets: 0.3}
    unite: sans_unite
    statut: HYPOTHESE
    note: "À technologie donnée, les émissions d'un secteur suivent la population et le revenu par habitant avec cette élasticité : fret et déplacements professionnels (transports), surfaces tertiaires (bâtiments), production (industrie), demande d'énergie (énergie) ; l'agriculture suit la population. Sert à séparer l'effet de l'activité de l'effet du progrès technique. À sourcer : décomposition de Kaya par secteur (SDES, Citepa)."
  baisse_intensite:
    valeur: {crise: -0.018, prudent: -0.022, median: -0.025, optimiste: -0.028}
    unite: taux
    statut: HYPOTHESE
    source: "Encadrée par le rythme observé : −1,8 % en 2024 et −2,2 % en 2025 (Citepa, Secten 2026 ; baromètre d'avril 2026 : −1,5 %), pour une activité en hausse d'environ 0,4 % par an"
    note: "Baisse annuelle des émissions par unité d'activité (progrès technique, électrification, sobriété), commune à tous les secteurs faute de série sectorielle sourcée. Prudent : le rythme de 2024-2025 continue (−1,8 % par an d'émissions avec la croissance du prudent). Crise : l'investissement se tasse ; médian et optimiste : plus d'investissement et de progrès technique. Avant 2029, valeur du prudent dans tous les scénarios (point de départ commun). Pour mémoire, les budgets de la SNBC-3 demandent environ −5 % par an d'ici 2033."
  importations_2024:
    valeur: {importees: 284, domestique: 279, residents: 404}
    unite: mt_co2e
    statut: SOURCE
    source: "SDES, L'empreinte carbone de la France de 1990 à 2024 (octobre 2025) : empreinte 563 Mt (8,2 t par habitant), dont 284 Mt importées, 180 Mt de production intérieure pour la demande intérieure et 99 Mt d'émissions directes des ménages ; émissions des unités résidentes 404 Mt"
    note: "La part domestique de l'empreinte (180 + 99 = 279 Mt) suit les émissions territoriales du modèle ; le reste des émissions résidentes (≈ 125 Mt) sert les exportations."
  baisse_intensite_importations:
    valeur: {crise: -0.01, prudent: -0.01, median: -0.015, optimiste: -0.02}
    unite: taux
    statut: HYPOTHESE
    note: "Baisse annuelle de l'intensité carbone des biens et services importés (décarbonation des pays fournisseurs). Sans source retenue : prise prudente pour l'empreinte (lente). À sourcer : intensité carbone du PIB mondial (Global Carbon Project, AIE)."
  penetration_importations:
    valeur: 0.0
    unite: taux
    statut: HYPOTHESE
    note: "Évolution annuelle de la part importée de la demande finale dans le statu quo. Stable par convention : commune à tous les programmes, elle ne change pas leurs écarts. Un programme qui relocalise passe par la clé physique « relocalisation_mt »."
  intensite_relocalisee:
    valeur: {crise: 0.7, prudent: 0.7, median: 0.5, optimiste: 0.4}
    unite: sans_unite
    statut: HYPOTHESE
    note: "Émissions en France d'une production relocalisée, rapportées à celles de la même production importée. Électricité peu carbonée, mais écart très variable selon les secteurs (acier, ciment, chimie). Prudent : gain faible. À sourcer (Carbone 4 et SEI, empreinte carbone de la France)."
  prix_carbone_statu_quo:
    valeur: {cce: 37.0, ets2: 54.0, debut_ets2: 2028}
    unite: eur_par_tco2
    annee_euros: 2026
    statut: SOURCE
    source: "Composante carbone des accises : 44,6 € par tonne, gelée depuis 2018 (loi de finances pour 2019), passée en euros de 2026 (≈ +20 % de prix) ; ETS2 : prix de stabilité de 45 € de 2020 (directive 2023/959), début reporté à 2028"
    note: "Prix payé sur les carburants et le chauffage sans programme, en euros constants de 2026. Gardé constant en réel : le prix de l'ETS2 pourrait monter, ce qui réduirait l'écart avec un programme à prix plus élevé."
  reponse_prix:
    valeur: {contenu_carbone_kg_par_euro: 1.3, elasticite: 0.6, ajustement: 0.35}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Encadrée : Labandeira, Labeaga et López-Otero (2017), méta-analyse des élasticités-prix de l'énergie, environ −0,2 à court terme et −0,6 à long terme ; contenu carbone : essence et gazole environ 2,3 à 2,6 kg de CO2 par litre pour environ 1,8 € le litre (≈ 1,3 kg par euro), gaz environ 0,2 kg par kWh pour environ 0,12 € (≈ 1,7 kg par euro)"
    note: "Hausse du prix final = (prix du carbone du programme − prix du statu quo, en €/t) × contenu carbone (kg par euro de dépense d'énergie) / 1 000 ; émissions = statu quo × (1 + hausse)^(−élasticité) à long terme, atteint par ajustement partiel (part de l'écart refermée chaque année). Correction du 05/11/2026 (question d'Adrien) : la version précédente appliquait la part de l'accise au prix du programme (35 %) à l'écart avec le prix du statu quo, ce qui triplait la hausse du prix (+86 % au lieu de +28 % en 2030 pour l'essence). Repère : la taxe carbone suédoise (environ 120 € par tonne) a baissé les émissions des transports d'environ 11 % (Andersson, 2019)."
  elasticite_croisee_electricite:
    valeur: {crise: 0.0, prudent: 0.0, median: 0.1, optimiste: 0.2}
    unite: sans_unite
    statut: HYPOTHESE
    source: "Labandeira, Labeaga et López-Otero (2017) : la plupart des études ne peuvent pas estimer les effets croisés, dont le potentiel de substitution vers des énergies moins polluantes est jugé réel mais non chiffré"
    note: "Baisse des émissions fossiles (chauffage, voitures) quand l'électricité devient moins chère : électrification plus rapide. Sans valeur sourcée : zéro en crise et en prudent, 0,1 en médian, 0,2 en optimiste (pour −23 % sur l'électricité, −2,6 % et −5,1 % à long terme)."
  budgets_carbone:
    valeur: {2024: 342, 2029: 262, 2034: 194}
    unite: mt_co2e
    statut: SOURCE
    source: "Décret n° 2026-636 du 16 juillet 2026 relatif aux budgets carbone nationaux et à la stratégie nationale bas-carbone (SNBC-3) : moyennes annuelles hors UTCATF, 342 (2024-2028), 262 (2029-2033), 194 (2034-2038)"
  objectif_2050:
    valeur: 80
    unite: mt_co2e
    statut: HYPOTHESE
    source: "SNBC-2 : environ 80 Mt d'émissions brutes en 2050 pour la neutralité carbone"
    note: "Après le cinquième budget (2034-2038), trajectoire droite jusqu'à cette valeur en 2050, puis stable. À remplacer par la valeur de la SNBC-3 si elle en publie une."

# --- Nouveau nucléaire (27/11/2026, demande d'Adrien) -------------------------------------------------------------
# « Pour ceux qui ne disent rien, il faut intégrer les nouveaux EPR qui vont être livrés, avec la conséquence sur le
# prix de l'électricité et la décarbonation. » Le statu quo compte les six EPR2 décidés (calendrier, prêt bonifié,
# contrat pour différence) ; un programme qui en ajoute, n'en veut pas ou sort du nucléaire passe par le canal commun
# `nucleaire` (moteur/nucleaire.py, moteur/canaux_declares.py) : budget, prix de l'électricité, électrification.
nucleaire:
  epr2:
    valeur: {nombre_statu_quo: 6, puissance_gw: 1.67, facteur_charge: 0.80, debut_financement: 2027, debut_supplementaires: 2029,
             premiere: {crise: 2041, prudent: 2040, median: 2039, optimiste: 2038},
             cadence_ans: {crise: 1.5, prudent: 1.5, median: 1.25, optimiste: 1.0}}
    unite: sans_unite
    statut: SOURCE
    source: "EDF, communiqué du 18/12/2025 (devis prévisionnel du programme EPR2) : mise en service du premier réacteur à Penly en 2038, cadencement de 12 à 18 mois pour les suivants ; six réacteurs (Penly, Gravelines, Bugey) ; 1 670 MW chacun ; environ 70 mois de chantier par réacteur"
    url: "https://www.edf.fr/groupe-edf/espaces-dedies/journalistes/tous-les-communiques-de-presse/edf-presente-son-devis-previsionnel-du-programme-epr2-a-hauteur-de-728-mdeu"
    page: "Communiqué du 18/12/2025"
    note: "Optimiste : calendrier d'EDF (2038, un réacteur par an) ; médian : un an de retard, 15 mois ; prudent : deux ans, 18 mois ; crise : trois ans (Flamanville 3 a pris douze ans de retard). Facteur de charge de 80 % (HYPOTHESE : parc existant ≈ 70 à 75 % ces dernières années, un réacteur neuf fait mieux). Les réacteurs au-delà des six du statu quo suivent à la même cadence. Financement : le prêt est tiré dès 2027 (PLF 2027 : 137,8 M€ de bonification cette année-là) ; chaque réacteur du statu quo est décaissé linéairement de 2027 à sa mise en service ; un réacteur en plus, décidé après l'élection, à partir de 2029."
  cout_reacteur_md:
    valeur: {crise: 16.7, prudent: 15.3, median: 13.9, optimiste: 13.9}
    unite: md_eur_2026
    statut: SOURCE
    source: "EDF, devis prévisionnel de décembre 2025 : 72,8 Md€ de 2020 pour les six EPR2, marges pour aléas comprises (hors frais financiers), soit 83,5 Md€ de 2026 (déflateur du PIB 2020-2025 : 1,130, Insee ; 2026 : +1,5 %) et 13,9 Md€ par réacteur"
    url: "https://www.edf.fr/groupe-edf/espaces-dedies/journalistes/tous-les-communiques-de-presse/edf-presente-son-devis-previsionnel-du-programme-epr2-a-hauteur-de-728-mdeu"
    page: "Communiqué du 18/12/2025"
    note: "Médian et optimiste : le devis ; prudent : +10 % ; crise : +20 % (le devis a déjà monté de 40 % depuis 2022)."
  pret:
    valeur: {part: 0.60, taux_ressource: 0.03, duree_remboursement: 35,
             bonification_apres: {crise: 1.0, prudent: 0.5, median: 0.5, optimiste: 0.0}}
    unite: sans_unite
    statut: SOURCE
    source: "Conseil de politique nucléaire du 12/03/2026 : prêt bonifié de l'État pour 60 % du programme, sur le fonds d'épargne de la Caisse des dépôts ; PLF 2027, article 69 (garantie à 100 %, remboursement sur 35 ans au plus ; 137,8 M€ de bonification en 2027) ; Cour des comptes, novembre 2026 : taux nul pour EDF pendant la construction, environ 1,5 Md€ par an à la charge de l'État vers 2035 pour un encours de 50 Md€ et une ressource à 3 %"
    url: "https://www.jechange.fr/banques/news/livret-a-epr2-bonification-pret-137-millions-2027-1-5-milliard-2035"
    page: "Article de novembre 2026 reprenant la note de la Cour des comptes et le PLF 2027"
    note: "Bonification = encours × taux de la ressource pendant le chantier de chaque réacteur ; après sa mise en service, part du taux de la ressource que l'État paie encore (HYPOTHESE : le taux d'EDF après la construction n'est pas publié) ; remboursement linéaire. Le prêt vient du fonds d'épargne, hors des administrations publiques : il ne compte pas dans la dette publique, seule la bonification passe au déficit."
  contrat_difference:
    valeur: {prix_exercice: 102.6, duree: 40, prix_marche: {crise: 60.0, prudent: 70.0, median: 80.0, optimiste: 90.0}}
    unite: eur_2026_par_mwh
    statut: SOURCE
    source: "Conseil de politique nucléaire du 17/03/2025 : contrat pour différence sur la production des EPR2 à un prix de 100 € de 2024 au plus par MWh (102,6 € de 2026), 40 ans ; sous ce prix, l'État compense EDF, au-dessus EDF reverse"
    url: "https://www.banquedesterritoires.fr/nucleaire-un-pret-sur-fonds-depargne-garanti-par-letat-pour-financer-le-programme-epr2"
    page: "Article du 12/03/2026"
    note: "Prix de marché de gros moyen, en € de 2026 par MWh (HYPOTHESE) : la Cour des comptes s'inquiète d'un prix sous 70 € ; prudent 70, médian 80, optimiste 90, crise 60. Versement de l'État = (prix d'exercice − prix de marché) × production, négatif (recette) quand le marché passe au-dessus."
  couts_systeme_rte:
    valeur: {M0: 80, M1: 77, M23: 71, N1: 66, N2: 61, N03: 59}
    unite: md_eur_2020_par_an
    statut: SOURCE
    source: "RTE, Futurs énergétiques 2050 (octobre 2021), coûts complets annualisés du système électrique à l'horizon 2060, trajectoire de référence : M0 ≈ 80, M1 ≈ 77, M23 ≈ 71, N1 ≈ 66, N2 ≈ 61, N03 ≈ 59 Md€ par an ; N1 : 8 EPR2, N2 : 14 EPR2, N03 : 14 EPR2, SMR et parc prolongé au-delà de 60 ans ; M0 : sortie du nucléaire en 2050, M1 et M23 : fermetures à 60 ans sans nouveau réacteur"
    url: "https://www.nouvelle-aquitaine.developpement-durable.gouv.fr/IMG/pdf/fiche_21_analyse_economique_et_environnemtale_fe2050.pdf"
    page: "Fiche 21 (analyse économique des scénarios), graphique des coûts complets"
    note: "Lecture commune (moteur/nucleaire.cout_systeme) : sans nouveau réacteur, moyenne de M1 et M23 (74) ; 8 EPR2 : N1 ; 14 : N2 ; interpolation linéaire entre ; 14 ou plus avec un parc prolongé au-delà de 60 ans : N03 ; jamais sous N03 ; sortie avant 2050 : M0. Le statu quo (6 EPR2) vaut 68. Le prix de l'électricité suit le coût complet du système (RTE : 645 TWh consommés en 2050), en écart au statu quo, monté linéairement de 2035 à 2060 (horizon des coûts de RTE). Le coût des EPR2 a monté de 40 % depuis 2021 : les écarts entre scénarios sont gardés tels que RTE les publie (l'actualisation des Futurs énergétiques est en cours)."
  electrification:
    valeur: {secteurs: [transports, batiments], debut: 2035, plein: 2060}
    unite: sans_unite
    statut: HYPOTHESE
    note: "Décarbonation par le prix de l'électricité : les émissions des transports et des bâtiments du statu quo × ratio de prix^(élasticité croisée) (ecologie.elasticite_croisee_electricite : 0 en crise et en prudent, 0,1 en médian, 0,2 en optimiste), par ajustement partiel comme pour le prix du carbone. Le gaz de secours d'une sortie (programmes/<nom>/parametres.yaml, <nom>_ecologie.sortie_nucleaire) reste compté à part."
